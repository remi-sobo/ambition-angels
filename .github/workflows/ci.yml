# CI — typecheck, lint, and unit tests on every PR (and pushes to main).
# The tests cover the games, the career library, the public forms' path to
# BloomOS, the website admin, and migration idempotency.
#
# `next build` is intentionally NOT run here: it needs runtime secrets
# (Stripe etc.). Type safety is covered by `tsc --noEmit`; correctness by
# vitest. Vercel builds every PR as a preview.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the workflow token (security/baseline-2026-11).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: |
          # next-env.d.ts is generated by `next build`; write the standard shim
          # so a standalone tsc resolves Next's ambient types.
          [ -f next-env.d.ts ] || printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
          npx tsc --noEmit

      - name: Lint (app)
        run: npm run lint

      - name: Lint (tests)
        run: npx eslint tests/

      - name: Unit tests
        run: npm test
