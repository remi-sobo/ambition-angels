# CI — typecheck, lint, and unit tests on every PR (and pushes to main).
#
# The existing workflows cover DB concerns (rls-test spins Postgres + checks
# the access matrix; db-migrate applies a file; db-backup dumps nightly) but
# nothing ran the TypeScript / ESLint / vitest gate. This is that gate, so the
# guards in tests/ (money + identity paths, migration idempotency) actually
# enforce on PRs instead of relying on a human to run them locally.
#
# `next build` is intentionally NOT run here: it needs runtime secrets
# (Stripe etc.) and fails at the data-collection step without them. Type safety
# is covered by `tsc --noEmit`; correctness by vitest.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: |
          # next-env.d.ts is generated by `next build`; write the standard shim
          # so a standalone tsc resolves Next's ambient types.
          [ -f next-env.d.ts ] || printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
          npx tsc --noEmit

      - name: Lint (app)
        run: npm run lint

      - name: Lint (tests)
        run: npx eslint tests/

      - name: Unit tests
        run: npm test
