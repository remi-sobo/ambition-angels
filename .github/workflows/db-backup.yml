# Nightly off-platform Postgres backup (BloomOS Ring 0).
#
# Why: Supabase Pro keeps 7 days of daily backups on-platform only. This job
# keeps an independent, encrypted copy outside Supabase so we survive
# account-level failure and get >7-day retention.
#
# Required repository secrets:
#   SUPABASE_DB_URL    — Postgres connection string (Session pooler URI from
#                        Supabase dashboard → Project Settings → Database).
#                        Use the SESSION pooler (port 5432): GitHub runners are
#                        IPv4-only and the direct db.<ref>.supabase.co host
#                        resolves IPv6-only, so a direct URI cannot connect.
#   BACKUP_PASSPHRASE  — strong passphrase used to encrypt dumps (store a copy
#                        in the org password manager; a lost passphrase means
#                        unrecoverable backups).
#
# Restore (locally):
#   gpg --batch --passphrase "$BACKUP_PASSPHRASE" -d backup.sql.gz.gpg | gunzip | psql "$TARGET_DB_URL"
#
# Encrypted dumps are stored as GitHub Actions artifacts (private to this
# repo) with 30-day retention. When BloomOS reaches Ring 4/5, move the
# destination to R2/S3 with object lock per docs/bloomos/03-architecture.md §8.
#
# Failure is loud: a failed run opens (or leaves open) a tracking issue
# labelled `backup-failure`, and a successful run closes it. This job ran red
# 85 times between 2026-06-12 and 2026-09-04 with nobody noticing, because a
# scheduled workflow that fails produces no signal anyone reads.

name: Nightly DB backup

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily (off-peak for US traffic)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"; exit 1
          fi
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges \
            --exclude-schema=storage \
            --exclude-schema=auth \
            --exclude-schema=realtime \
            --exclude-schema=supabase_functions \
            | gzip > backup.sql.gz
          ls -lh backup.sql.gz

      - name: Encrypt dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set"; exit 1
          fi
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            -o backup.sql.gz.gpg backup.sql.gz
          rm backup.sql.gz

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error

      # ---- alarm ---------------------------------------------------------
      # A silent scheduled job is the same as no job. On failure make sure
      # exactly one open issue tracks it; on success close whatever is open.
      # Uses the built-in GITHUB_TOKEN — no new secret to configure.

      - name: Open a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label backup-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already tracks this. Not opening another."
            exit 0
          fi
          gh label create backup-failure \
            --color B60205 \
            --description "Nightly off-platform DB backup is not running" \
            2>/dev/null || true
          cat > /tmp/backup-issue.md <<EOF
          The nightly off-platform database backup failed.

          Failing run: $RUN_URL

          **Until this is green the only backups that exist are Supabase's
          on-platform 7-day dailies.** There is no independent copy.

          Most likely cause is a missing or expired repository secret —
          \`SUPABASE_DB_URL\` or \`BACKUP_PASSPHRASE\`. See the header of
          \`.github/workflows/db-backup.yml\`.

          This issue closes automatically on the next successful run.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          gh issue create \
            --title "Nightly DB backup is failing" \
            --label backup-failure \
            --body-file /tmp/backup-issue.md

      - name: Close the tracking issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label backup-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --reason completed \
              --comment "Backup succeeded: $RUN_URL

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          done
