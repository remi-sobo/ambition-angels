# Nightly off-platform Postgres backup of the website database (games, career
# library, site analytics, form outbox). Supabase keeps 7 days on-platform;
# this keeps an independent, encrypted copy outside Supabase.
#
# Required repository secrets:
#   SITE_DB_URL        — the website database's Postgres connection string
#                        (Supabase dashboard → Project Settings → Database →
#                        Session pooler URI). Deliberately not SUPABASE_DB_URL:
#                        that secret held the BloomOS database before the repo
#                        split, and this job must never back that up here.
#   BACKUP_PASSPHRASE  — strong passphrase used to encrypt dumps (store a copy
#                        in the password manager; a lost passphrase means
#                        unrecoverable backups).
#
# Restore (locally):
#   gpg --batch --passphrase "$BACKUP_PASSPHRASE" -d backup.sql.gz.gpg | gunzip | psql "$TARGET_DB_URL"
#
# Encrypted dumps are stored as GitHub Actions artifacts with 30-day
# retention. This repo is PUBLIC, so any signed-in GitHub user can download
# an artifact: the only protection is BACKUP_PASSPHRASE. Keep it long and
# random (32+ characters), or move backups to private storage.

name: Nightly DB backup

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily (off-peak for US traffic)
  workflow_dispatch: {}

# Least privilege for the workflow token (security/baseline-2026-11).
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Postgres 17 client
        # Matches production's major version; an older pg_dump refuses to run.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump database
        env:
          SITE_DB_URL: ${{ secrets.SITE_DB_URL }}
        run: |
          # pipefail: without it a failed pg_dump still exits 0 through gzip
          # and the run goes green with an empty backup.
          set -euo pipefail
          if [ -z "$SITE_DB_URL" ]; then
            echo "::error::SITE_DB_URL secret is not set"; exit 1
          fi
          pg_dump "$SITE_DB_URL" \
            --no-owner --no-privileges \
            --exclude-schema=storage \
            --exclude-schema=auth \
            --exclude-schema=realtime \
            --exclude-schema=supabase_functions \
            | gzip > backup.sql.gz
          ls -lh backup.sql.gz
          size=$(stat -c %s backup.sql.gz)
          if [ "$size" -lt 100000 ]; then
            echo "::error::backup is only $size bytes; expected a few MB"; exit 1
          fi

      - name: Encrypt dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set"; exit 1
          fi
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            -o backup.sql.gz.gpg backup.sql.gz
          rm backup.sql.gz

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error
