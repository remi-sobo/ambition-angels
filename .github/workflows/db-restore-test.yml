# Backup restore test (BloomOS Ring 0).
#
# Proves the nightly backup can actually be restored. Downloads the newest
# successful db-backup artifact (or the run you name), decrypts it, restores it
# into a throwaway Postgres 17 container, and compares row counts table by
# table against production (counts only; no row data is read or printed).
#
# What a restore from this backup does NOT bring back, by design of
# db-backup.yml: the auth, storage, realtime and supabase_functions schemas
# (logins, uploaded files). Those come from Supabase's own daily backups.
# Foreign keys that point at auth.users therefore fail to re-attach here; the
# rows themselves restore. That class of error is reported, not failed on.
#
# Run it from the Actions tab ("Run workflow"). Monthly on the 1st as well.
#
# Secrets: SUPABASE_DB_URL (read-only count queries), BACKUP_PASSPHRASE.

name: DB restore test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "db-backup run id to restore (blank = newest successful)"
        required: false
        default: ""
  schedule:
    - cron: "41 10 1 * *" # 10:41 UTC on the 1st of each month

permissions:
  actions: read
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCRATCH: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Install Postgres 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Download the backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID:-}" ]; then
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow db-backup.yml \
              --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ]; then echo "::error::no successful db-backup run found"; exit 1; fi
          echo "Restoring backup from run $RUN_ID"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "db-backup-$RUN_ID" -D artifact
          ls -lh artifact

      - name: Prepare the Supabase platform pieces the dump expects
        run: |
          set -euo pipefail
          psql "$SCRATCH" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists "uuid-ossp" with schema extensions;
          create extension if not exists pg_trgm with schema extensions;
          do $$ begin create role anon nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin; exception when duplicate_object then null; end $$;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key, email text);
          create or replace function auth.uid() returns uuid language sql stable
            as $f$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $f$;
          create or replace function auth.role() returns text language sql stable
            as $f$ select nullif(current_setting('request.jwt.claim.role', true), '') $f$;
          create or replace function auth.jwt() returns jsonb language sql stable
            as $f$ select coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb $f$;
          SQL

      - name: Decrypt and restore
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "::error::BACKUP_PASSPHRASE secret is not set"; exit 1; fi
          start=$(date +%s)
          gpg --batch --quiet --passphrase "$BACKUP_PASSPHRASE" -d artifact/backup.sql.gz.gpg \
            | gunzip \
            | psql "$SCRATCH" -X -q -v ON_ERROR_STOP=0 -v VERBOSITY=terse >/dev/null 2> restore.err || true
          echo "Restore took $(( $(date +%s) - start ))s"
          total=$(grep -c 'ERROR' restore.err || true)
          echo "Restore errors: $total"
          # Messages only, with quoted values stripped so no row data reaches the log.
          grep 'ERROR' restore.err \
            | sed -E 's/^.*ERROR: +//; s/"[^"]*"/"…"/g; s/\([^)]*\)=\([^)]*\)/(…)=(…)/g' \
            | cut -c1-140 | sort | uniq -c | sort -rn | head -30 || true

      - name: Compare row counts with production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          q="select table_name || ',' || (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', table_name), false, true, '')))[1]::text
             from information_schema.tables
             where table_schema = 'public' and table_type = 'BASE TABLE'
             order by 1"
          psql "$SUPABASE_DB_URL" -X -At -c "$q" > prod.csv
          psql "$SCRATCH" -X -At -c "$q" > restored.csv
          echo "Public tables: production $(wc -l < prod.csv), restored $(wc -l < restored.csv)"
          awk -F, '
            NR==FNR { r[$1]=$2; next }
            {
              p=$2; tp+=p
              if (!($1 in r)) { missing++; print "MISSING  " $1 " (production rows: " p ")"; next }
              tr+=r[$1]; d=p-r[$1]; if (d<0) d=-d
              tol=(p*0.02>10)?p*0.02:10
              if (d>tol) { off++; print "DIFFERS  " $1 ": production " p ", restored " r[$1] }
            }
            END {
              printf "Rows: production %d, restored %d\n", tp, tr
              printf "Missing tables: %d, tables off by more than 2%% (or 10 rows): %d\n", missing, off
              if (missing>0 || off>0) exit 1
            }' restored.csv prod.csv
          echo "Restore test passed."
