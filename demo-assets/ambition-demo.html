 A doctor acts on what you found, and if you missed it, nobody catches it. Think of a time someone trusted you with something that mattered. What was it, and how did you handle it?',\n    writePlaceholder:'A job, a sibling, a team, a shift. Anything where it was on you.',\n    real:'The thing you just described, holding something that matters without being watched, is the whole job. People who need somebody checking their work are miserable in that dark room. People who like the weight of it stay twenty years.' },\n  { n:9, label:'YOUR CALL', kind:'you',\n    q:'Halfway through a scan you see something that looks wrong, and the patient is watching your face. What would you do?',\n    opts:[\n      { t:'Keep your face flat, finish the scan properly, say nothing', says:'This is what the job requires, and it’s harder than it sounds. Sonographers describe learning to hold a neutral face as the skill nobody warned them about.' },\n      { t:'Tell them you need the radiologist to look, without saying more', says:'Honest and legal. You can’t diagnose, and saying that plainly is often kinder than a blank face. Many experienced sonographers land here.' },\n      { t:'Ask them a few more questions to check what you’re seeing', says:'Good gut. More history often changes what an image means, and it’s a fair move mid-scan.' },\n      { t:'Tell them what you think you see', says:'Understandable, and not allowed. You’re not licensed to diagnose, and being wrong out loud can do real harm. This is the one the training drills out of you.' },\n    ],\n    real:'You will sometimes see something bad before anyone has said it out loud, and you can’t be the one to name it. You write what you saw and the radiologist calls it. Sonographers say that silence is the hardest part of the job.',\n    deeper:[{ employee:'CONFIRM: a senior sonographer', sponsor:'CONFIRM: partner hospital' }] },\n  { n:10, label:'HOW THE WORK FLOWS', kind:'order',\n    q:'One patient, start to finish. Tap the steps in the order they happen.',\n    steps:['You write up what you found','A doctor orders the scan for a reason','The radiologist reads it and makes the call','You run the probe and hunt for it'],\n    seq:[1,3,0,2],\n    real:'You’re the middle of a chain, not the end of it. The order matters because your write-up is what the radiologist reads first, and a vague one costs the patient another appointment.',\n    followUp:'How do you feel about someone else making the final call on your work?',\n    followUpOpts:['That takes pressure off','I could get used to it','I would want the final call','Not sure yet'] },\n  { n:11, label:'THE HONEST PART', kind:'mr',\n    q:'Myth or real?', statement:'The thing that ends most sonography careers is the emotional weight.',\n    options:['Myth','Real'], answer:0,\n    real:'It’s shoulders. You hold your arm up, pressing, for forty minutes at a time, ten times a day. Wear-and-tear injuries are common enough that people plan around them, which is why many move into leadership or teaching by their forties.',\n    followUp:'How do you feel about a job your body pays for?',\n    followUpOpts:['I would plan around it','I could handle it a while','That’s a dealbreaker','Not sure yet'] },\n  { n:12, label:'WHERE IT TAKES YOU', kind:'mc',\n    q:'Ten years in. Where can a sonographer end up?',\n    options:['Same room, same scans, forever','Lead tech, department manager, teaching, or a specialty like cardiac or vascular','Back to school for a medical degree, required','Nowhere, the field is shrinking'],\n    answer:1,\n    real:'Specialties stack on top of the license, and each one pays more: cardiac, vascular, breast, paediatric. Past that it’s lead tech, department manager, or teaching the program you came out of. The field should grow about 14% over ten years, much faster than average.',\n    source:'U.S. Bureau of Labor Statistics, 2023 to 2033 job growth estimates.' },\n  VERDICT_Q,\n];\n\nconst LINE_BEATS = [\n  { n:1, label:'THE REVEAL', kind:'mc',\n    q:'A line worker keeps the power on. What’s the job actually?',\n    options:['Wiring houses','Working the high-voltage lines between the plant and the street','Fixing appliances','Reading meters'],\n    answer:1,\n    real:'The lines outside, not the wiring inside. Transmission and distribution, up a pole or in a bucket truck, on equipment carrying enough voltage to kill you instantly. An electrician does the house. This is everything before the house.',\n    clip:{ caption:'Sixty seconds inside the job', sub:'CONFIRM: clip to be filmed with a line crew' } },\n  { n:2, label:'DAY TO DAY', kind:'mr',\n    q:'Myth or real?', statement:'Line work is mostly emergencies and storms.',\n    options:['Myth','Real'], answer:0,\n    real:'Most days are planned work: pole replacements, transformers, upgrades, inspections. 6:00 crew meeting and job briefing, three hours in the bucket, lunch in the truck, an afternoon on a transformer that keeps tripping. Storms are the exception, and they’re the part people remember.',\n    followUp:'How do you feel about being outside in whatever the weather is?',\n    followUpOpts:['That’s the appeal','I could handle it','I would rather be inside','Not sure yet'],\n    deeper:[{ employee:'CONFIRM: a journeyman line worker', sponsor:'CONFIRM: partner utility' }] },\n  { n:3, label:'WHO AND WHERE', kind:'mc',\n    q:'Who are you with all day?',\n    options:['Alone in a truck','The same crew of three or four, every day','Customers, constantly','A different team every job'],\n    answer:1,\n    real:'A small crew, and the same one. You brief together every morning and you depend on each other to not make a mistake. Crews describe it as closer than a job, which is either the best part or the worst part depending on who you are.',\n    clip:{ caption:'A day on a line crew', sub:'3:48 · CONFIRM: filmed at a pole replacement' } },\n  { n:4, label:'SKILLS', kind:'pick',\n    q:'Seven things. Pick the three that actually make someone good at this job.',\n    opts:['Following a safety rule you think is unnecessary','Upper body strength','Algebra and load calculations','Never getting scared','Being comfortable forty feet up','Working alone without instructions','Winning arguments'],\n    correctSet:[0,2,4],\n    real:'Following rules, math, and heights. The strength matters less than people think, and the algebra matters far more. Crews trust the person who follows the rule they disagree with, because the rule is written in somebody\\u2019s injury.' },\n  { n:5, label:'WHAT IT PAYS', kind:'slider',\n    q:'Drag to guess: what does a journeyman line worker make here?',\n    payReal:142000, payLabel:'$142,000', payWhen:'journeyman, San Mateo County',\n    lowNote:'Most people guess low. This is one of the highest-paying jobs in the country that needs no degree.',\n    highNote:'You aimed high and you were close. Storm overtime can push a year past even that.',\n    real:'Across the country it’s about $92,000. The Bay Area premium is real. Apprentices start near $60,000 and you earn the whole way, so you finish with no debt.',\n    stats:[{ k:'Apprentice start', v:'about $60,000' },{ k:'Journeyman here', v:'$142,000' }],\n    source:'U.S. Bureau of Labor Statistics, May 2024, plus IBEW Local 617 apprenticeship wage schedule.',\n    followUp:'How do you feel about earning while you train instead of paying tuition?' },\n  { n:6, label:'HOW YOU GET IN', kind:'hh',\n    q:'Head to head: which one needs more school before your first real paycheck in the field?',\n    hh:[{ t:'Electrical Line Worker', s:'High-voltage lines, outside, on a crew' },\n      { t:'Software Engineer', s:'Builds the apps and systems people use' }],\n    answer:1,\n    real:'Neither needs a four-year degree, but engineering usually takes one, or a bootcamp you pay for. Line work is a four-year paid apprenticeship, about 7,000 hours on the job plus classroom time, and you’re paid from week one. IBEW Local 617 runs it here.',\n    stats:[{ k:'Time to journeyman', v:'about 4 years' },{ k:'Tuition', v:'none, you’re paid' }] },\n  { n:7, label:'TIME AND LIFESTYLE', kind:'mc',\n    q:'It’s 2am in a storm. Where is the line worker?',\n    options:['Asleep. Crews work days','Out, for as long as it takes','On call but rarely called','It depends on the utility'],\n    answer:1,\n    real:'Storm work means being called out at 2am, in the rain, until the power is back. You will miss birthdays. Crews describe it as the best and worst part: the town has no power and you’re the reason it comes back.',\n    followUp:'How do you feel about being called out at 2am a few times a year?',\n    followUpOpts:['That sounds good to me','I could live with it','That’s a problem for me','Not sure yet'] },\n  { n:8, label:'IN YOUR WORDS', kind:'write',\n    wlabel:'On doing something physical',\n    q:'Line workers say the pull of the job is finishing something you can see. The lights come back on and you did that. Think of something physical you made or fixed. What was it, and how did it feel when it worked?',\n    writePlaceholder:'A bike, a fence, a car, a room you painted. Anything with your hands.',\n    real:'That feeling, work you can point at, is what almost every line worker names as the reason they stayed. Nobody in this trade describes their job as abstract, and people who need abstract work don’t last in it.' },\n  { n:9, label:'YOUR CALL', kind:'you',\n    q:'Your crew lead skips a step in the safety briefing. He has done this twenty years. What would you do?',\n    opts:[\n      { t:'Say it out loud, in front of everyone', says:'This is what the training tells you to do, and utilities back it in writing. Apprentices who do it are usually respected for it, though it takes nerve the first time.' },\n      { t:'Ask him about it quietly, off to the side', says:'Common, and it works. The risk is the rest of the crew never heard the correction, and the next job repeats it.' },\n      { t:'Follow it yourself and say nothing', says:'Understandable as the new person. The problem is that this specific habit, deferring to experience, shows up in most serious incident reports.' },\n      { t:'Report it to the foreman afterward', says:'Fair, and every utility has a channel for it. It also costs you something socially, which is why crews argue about whether it’s the right move.' },\n    ],\n    real:'This is the real test of this job, and it’s not about strength. Rules here are written from injuries, and the crews that stay whole are the ones where the newest person is allowed to stop the job.',\n    deeper:[{ employee:'CONFIRM: a crew foreman', sponsor:'CONFIRM: partner utility' }] },\n  { n:10, label:'HOW THE WORK FLOWS', kind:'order',\n    q:'A pole gets replaced. Tap the steps in the order they happen.',\n    steps:['You set the new pole and transfer the lines','The crew briefs the job and checks the hazards','The line is de-energised and grounded','Power is restored and tested'],\n    seq:[1,2,0,3],\n    real:'The briefing and the grounding come before anybody touches anything, every single time, including on the pole you have replaced a hundred times. Skipping to the third step is how people die in this trade.',\n    followUp:'How do you feel about the same safety ritual on every job, forever?',\n    followUpOpts:['That’s reassuring','I could get used to it','That would frustrate me','Not sure yet'] },\n  { n:11, label:'THE HONEST PART', kind:'mr',\n    q:'Myth or real?', statement:'The main risk in this job is the electricity.',\n    options:['Myth','Real'], answer:0,\n    real:'Electricity is the dramatic risk and the training is built around it. The one that actually ends careers is your body: shoulders, knees, and backs wear out, and not everyone is still climbing at fifty. Most move into troubleshooting, inspection, or crew leadership.',\n    followUp:'How do you feel about a job your body pays for?',\n    followUpOpts:['I would plan around it','I could handle it a while','That’s a dealbreaker','Not sure yet'] },\n  { n:12, label:'WHERE IT TAKES YOU', kind:'mc',\n    q:'Ten years in. Where can a line worker end up?',\n    options:['Same bucket, same pole, forever','Foreman, troubleshooter, inspector, or teaching the apprenticeship','Back to school for a degree, required','Out of work, the grid is shrinking'],\n    answer:1,\n    real:'Journeyman, then troubleshooter or foreman, then inspection or teaching. Grid work should grow, and the retirement wave in this trade is the reason apprenticeships keep opening. The ladder is off the tools, and everybody takes it eventually.',\n    source:'U.S. Bureau of Labor Statistics, 2023 to 2033 job growth estimates.' },\n  VERDICT_Q,\n];\n\n\n\n\n// Flatten to numbered items.\nconst COMPASS_ITEMS = (() => {\n  const out = [];\n  let n = 0;\n  for (const [section, ...items] of COMPASS) {\n    for (const [text, trait, dir] of items) {\n      n += 1;\n      out.push({ num: String(n).padStart(2,'0'), section, text, trait, dir, first: out.length === 0 || out[out.length-1].section !== section });\n    }\n  }\n  return out;\n})();\n\n// Last semester's answers, so change over time is real rather than asserted.\nconst PRIOR = { '01':4,'02':5,'03':1,'04':5,'05':4,'06':4,'07':2,'08':4,'09':3,'10':2,\n  '11':3,'12':3,'13':2,'14':2,'15':2,'16':4,'17':2,'18':4,'19':2,'20':4,\n  '21':5,'22':4,'23':2,'24':4,'25':4,'26':4,'27':3,'28':3,'29':3,'30':2,\n  '31':4,'32':3,'33':4,'34':1,'35':3,'36':5,'37':5,'38':4,'39':3,'40':4 };\n\n// Authored content is the single source of truth. Every chip, catalog row, depth note\n// and screen gate below is derived from these four maps, so nothing can advertise\n// something that has no content behind it.\n// The employer-framed internship catalog: thirty days on one project at one\n// place of work. Brought over from the MVP, where the employer, the project and\n// the career facts were already written.\nconst INTERNSHIPS = [\n  {id:'i1', title:'Teacher @ Middle School', f buying multiple items together.\",\n          \"kind\": \"description\"\n        },\n        {\n          \"text\": \"Build loyalty by offering something special.\",\n          \"kind\": \"description\"\n        },\n        {\n          \"text\": \"Keep these tips in mind:\",\n          \"kind\": \"subtitle\"\n        },\n        {\n          \"text\": \"- Select the right products\\\\n- Identify bundling types\\\\n- Communicate value\",\n          \"kind\": \"description\"\n        }\n      ],\n      \"hasVideo\": true\n    },\n    {\n      \"lines\": [\n        {\n          \"text\": \"Tip 1\",\n          \"kind\": \"description\"\n        },\n        {\n          \"text\": \"Select The Right Products\",\n          \"kind\": \"subtitle\"\n        },\n        {\n          \"text\": \"Decide which products go well together.\",\n          \"kind\": \"subtitle\"\n        },\n        {\n          \"text\": \"When items naturally fit, customers feel they’re getting more value.\",\n          \"kind\": \"description\"\n        }\n      ],\n      \"hasVideo\": true\n    }\n  ],\n  \"quiz\": [\n    {\n      \"prompt\": \"Which of these is a better definition of product bundling?\",\n      \"multi\": false,\n      \"options\": [\n        {\n          \"t\": \"Setting high prices for single items\",\n          \"ok\": false\n        },\n        {\n          \"t\": \"Selling multiple products together as a package for a lower price\",\n          \"ok\": true\n        }\n      ]\n    },\n    {\n      \"prompt\": \"What are the benefits of bundling? (select all that apply)\",\n      \"multi\": true,\n      \"options\": [\n        {\n          \"t\": \"Encourages customers to buy more\",\n          \"ok\": true\n        },\n        {\n          \"t\": \"A brand can highlight value\",\n          \"ok\": true\n        },\n        {\n          \"t\": \"A company can Increases sales\",\n          \"ok\": true\n        },\n        {\n          \"t\": \"Helps to build customer loyalty\",\n          \"ok\": true\n        }\n      ]\n    },\n    {\n      \"prompt\": \"What are some tips for bundling? (select all that apply)\",\n      \"multi\": true,\n      \"options\": [\n        {\n          \"t\": \"Select the right products to bundle\",\n          \"ok\": true\n        },\n        {\n          \"t\": \"Identify types of bundles\",\n          \"ok\": true\n        },\n        {\n          \"t\": \"Sell products individually only\",\n          \"ok\": false\n        },\n        {\n          \"t\": \"Communicate the value of the bundle\",\n          \"ok\": true\n        }\n      ]\n    }\n  ],\n  \"tasks\": [\n    {\n      \"lines\": [\n        {\n          \"text\": \"It’s great to have you back! Hope you’re ready to keep it going today.\",\n          \"kind\": \"subtitle\"\n        },\n        {\n          \"text\": \"For today’s intern task, you’ll:\",\n          \"kind\": \"description\"\n        },\n        {\n          \"text\": \"- Brainstorm products to bundle\\\\n- Assess bundling types\\\\n- Plan to communicate value\",\n          \"kind\": \"description\"\n        }\n      ],\n      \"hasVideo\": true\n    },\n    {\n      \"lines\": [\n        {\n          \"text\": \"Task 1\",\n          \"kind\": \"description\"\n        },\n        {\n          \"text\": \"Brainstorm Products\",\n          \"kind\": \"subtitle\"\n        },\n        {\n          \"text\": \"Think about which items make sense together.\",\n          \"kind\": \"subtitle\"\n        },\n        {\n          \"text\": \"Ensure products in a bundle complement one another.\",\n          \"kind\": \"description\"\n        }\n      ],\n      \"hasVideo\": true\n    },\n    {\n      \"lines\": [\n        {\n          \"text\": \"Task 2\",\n          \"kind\": \"description\"\n        },\n        {\n          \"text\": \"Identify Bundling Types\",\n          \"kind\": \"subtitle\"\n        },\n        {\n          \"text\": \"Decide which approach fits YAP’s brand and target customers.\",\n          \"kind\": \"subtitle\"\n        },\n        {\n          \"text\": \"Consider themed bundles designed around music festivals, or social causes.\",\n          \"kind\": \"description\"\n        }\n      ],\n      \"hasVideo\": true\n    },\n    {\n      \"lines\": [\n        {\n          \"text\": \"Task 3\",\n          \"kind\": \"description\"\n        },\n        {\n          \"text\": \"Plan To Communicate Value\",\n          \"kind\": \"subtitle\"\n        },\n        {\n          \"text\": \"Display this message on YAP’s website, in-store, or on social media.\",\n          \"kind\": \"subtitle\"\n        },\n        {\n          \"text\": \"Show the total value of the bundle vs. individual pricing.\",\n          \"kind\": \"description\"\n        }\n      ],\n      \"hasVideo\": true\n    }\n  ],\n  \"activity\": [\n    {\n      \"prompt\": \"Why do you think a scarf set and a T-shirt wouldn’t be the best option for bundling?\",\n      \"description\": \"Brainstorm a list of products that would make great bundles.\",\n      \"examples\": [\n        \"A scarf is for cold weather, but a T-shirt is for warmer days.\",\n        \"People usually don’t wear scarves with T-shirts.\",\n        \"It wouldn’t match well because a scarf is for winter, and a T-shirt is for summer.\"\n      ]\n    },\n    {\n      \"prompt\": \"Why do you think bundling a hoodie and a beanie could be good for winter?\",\n      \"description\": \"\",\n      \"examples\": [\n        \"A hoodie and beanie together keep you really warm.\",\n        \"They make a cozy outfit for cold days.\",\n        \"The beanie covers your head, and the hoodie covers your body.\"\n      ]\n    },\n    {\n      \"prompt\": \"What do you think about bundles designed around popular music festivals?\",\n      \"description\": \"Identify the best bundling type for YAP’s audience.\",\n      \"examples\": [\n        \"The bundle could have glow-in-the-dark items for night shows.\",\n        \"People would like clothes that look cool at festivals.\",\n        \"Music festivals are fun, so the bundle would feel exciting.\"\n      ]\n    }\n  ],\n  \"ai\": {\n    \"title\": \"Get feedback from A.I. (optional)\",\n    \"description\": \"If you want feedback on that activity, you can get some from our Ambition A.I.\",\n    \"warning\": \"But be aware, the A.I. is still learning, so it doesn’t always give perfect information.\"\n  },\n  \"record\": {\n    \"prompt\": \"Daily stand-ups are when everyone on the team shares what they accomplished that day. Record a video explaining what you worked on today for your internship and what you learned.\",\n    \"script\": \"1. Today I worked on...\\n2. I learned...\"\n  }\n};\n\nconst BEATS_BY_CAREER = {};        // playable, 13 authored beats\nconst DONE_INTRO = {};             // finished, opens a summary of what she answered\nconst DAYS_BY_CAREER = {};         // playable internship day\nconst STOPPED_INTERN = {};         // stopped, opens what she wrote\n\n// One owner for progress rendering. `current` is the step being worked on, and\n// `started` decides whether anything is lit at all, so an untouched item shows none.\nfunction progressStrip(len, current, started, done) {\n  return Array.from({ length: len }, (_, i) => {\n    if (done) return '#205FA6';\n    if (!started) return '#EDEFF2';\n    if (i < current - 1) return '#205FA6';\n    if (i === current - 1) return '#5A87BC';\n    return '#EDEFF2';\n  });\n}\n\nconst hasIntro = (id) => !!(BEATS_BY_CAREER[id] || DONE_INTRO[id]);\nconst hasIntern = (id) => !!(DAYS_BY_CAREER[id] || STOPPED_INTERN[id]);\nconst depthOf = (id) => hasIntern(id) ? 3 : hasIntro(id) ? 2 : 1;\n\n// Software engineering, written to the same spine. The reference build.\nconst SWE_BEATS = [\n  { n:1, label:'THE REVEAL', kind:'mc',\n    q:'What do software engineers actually do most of the day?',\n    options:['Type code as fast as possible','Figure out how things should work, then build them','Fix broken laptops and printers','Test video games'],\n    answer:1,\n    real:'Software engineers build the apps, games, and websites you use every day. The typing is the easy part. The real job is deciding how something should work, building it piece by piece, and fixing it when it breaks.',\n    clip:{ caption:'Sixty seconds inside the job', sub:'CONFIRM: clip to be filmed with an engineer' } },\n  { n:2, label:'DAY TO DAY', kind:'mr',\n    q:'Myth or real?', statement:'Software engineers spend most of their workday writing code.',\n    options:['Myth','Real'], answer:0,\n    real:'Most engineers write code for two to four hours a day. The rest goes to planning, meetings, and reading code other people wrote. You spend a lot of time understanding big systems that hundreds of people built together.',\n    followUp:'How do you feel about spending more of the day planning than typing code?',\n    deeper:[{ employee:'Jordan · Software Engineer', sponsor:'Twilio' }] },\n  { n:3, label:'WHO AND WHERE', kind:'mc',\n    q:'Who does a software engineer spend the most time with?',\n    options:['Nobody. They work completely alone','A small team of engineers, a designer, and a product manager','Customers, all day long','Investors and executives'],\n    answer:1,\n    real:'Most engineers work on a team of four to eight people. Some work in offices, and many work from home part of the week. You build things for millions of people, but you rarely meet them.',\n    clip:{ caption:'A full day, start to finish', sub:'CONFIRM: clip to be filmed on site' } },\n  { n:4, label:'SKILLS', kind:'pick',\n    q:'Seven skills. Pick the three that actually make someone great at this job.',\n    opts:['Breaking big problems into small steps','Typing 120 words per minute','Staying calm when nothing works','Memorising every programming language','Explaining ideas clearly in writing','Advanced calculus','Winning arguments'],\n    correctSet:[0,2,4],\n    real:'Great engineers break problems down, stay patient when code refuses to work, and write clearly so teammates understand them. You don’t need to be a math genius. Most coding uses less math than your algebra class.' },\n  { n:5, label:'WHAT IT PAYS', kind:'slider',\n    q:'Drag to guess: what does a first-year software engineer make per year?',\n    payReal:85000, payLabel:'$85,000', payWhen:'first year, national',\n    lowNote:'Most people guess low, and the number is one reason this field gets crowded.',\n    highNote:'You aimed high. That’s closer to what eight to ten years of experience pays.',\n    real:'Most first-year software engineers earn between $75,000 and $95,000. With eight to ten years of experience, $130,000 to $180,000 is normal.',\n    stats:[{ k:'Entry range', v:'$75K to $95K' },{ k:'Experienced range', v:'$130K to $180K' }],\n    source:'U.S. Bureau of Labor Statistics, May 2024. Typical pay for software developers: $133,080.',\n    followUp:'How do you feel about starting around $85,000 a year?' },\n  { n:6, label:'HOW YOU GET IN', kind:'hh',\n    q:'Head to head: which job needs more school before your first real paycheck in the field?',\n    hh:[{ t:'Software Engineer', s:'Builds apps and websites' },\n      { t:'Physical Therapist', s:'Helps people recover from injuries' }],\n    answer:1,\n    real:'A physical therapist needs about seven years of school. A software engineer can start with a four-year degree, a coding bootcamp, or even self-teaching. Employers mostly care about one thing: can you build?',\n    stats:[{ k:'Time', v:'4 years, or less' },{ k:'Other routes', v:'bootcamp, self-taught' }] },\n  { n:7, label:'TIME AND LIFESTYLE', kind:'mc',\n    q:'It’s Saturday. Where is the software engineer?',\n    options:['At the office. Weekends are required','Off. Most engineers work regular weekday hours','On call all weekend, every weekend','At a hackathon, always'],\n    answer:1,\n    real:'Most engineers work weekday hours, and many work from home part of the week. Big chunks of the day are quiet, focused, headphones-on work. A deadline sometimes means a late night, but weekends are usually yours.',\n    followUp:'How do you feel about regular weekday hours?' },\n  { n:8, label:'IN YOUR WORDS', kind:'write',\n    wlabel:'On building something',\n    q:'Engineers say the best part is making something real that other people use. Think of something you built or made, a project, a video, a game, a fix for something around the house. What was it, and who ended up using it?',\n    writePlaceholder:'A few sentences. Whatever comes to mind.',\n    real:'Engineers are hired to make things, and the ones who last are the ones who like the making. What you just described, deciding something should exist and then building it until it worked, is the same reflex, minus the job title.' },\n  { n:9, label:'YOUR CALL', kind:'you',\n    q:'You’re two days from a deadline and your part of the feature still doesn’t work. What would you do?',\n    opts:[\n      { t:'Tell the team today, with a plan for what you can finish', says:'You surface problems while there’s still time to react. Engineering leads say that instinct is rarer, and worth more, than raw coding speed.' },\n      { t:'Dig in alone tonight and try to crack it before anyone notices', says:'Sticking with it gets you far, and plenty of engineers work this way. The risk: a surprise on deadline day costs the team more than a warning two days out.' },\n      { t:'Ask a senior engineer to look at it with you', says:'Pairing on a hard problem is standard practice, not a confession. Teams that do it ship faster than ones where everyone struggles quietly.' },\n      { t:'Cut the feature down to the part you know works', says:'Shipping something smaller that actually works is a real engineering decision. Teams make this call constantly.' },\n    ],\n    real:'Engineers get a goal, not step-by-step instructions, so calls like this are the job. There’s no single right answer here, but notice what the good ones share: the team finds out before the deadline does.',\n    deeper:[{ employee:'Priya · Senior Engineer', sponsor:'Twilio' }] },\n  { n:10, label:'HOW THE WORK FLOWS', kind:'order',\n    q:'A new feature goes from idea to live. Tap the steps in the order they happen.',\n    steps:['Another engineer reviews your code','Write the code','Ship it and watch for bugs','Break the work into small tasks'],\n    seq:[3,1,0,2],\n    real:'Almost no code goes live without another engineer reading it first. Code review is where most of the learning happens in your first year, and why \"I work better alone\" is a hard sell on a team.',\n    followUp:'How do you feel about another engineer reading your work before it ships?',\n    followUpOpts:['I would want that','I could get used to it','I would rather work alone','Not sure yet'] },\n  { n:11, label:'THE HONEST PART', kind:'mr',\n    q:'Myth or real?', statement:'The most annoying part of this job is giant, dramatic disasters.',\n    options:['Myth','Real'], answer:0,\n    real:'The honest complaint is tiny details. One missing comma can break everything, and finding it can take hours. Some people find that maddening. If you’re the kind of person who likes getting small things exactly right, it turns into the fun part.',\n    followUp:'How do you feel about one missing comma costing you an afternoon?',\n    followUpOpts:['That’s the fun part','I could handle it','That would drive me crazy','Not sure yet'],\n    deeper:[{ employee:'Marcus · Staff Engineer', sponsor:'Twilio' }] },\n  { n:12, label:'WHERE IT TAKES YOU', kind:'mc',\n    q:'Ten years in. Where can a software engineer end up?',\n    options:['Stuck in the same seat forever','Senior engineer, team lead, or founder of their own company','They have to go back to school to keep the job','Retired at 32, guaranteed'],\n    answer:1,\n    real:'The ladder runs junior, mid, senior, then staff engineer or engineering manager. The same skills open doors to game development, robotics, AI, and starting your own company. Jobs should grow 17% by 2033, much faster than average.',\n    source:'U.S. Bureau of Labor Statistics, 2023 to 2033 job growth estimates.' },\n  VERDICT_Q,\n];\n\n// Levels 2 and 3. Level 1 asks what the job is. Level 2 has her do one real\n// task. Level 3 gives her a whole service where earlier calls change later ones,\n// and she leaves with something she made.\n// Life lessons run on the same unit engine as levels 2 and 3, five units instead\n// of seven. Same spine every time: the situation, sort the real from the fake,\n// say it or find it, make your own, then what you took.\nconst LESSON_SPINE = ['THE SITUATION','REAL OR NOT','SAY IT','MAKE YOUR OWN','WHAT YOU TOOK'];\n\n// The eight categories of durable skills, named the way employers name them.\nconst LESSON_CATS = [\n  { id:'thinking', label:'Critical thinking', color:'#455A64',\n    blurb:'Deciding what to believe, and what to do when you can’t be sure.' },\n  { id:'comms', label:'Communication', color:'#37474F',\n    blurb:'Saying the thing, in a way that gets you the outcome and keeps the person.' },\n  { id:'ideas', label:'Creativity', color:'#455A64',\n    blurb:'Having somewhere else to go when the obvious plan is blocked.' },\n  { id:'people', label:'Working with people', color:'#37474F',\n    blurb:'Being new, being corrected, and being someone a team wants around.' },\n  { id:'self', label:'Managing yourself', color:'#455A64',\n    blurb:'Doing what you said you would do, without anybody standing over you.' },\n  { id:'pressure', label:'Handling pressure', color:'#37474F',\n    blurb:'Setbacks, boredom, and being wrong in front of people.' },\n  { id:'hired', label:'Getting hired', color:'#455A64',\n    blurb:'Interviews, what to put on paper, and what to say about money.' },\n  { id:'money', label:'Money', color:'#37474F',\n    blurb:'Paychecks, rent, credit, and the numbers nobody explains to you.' },\n];\n\n// The full lesson catalog. Anything without a built flag is honest about it.\nconst LESSON_CATALOG = [\n  { id:'ll-thinking', cat:'thinking', title:'Telling a claim from a fact', built:true, status:'Done',\n    hook:'A post with 40,000 likes says the trades are dying. Two questions tell you whether to believe it.' },\n  { cat:'thinking', title:'Deciding when you can’t know enough',\n    hook:'You will never have all the information. What good decisions look like anyway.' },\n  { cat:'thinking', title:'Spotting the argument inside the number',\n    hook:'Every statistic was collected by somebody, for a reason. How to find the reason.' },\n  { cat:'thinking', title:'Changing your mind on purpose',\n    hook:'What it takes to drop a position you have defended out loud.' },\n\n  { id:'ll-comms', cat:'comms', title:'Saying the hard thing without making it worse', built:true, status:'Done',\n    hook:'Somebody hasn’t done their part and has stopped replying. Warm about the person, exact about the thing.' },\n  { cat:'comms', title:'Writing so people actually do the thing',\n    hook:'Why the polite version of your message gets ignored, and what to send instead.' },\n  { cat:'comms', title:'Listening past the first sentence',\n    hook:'Most people answer the question they expected. How to hear the one that was asked.' },\n  { cat:'comms', title:'Talking to somebody twice your age',\n    hook:'What changes and what doesn’t when the other person has thirty years on you.' },\n\n  { id:'ll-ideas', cat:'ideas', title:'Having a second idea', built:true, status:'Not started',\n    hook:'Creativity at work is almost never art. It’s having somewhere else to go when the obvious plan is blocked.' },\n  { cat:'ideas', title:'Stealing properly',\n    hook:'Every good idea you have had came from somewhere. How professionals do that on purpose.' },\n  { cat:'ideas', title:'Making the thing before you’re ready',\n    hook:'The gap between an idea and a version somebody can look at.' },\n\n  { id:'ll-feedback', cat:'people', title:'Taking a correction without defending yourself', built:true, status:'Done',\n    hook:'Four seconds decide how much anybody tells you for the rest of the year.' },\n  { id:'ll-help', cat:'people', title:'Asking for help without looking like you can’t do it', built:true, status:'Not started',\n    hook:'Every new person is stuck at some point. There’s a version of the question that makes you look good.' },\n  { cat:'people', title:'Being the new person',\n    hook:'Your first two weeks anywhere, and what people are actually deciding about you.' },\n  { cat:'people', title:'When somebody takes credit for your work',\n    hook:'It will happen. What to do that doesn’t cost you the room.' },\n\n  { id:'ll-follow', cat:'self', title:'Doing the thing you said you would do', built:true, status:'Not started',\n    hook:'The most valuable reputation at work is the most boring one to build.' },\n  { cat:'self', title:'Where your attention actually went',\n    hook:'Track a week honestly, then decide whether you like the answer.' },\n  { cat:'self', title:'Saying no without burning it down',\n    hook:'You can’t do everything you get asked. What to say instead of yes.' },\n\n  { id:'ll-boring', cat:'pressure', title:'When it’s boring and you still have to do it', built:true, status:'Not started',\n    hook:'Most jobs are the same task, done right, when you’re tired. This one is about that.' },\n  { cat:'pressure', title:'When you fail at something publicly',\n    hook:'The four days after, and what people actually remember.' },\n  { cat:'pressure', title:'Being wrong out loud',\n    hook:'How to say you got it wrong in a way that costs you nothing.' },\n\n  { id:'ll-interview', cat:'hired', title:'Answering the question they actually asked', built:true, status:'In progress',\n    hook:'The first question in every interview, and how to answer it with something out of your Passport instead of an adjective.' },\n  { cat:'hired', title:'One page about you',\n    hook:'What goes on a resume when you have never had a job, and what to leave off.' },\n  { cat:'hired', title:'Talking about money',\n    hook:'What to say when they ask your number, and what to say when the number is low.' },\n  { cat:'hired', title:'Asking a stranger for twenty minutes',\n    hook:'Nobody teaches this and it opens more doors than a resume does.' },\n\n  { cat:'money', title:'Reading your first paycheck',\n    hook:'Your gross pay isn’t your pay. Where the rest went, line by line, on a real stub.' },\n  { cat:'money', title:'How credit actually works',\n    hook:'Why the same car costs two people $18,000 and $24,000. Nothing about the car changed.' },\n  { cat:'money', title:'Rent, deposits, and roommates',\n    hook:'What you need saved before you can sign a lease here, and what a deposit’s really for.' },\n  { cat:'money', title:'Taxes without the panic',\n    hook:'What a W-2 is, why you might get money back, and what happens if you skip it.' },\n];\n\nconst LESSONS = {\n  'll-interview': { owner:'Interview prep', isLesson:true, mins:10, points:1,\n    title:'Answering the question they actually asked',\n    carry:'You’ve four introships and twenty-one internship days in your Passport. That’s the raw material for every answer in here.',\n    units:[\n      { n:1, label:'THE SITUATION', kind:'choice',\n        q:'\"So, tell me about yourself.\" First question, every interview. What do you do?',\n        sub:'There’s no trick answer here. There’s a version that works and a version that wastes your best thirty seconds.',\n        choices:[\n          { t:'Say where you go to school and that you’re a hard worker', cost:'True, and it tells them nothing.',\n            says:'This is what almost everybody says, which is the problem. Every candidate is a hard worker. Nothing in that sentence is checkable, so the interviewer learns nothing and remembers nothing.' },\n          { t:'Name one thing you did and what happened', cost:'Specific. They can ask a follow-up.',\n            says:'This is the one. \"I did a thirty-day internship in sonography and found out I liked the measurement part more than the patient part.\" That’s a real sentence about a real thing, and it hands them their next question.' },\n          { t:'Ask what they’re looking for first', cost:'Confident, and it can read as dodging.',\n            says:'Sometimes smart, and risky as an opener. Interviewers asked you a question, and answering it first is usually the stronger move.' },\n          { t:'Talk about what you want to be one day', cost:'Ambition, no evidence.',\n            says:'Plans are cheap and everybody has them. The interview is about what you’ve already done, even when what you have done is small.' },\n        ] },\n      { n:2, label:'REAL OR NOT', kind:'sort',\n        q:'Six answers. Which ones give the interviewer something, and which ones just describe a personality?',\n        sub:'Tap an answer, then tap where it goes. The test is whether they could ask you a follow-up.',\n        buckets:[{ label:'Has evidence in it', hint:'They can ask a follow-up' },\n          { label:'Just a trait', hint:'Nothing to check' }],\n        items:[\n          { t:'I am a fast learner', bucket:1 },\n          { t:'I stopped an internship on day nine and wrote down why', bucket:0 },\n          { t:'I work well with others', bucket:1 },\n          { t:'I ran a station for thirty minutes and got four of eight prep calls right', bucket:0 },\n          { t:'I am really passionate about health care', bucket:1 },\n          { t:'I recorded eighteen stand-ups about what surprised me', bucket:0 },\n        ],\n        real:'The rule is whether they can ask you a second question about it. A trait ends the conversation. A thing you did opens it. This is also why ruling a career out is an interview answer, because it’s evidence that you tested something instead of guessing.' },\n      { n:3, label:'SAY IT', kind:'talk',\n        q:'You gave a real answer. Now they push on it.',\n        sub:'Two follow-ups. Pick what you would actually say.',\n        rounds:[\n          { them:'You said you stopped that internship on day nine. Why should I not read that as quitting?',\n            replies:[\n              { t:'I finished nine days, wrote down what wasn’t working, and used it to pick better.', says:'This is the answer. You’re not defending the stop, you’re describing what it produced. Interviewers hire people who can tell the difference.' },\n              { t:'It wasn’t the right fit for me.', says:'True and thin. It’s the sentence everybody uses, and it invites them to keep pushing.' },\n              { t:'You’re right, I should have finished it.', says:'Agreeing to make the moment end. You just told them your own evidence was a mistake, and now neither of you can use it.' },\n            ] },\n          { them:'What did you learn that you would bring here?',\n            replies:[\n              { t:'That I would rather find out early than be polite about it for three more weeks.', says:'Direct and it answers the actual question. It also makes the stop into a strength without overselling it.' },\n              { t:'I learned a lot about myself.', says:'The most common answer in every interview, and it has no information in it. They can’t follow up, so the conversation stalls.' },\n              { t:'I learned that health care isn’t for me.', says:'Honest, and it answers a question they didn’t ask. They asked what you would bring here.' },\n            ] },\n        ],\n        real:'Interviewers aren’t testing whether your history is clean. They’re testing whether you can look at what you did and say something true about it. That’s a skill, and it’s the same skill in a performance review ten years from now.' },\n      { n:4, label:'MAKE YOUR OWN', kind:'write',\n        q:'Write your thirty-second answer to \"tell me about yourself\", using something real from your Passport.',\n        sub:'One thing you did, what happened, and what it told you. Three sentences is enough.',\n        wlabel:'Your answer',\n        placeholder:'I did a thirty-day internship in sonography. On day twelve I found out I liked the measurement part more than the patient part, which isn’t what I expected.',\n        real:'That’s now something you own. Read it once before an interview and don’t memorise it, because memorised answers sound memorised. The point was never the script. It was noticing that you have evidence.' },\n      { n:5, label:'WHAT YOU TOOK', kind:'verdict',\n        q:'10 minutes. What’s different now?',\n        labels:['Nothing new','A little','I get the idea','I would use this','I am using this tomorrow'],\n        notes:['Fair. It goes in your Passport either way.',\n          'Something is better than nothing.',\n          'The idea is the whole lesson: evidence beats adjectives.',\n          'Your answer is saved. It’s there when you need it.',\n          'Then go read it out loud once. It sounds different out loud.'] },\n    ] },\n\n  'll-thinking': { owner:'Critical thinking', isLesson:true, mins:10, points:1,\n    title:'Telling a claim from a fact',\n    carry:'Every number in this app has a source under it, and that’s on purpose. This lesson is about what to do when something does not.',\n    units:[\n      { n:1, label:'THE SITUATION', kind:'choice',\n        q:'A post with 40,000 likes says the trades are dying because of AI. What do you do?',\n        sub:'You’re going to make this call about fifty times today. Pick what you would really do.',\n        choices:[\n          { t:'Check who said it and whether there’s a number behind it', cost:'Takes two minutes.',\n            says:'This is the move, and it’s two questions, not a research project. Who is saying it, and what would have to be true. Most claims fall apart at the second one.' },\n          { t:'Look for the same claim somewhere else', cost:'Better than nothing, and it can backfire.',\n            says:'Useful, with a catch. Finding it repeated isn’t the same as finding it supported. The same wrong claim gets copied a thousand times.' },\n          { t:'Believe it, it has 40,000 likes', cost:'Popularity isn’t evidence.',\n            says:'Engagement measures how much a thing gets shared, and the things that get shared most are the ones that make people feel something. That’s close to the opposite of accuracy.' },\n          { t:'Dismiss it, everything online is fake', cost:'Also not thinking.',\n            says:'Refusing to believe anything takes the same amount of effort as believing everything, and it leaves you just as stuck. The work is in the middle.' },\n        ] },\n      { n:2, label:'REAL OR NOT', kind:'error',\n        q:'One paragraph about the trades. Tap the line that’s a claim wearing a fact\\u2019s clothes.',\n        sub:'Four of these could be checked. One cannot.',\n        docLabel:'FROM A CAREER ADVICE POST',\n        lines:[\n          { t:'Electricians in California earned a typical of about $88,000 in 2024.' },\n          { t:'The Bureau of Labor Statistics projects electrician jobs will grow about 11% by 2033.' },\n          { t:'AI is going to make skilled trades obsolete within a decade.' },\n          { t:'IBEW apprenticeships in the Bay Area take about four to five years.' },\n          { t:'Apprentices are paid a percentage of journeyman wage while they train.' },\n        ],\n        answer:2,\n        real:'The other four name a number, a year and a source, so you could go and check them. The third one predicts the future in a sentence with no mechanism and no number. It’s not a lie, it’s impossible to check, and that’s the thing to notice. You can’t check it, so it can’t be evidence for a decision about your life.' },\n      { n:3, label:'SAY IT', kind:'sort',\n        q:'Six statements. Which ones could you actually check?',\n        sub:'Tap a statement, then tap where it goes.',\n        buckets:[{ label:'Could be checked', hint:'A number, a date, a source' },\n          { label:'Can’t be checked', hint:'A feeling or a prediction' }],\n        items:[\n          { t:'Sonographers here start around $96,000', bucket:0 },\n          { t:'Nursing is the most rewarding career', bucket:1 },\n          { t:'75% of teens finish the full thirty-day internship', bucket:0 },\n          { t:'Nobody wants to work in the trades anymore', bucket:1 },\n          { t:'Cañada College\\u2019s program costs about $3,100 after aid', bucket:0 },\n          { t:'Everything will be automated soon', bucket:1 },\n        ],\n        real:'Uncheckable isn’t the same as untrue. \"Nursing is rewarding\" might be true for you. It just can’t carry a decision on its own, and the trouble starts when somebody uses one to argue for the other.' },\n      { n:4, label:'MAKE YOUR OWN', kind:'write',\n        q:'Take the AI claim and rewrite it so it could be checked.',\n        sub:'Add whatever it’s missing. A number, a timeframe, something that would prove it wrong.',\n        wlabel:'Your version',\n        placeholder:'Electrician employment in California will fall by more than 10% between 2026 and 2036, according to state projections.',\n        real:'You just did the thing that separates having an opinion from having a position. A claim you can be wrong about is worth arguing with. Notice that your version is now boring, and that boring is what checkable sounds like.' },\n      { n:5, label:'WHAT YOU TOOK', kind:'verdict',\n        q:'10 minutes. What’s different now?',\n        labels:['Nothing new','A little','I get the idea','I would use this','I am using this tomorrow'],\n        notes:['Fair. It goes in your Passport either way.','Something is better than nothing.',\n          'Two questions: who says so, and what would have to be true.',\n          'It’s a habit more than a skill, and it gets faster.',\n          'Try it on the next thing that makes you angry online.'] },\n    ] },\n\n  'll-comms': { owner:'Communication', isLesson:true, mins:10, points:1,\n    title:'Saying the hard thing without making it worse',\n    carry:'You said in your chef introship that being corrected mid-service would be fine. This is the other side of that, when you’re the one who has to say it.',\n    units:[\n      { n:1, label:'THE SITUATION', kind:'choice',\n        q:'Group project, due Friday. One person hasn’t done their part and has stopped replying.',\n        sub:'Four real options. Pick what you would actually do.',\n        choices:[\n          { t:'Message them directly and ask for one specific thing by one specific time', cost:'Awkward for about a minute.',\n            says:'This is what works, and it works because it’s specific. \"Can you send the slides by Thursday at six\" is answerable. \"Are you doing your part\" is an argument.' },\n          { t:'Do their part yourself and say nothing', cost:'Project is safe. Nothing else is.',\n            says:'The most common choice and the one people regret. You’ve taught them it works, you’re angry, and nobody has learned anything. Managers watch for this exact pattern.' },\n          { t:'Tell the teacher now', cost:'Solves it, and skips a step.',\n            says:'Sometimes right, especially if you’ve already asked. Going there first is what makes people say you didn’t talk to them, and they’re usually correct.' },\n          { t:'Bring it up in the group chat so everyone sees', cost:'Public. It won’t go the way you want.',\n            says:'This turns a work problem into a status problem. Now they have to defend themselves in front of an audience, which is the one thing guaranteed to stop them cooperating.' },\n        ] },\n      { n:2, label:'REAL OR NOT', kind:'talk',\n        q:'You messaged them. They replied.',\n        sub:'Two turns. Pick what you would say.',\n        rounds:[\n          { them:'sorry, been dealing with a lot. i\\u2019ll get to it',\n            replies:[\n              { t:'No problem. Can you send me the three slides by Thursday six, or tell me now if you cannot?', says:'You accepted the apology and kept the ask. Warm and specific at the same time, which is the whole skill.' },\n              { t:'Ok, thanks.', says:'Kind, and nothing was agreed. Thursday arrives and you’re exactly where you started, except now you have used up your one easy ask.' },\n              { t:'We are all dealing with a lot.', says:'True, and it makes the conversation about who has it worse. That conversation has never once produced slides.' },\n            ] },\n          { them:'thursday might be tight',\n            replies:[\n              { t:'Then send me what you have Thursday and I will finish it. Deal?', says:'You gave them a version they can actually do. Most people who go quiet are stuck, not lazy, and a smaller ask unsticks them.' },\n              { t:'It has to be Thursday.', says:'Sometimes it does, and saying only that gives them nowhere to go. If the deadline is real, offering a smaller version of the task is what keeps them in it.' },\n              { t:'Fine, whenever.', says:'You just moved the whole thing back onto yourself, quietly, while sounding agreeable. This is how people end up doing two people\\u2019s work and resenting it.' },\n            ] },\n        ],\n        real:'Every hard conversation is the same two moves: be warm about the person, be exact about the thing. People who only do the first get nothing done. People who only do the second get avoided. This doesn’t change when you’re thirty and it’s your job.' },\n      { n:3, label:'SAY IT', kind:'sort',\n        q:'Six asks. Which ones can somebody actually act on?',\n        sub:'Tap an ask, then tap where it goes.',\n        buckets:[{ label:'Clear', hint:'What, and by when' },\n          { label:'Vague', hint:'They have to guess' }],\n        items:[\n          { t:'Can you send the three slides by Thursday at six?', bucket:0 },\n          { t:'Can you be more involved?', bucket:1 },\n          { t:'Can you take the intro and I take the ending?', bucket:0 },\n          { t:'We need you to step up', bucket:1 },\n          { t:'Can you tell me today if you can’t do it?', bucket:0 },\n          { t:'Do your part please', bucket:1 },\n        ],\n        real:'The vague ones aren’t softer, they’re just harder to say no to and easier to ignore. Anything with a what and a when can be agreed to or declined, and either of those is better than silence.' },\n      { n:4, label:'MAKE YOUR OWN', kind:'write',\n        q:'Write the actual message you would send.',\n        sub:'Warm about the person, exact about the thing. Two or three lines.',\n        wlabel:'Your message',\n        placeholder:'Hey, no stress about this week. Can you send the three slides by Thursday at six? If that won’t work, tell me today and I will cover the intro.',\n        real:'Read it back and check one thing: could they answer it with a yes or a no? If not, it’s not an ask yet, it’s a hint. Hints are what we send when we want the outcome without the discomfort, and they almost never work.' },\n      { n:5, label:'WHAT YOU TOOK', kind:'verdict',\n        q:'10 minutes. What’s different now?',\n        labels:['Nothing new','A little','I get the idea','I would use this','I am using this tomorrow'],\n        notes:['Fair. It goes in your Passport either way.','Something is better than nothing.',\n          'Warm about the person, exact about the thing.',\n          'Your message is saved. Send it or do not.',\n          'Send it before you talk yourself out of it.'] },\n    ] },\n\n  'll-ideas': { owner:'Creativity', isLesson:true, mins:10, points:1,\n    title:'Having a second idea',\n    carry:'Creativity at work is almost never art. It’s having somewhere else to go when the obvious plan is blocked.',\n    units:[\n      { n:1, label:'THE SITUATION', kind:'choice',\n        q:'You need $3,100 for a two-year program. Financial aid covered $1,400. You’re $1,700 short.',\n        sub:'The obvious plan didn’t work. Pick your next move.',\n        choices:[\n          { t:'List every way people have covered a gap like this, then pick', cost:'Fifteen minutes and no pride.',\n            says:'This is the move. Not the best idea first, all the ideas first. Employer tuition help, a payment plan, a scholarship through the college, starting part-time, a different campus. The gap is $1,700, and there are at least six routes at it.' },\n          { t:'Give up on this program and pick a cheaper career', cost:'Solves it by shrinking the goal.',\n            says:'Sometimes the right answer, and almost never the right first answer. You haven’t tested the obstacle yet, you have just accepted it.' },\n          { t:'Work a year and save it', cost:'It works. It costs a year.',\n            says:'A real option, and worth comparing against the others rather than defaulting to it. A year of your life is a large price for $1,700 if a payment plan would have done it.' },\n          { t:'Ask the college what people usually do', cost:'Costs one email.',\n            says:'Strong and almost nobody does it. Somebody in that office answers this exact question weekly, and they know which four things actually work.' },\n        ] },\n      { n:2, label:'REAL OR NOT', kind:'sort',\n        q:'Six responses to \"the program costs more than I have\". Which are actually different ideas?',\n        sub:'Tap one, then tap where it goes. Some of these are the first idea in a new outfit.',\n        buckets:[{ label:'A different idea', hint:'Attacks the problem another way' },\n          { label:'The same idea again', hint:'Just reworded' }],\n        items:[\n          { t:'Ask the college about a payment plan', bucket:0 },\n          { t:'Find more financial aid', bucket:1 },\n          { t:'Get an employer to pay for it', bucket:0 },\n          { t:'Apply for another scholarship', bucket:1 },\n          { t:'Start part-time and work alongside it', bucket:0 },\n          { t:'Look for other grants', bucket:1 },\n        ],\n        real:'Three of those are all \"find someone to give me money\", which is one idea wearing three hats. The other three change the shape of the problem: pay later, have somebody else pay, or need less at once. When you’re stuck, the question isn’t \"what else could I try\", it’s \"what else could be true\".' },\n      { n:3, label:'SAY IT', kind:'error',\n        q:'Somebody brainstormed five ways to get more experience. Tap the one that’s not an idea.',\n        sub:'Four of these you could do on Monday.',\n        docLabel:'FIVE WAYS TO GET EXPERIENCE',\n        lines:[\n          { t:'Ask the imaging department if I can shadow for one day' },\n          { t:'Do the thirty-day internship in the app' },\n          { t:'Get more experience somehow' },\n          { t:'Ask my cousin who works at the hospital to introduce me' },\n          { t:'Volunteer at the clinic on Saturdays' },\n        ],\n        answer:2,\n        real:'The third one is the goal restated as a plan, and it’s the most common thing on everybody\\u2019s list. The test is whether you could start it on Monday morning. If you can’t picture the first five minutes, it’s a wish, not an idea.' },\n      { n:4, label:'MAKE YOUR OWN', kind:'write',\n        q:'Pick something you’re stuck on and write three really different ways at it.',\n        sub:'Different means it attacks the problem from another side, not the same idea reworded. Anything counts.',\n        wlabel:'Three ways',\n        placeholder:'1. Ask the program about a payment plan. 2. Find an employer that pays tuition. 3. Start part-time so it costs less at once.',\n        real:'Look at your three. If two of them would fail for the same reason, you have two ideas, not three. That’s the check, and it’s the only trick in this lesson.' },\n      { n:5, label:'WHAT YOU TOOK', kind:'verdict',\n        q:'10 minutes. What’s different now?',\n        labels:['Nothing new','A little','I get the idea','I would use this','I am using this tomorrow'],\n        notes:['Fair. It goes in your Passport either way.','Something is better than nothing.',\n          'Second ideas are a habit, not a talent.',\n          'Your three are saved.',\n          'Then go send the email you listed.'] },\n    ] },\n\n  'll-help': { owner:'Working with people', isLesson:true, mins:10, points:1,\n    title:'Asking for help without looking like you can’t do it',\n    carry:'Every job on this app puts you somewhere you don’t know what you’re doing yet. That’s not the problem. Staying stuck quietly is.',\n    units:[\n      { n:1, label:'THE SITUATION', kind:'choice',\n        q:'Second week on the job. You’ve been stuck on the same thing for forty minutes. What do you do?',\n        sub:'Four real options. Pick what you would actually do.',\n        choices:[\n          { t:'Say what you tried, then ask the specific question', cost:'Thirty seconds of feeling dumb.',\n            says:'This is the version that makes you look good. \"I tried X and Y, it still does Z, what am I missing\" tells them you worked before you asked, and it takes them ten seconds to answer.' },\n          { t:'Keep trying so nobody knows you’re stuck', cost:'Nobody knows. The work doesn’t move.',\n            says:'The most common choice and the one every supervisor complains about. Forty minutes becomes a day, and the person who could have unblocked you in ten seconds finds out on Friday.' },\n          { t:'Ask somebody to just show you', cost:'Fast. You may not retain it.',\n            says:'Fine occasionally, and it wears out. People notice the difference between being asked to explain and being asked to do it for you.' },\n          { t:'Look it up first, then ask if that fails', cost:'Costs a few minutes, saves the ask.',\n            says:'Almost always right, with a time limit on it. The failure mode is looking it up for two hours because asking felt worse.' },\n        ] },\n      { n:2, label:'REAL OR NOT', kind:'sort',\n        q:'Six ways of asking. Which ones make you look like somebody worth helping?',\n        sub:'Tap an ask, then tap where it goes. Tap it again to take it back.',\n        buckets:[{ label:'Worth helping', hint:'Shows you worked first' },\n          { label:'Reads as helpless', hint:'Hands it back to them' }],\n        items:[\n          { t:'I tried the checklist and step four still fails. What am I missing?', bucket:0 },\n          { t:'This isn’t working', bucket:1 },\n          { t:'Is it meant to look like this, or have I done something wrong?', bucket:0 },\n          { t:'Can you do this one for me?', bucket:1 },\n          { t:'I think it’s the wiring, but I don’t want to guess. Can you look?', bucket:0 },\n          { t:'I don’t get any of this', bucket:1 },\n        ],\n        real:'The good ones all do the same thing: they show what you already tried and they make the question small enough to answer fast. That’s the whole difference, and it’s not about confidence. It’s about doing five minutes of work before you spend somebody else\\u2019s.' },\n      { n:3, label:'SAY IT', kind:'talk',\n        q:'You asked. Here is what comes back.',\n        sub:'Two turns. Pick what you would say.',\n        rounds:[\n          { them:'You should already know this from training.',\n            replies:[\n              { t:'Probably. I would rather ask than guess and redo it.', says:'Steady, and it ends the conversation in your favour. You haven’t argued and you haven’t apologised your way into looking worse.' },\n              { t:'Sorry, I know, I am so bad at this.', says:'Now they have to reassure you, which is work you handed them. Over-apologising is the fastest way to make one question into a problem.' },\n              { t:'Training never covered it.', says:'Sometimes true, and it turns a ten-second answer into an argument about training. Save it for the debrief.' },\n            ] },\n          { them:'Fine. It’s the second valve, not the first. Anything else?',\n            replies:[\n              { t:'That’s it. I will write it down so I don’t ask twice.', says:'The best possible close. People don’t mind answering once. What they mind is answering the same thing in a fortnight.' },\n              { t:'No, thanks.', says:'Perfectly fine, and you left something on the table. The offer of anything else is rarely repeated.' },\n              { t:'Actually, four more things.', says:'Honest, and read the room. Batching your questions is right. Four at once, right after being told you should already know, is a lot.' },\n            ] },\n        ],\n        real:'Notice that the awkward part lasted about four seconds and the work moved. New people who ask well get taught things nobody teaches the ones who stay quiet, and by month three the gap between those two people is large.' },\n      { n:4, label:'MAKE YOUR OWN', kind:'write',\n        q:'Think of something you’re stuck on right now. Write the ask.',\n        sub:'What you tried, what happened, and the one question. Anything counts, school or work or otherwise.',\n        wlabel:'Your ask',\n        placeholder:'I tried the practice problems and I get the first step but not the second. Can you look at where I lose it?',\n        real:'Read it back and check one thing: could somebody answer it in under a minute? If not, it’s not an ask yet, it’s a description of being stuck. Making it answerable is the favour you do the person helping you.' },\n      { n:5, label:'WHAT YOU TOOK', kind:'verdict',\n        q:'10 minutes. What’s different now?',\n        labels:['Nothing new','A little','I get the idea','I would use this','I am using this tomorrow'],\n        notes:['Fair. It goes in your Passport either way.','Something is better than nothing.',\n          'Show what you tried, make the question small.',\n          'Your ask is saved.','Then send it before you talk yourself out of it.'] },\n    ] },\n\n  'll-follow': { owner:'Managing yourself', isLesson:true, mins:10, points:1,\n    title:'Doing the thing you said you would do',\n    carry:'Nobody is going to stand over you on an internship day, in a kitchen at 3pm, or on a night shift in a data centre. That’s the whole point of this one.',\n    units:[\n      { n:1, label:'THE SITUATION', kind:'choice',\n        q:'You told somebody you would have it done by Thursday. It’s Wednesday night and it’s not close.',\n        sub:'Pick what you would actually do.',\n        choices:[\n          { t:'Tell them tonight, with what you can have by Thursday', cost:'An uncomfortable message. Nothing else.',\n            says:'This is the one, and it’s the entire lesson. A warning on Wednesday is a scheduling problem. Silence until Thursday is a trust problem, and trust is the expensive one to fix.' },\n          { t:'Work all night and try to make it', cost:'Might work. Costs you the night.',\n            says:'Sometimes the right call, and it’s not a plan. People who rely on this quietly miss things a few times a year and never understand why they stopped being given the good work.' },\n          { t:'Say nothing and hand in what you have Thursday', cost:'Nobody is warned.',\n            says:'The most common one, and the one that does the real damage. What they remember isn’t the quality. It’s that they found out at the deadline.' },\n          { t:'Ask for more time now', cost:'Simple, and often granted.',\n            says:'Usually fine, and stronger with a version attached. \"Friday for all of it, or half of it Thursday\" gives them a choice instead of a problem.' },\n        ] },\n      { n:2, label:'REAL OR NOT', kind:'sort',\n        q:'Six things people say. Which ones are actually a promise?',\n        sub:'Tap one, then tap where it goes.',\n        buckets:[{ label:'A promise', hint:'Somebody can rely on it' },\n          { label:'Sounds like one', hint:'No time, no thing' }],\n        items:[\n          { t:'I will send it Thursday by six', bucket:0 },\n          { t:'I will get to it', bucket:1 },\n          { t:'I will have the first two sections Thursday, the rest Monday', bucket:0 },\n          { t:'Yeah, for sure', bucket:1 },\n          { t:'I can’t do Thursday. Friday morning I can', bucket:0 },\n          { t:'I am on it', bucket:1 },\n        ],\n        real:'Three of those have a thing and a time. The other three are warmth without content, and people say them because they end the conversation. The trouble is that the other person heard a promise, so you have made one without noticing.' },\n      { n:3, label:'SAY IT', kind:'error',\n        q:'Somebody\\u2019s week. Tap the line that’s going to fail.',\n        sub:'Four of these could happen. One is a wish.',\n        docLabel:'WHAT I AM DOING THIS WEEK',\n        lines:[\n          { t:'Mon: finish the two activity answers for internship day 19' },\n          { t:'Tue: email the imaging department about a shadow day' },\n          { t:'Wed: get better at math' },\n          { t:'Thu: send Mr. Ruiz the introship verdict I owe him' },\n          { t:'Fri: fifteen minutes on the internship, same as every day' },\n        ],\n        answer:2,\n        real:'Get better at math is a direction, not a task, so Wednesday will pass and nothing will have happened. The test is whether you could start it in the next five minutes. Everything else on that list you could start now.' },\n      { n:4, label:'MAKE YOUR OWN', kind:'write',\n        q:'Write down one thing you have been meaning to do, as something you could start in five minutes.',\n        sub:'A thing, and a when. Small enough that you won’t need to psych yourself up.',\n        wlabel:'One thing',\n        placeholder:'Thursday after school: email Ca\\u00f1ada College and ask when the sonography program takes applications.',\n        real:'That’s the whole method and it’s unglamorous. People with a reputation for following through aren’t more disciplined than you. They make the thing smaller and they say a time out loud.' },\n      { n:5, label:'WHAT YOU TOOK', kind:'verdict',\n        q:'10 minutes. What’s different now?',\n        labels:['Nothing new','A little','I get the idea','I would use this','I am using this tomorrow'],\n        notes:['Fair. It goes in your Passport either way.','Something is better than nothing.',\n          'A thing and a time, or it’s not a promise.',\n          'Your one thing is saved.','Then do it Thursday and tell somebody you did.'] },\n    ] },\n\n  'll-boring': { owner:'Handling pressure', isLesson:true, mins:10, points:1,\n    title:'When it’s boring and you still have to do it',\n    carry:'You said in your chef introship that the repetition was something you could handle. Most of the jobs in this app are that. This one is about the part after the novelty.',\n    units:[\n      { n:1, label:'THE SITUATION', kind:'choice',\n        q:'Day nineteen of thirty. The internship isn’t bad, it’s just the same thing again. What do you do?',\n        sub:'This is the most honest question in the app. Pick what you would really do.',\n        choices:[\n          { t:'Do the fifteen minutes anyway and see if it changes by day 25', cost:'Six more days of not much.',\n            says:'Often the right call, because boredom in week three tells you less than you think. Plenty of people who love their work found weeks three and four dull.' },\n          { t:'Work out whether it’s the work or the format', cost:'Ten minutes of thinking.',\n            says:'The sharpest move here. Bored by a simulation and bored by the actual job are different findings, and only one of them should rule a career out.' },\n          { t:'Stop, and write down exactly why', cost:'You lose the days. You keep the finding.',\n            says:'A real result and this app treats it as one. The condition is the writing. Stopping with a reason is evidence. Stopping without one is just Tuesday.' },\n          { t:'Push through and say nothing about it', cost:'You finish. You learn less.',\n            says:'You will get the points, and you won’t know whether you liked it. Finishing quietly is how people end up two years into a course they never actually chose.' },\n        ] },\n      { n:2, label:'REAL OR NOT', kind:'sort',\n        q:'Six reasons for being bored. Which ones are about the career, and which are about right now?',\n        sub:'Tap one, then tap where it goes.',\n        buckets:[{ label:'About the career', hint:'Would follow you into the job' },\n          { label:'About right now', hint:'Would not' }],\n        items:[\n          { t:'The actual task is repetitive by nature', bucket:0 },\n          { t:'I am doing it at 11pm when I am tired', bucket:1 },\n          { t:'I don’t care about the outcome the work produces', bucket:0 },\n          { t:'It’s week three of a simulation and nothing is at stake', bucket:1 },\n          { t:'I never get to decide anything', bucket:0 },\n          { t:'I have four other things due this week', bucket:1 },\n        ],\n        real:'The left column would follow you into the real job. The right column is your week. Machinists, dispatchers and line cooks all describe repetitive work they love, because the repetition sits inside something they care about. Sorting those two things is what makes boredom useful information instead of just a bad mood.' },\n      { n:3, label:'SAY IT', kind:'talk',\n        q:'Your teacher notices you have stalled.',\n        sub:'Two turns. Pick what you would say.',\n        rounds:[\n          { them:'You haven’t opened it in four days. What’s going on?',\n            replies:[\n              { t:'It got repetitive around day 15 and I am not sure if that’s the job or the format.', says:'The answer that gets you something useful. You’ve named the thing precisely, and now they can actually help.' },\n              { t:'I have just been busy.', says:'Sometimes true, and it ends the conversation with nothing learned. They will accept it and you will still be stuck on day 19.' },\n              { t:'I don’t think I want to do this career.', says:'Might be right, and it’s a big conclusion from four quiet days. Worth saying, worth testing before you act on it.' },\n            ] },\n          { them:'Fair. What would tell you which one it is?',\n            replies:[\n              { t:'Talking to somebody who does the job for real.', says:'Exactly the right answer and the reason job shadows exist. A simulation can’t tell you whether the real thing is boring.' },\n              { t:'Finishing it and seeing how I feel at the end.', says:'Reasonable. It costs eleven more days and it’s a fair way to find out.' },\n              { t:'I don’t know.', says:'An honest answer, and it’s what teachers are for. Not knowing is where the conversation starts, not where it fails.' },\n            ] },\n        ],\n        real:'Nobody in this app is going to tell you to push through because pushing through is good for you. The question is always the same: is what you’re feeling information about the career, or information about your week?' },\n      { n:4, label:'MAKE YOUR OWN', kind:'write',\n        q:'Write down the most boring thing you have ever had to keep doing, and whether you would do it again.',\n        sub:'A chore, a job, a practice, a shift. Be honest about the second part.',\n        wlabel:'Your note',\n        placeholder:'Folding shirts at my aunt\\u2019s shop every Saturday. I would do it again, because I liked the shop being ready when it opened.',\n        real:'People who say they would do it again almost always name something outside the task itself. The shop being ready, the team, the money, somebody noticing. That’s worth knowing about yourself, because most good jobs contain a lot of the task.' },\n      { n:5, label:'WHAT YOU TOOK', kind:'verdict',\n        q:'10 minutes. What’s different now?',\n        labels:['Nothing new','A little','I get the idea','I would use this','I am using this tomorrow'],\n        notes:['Fair. It goes in your Passport either way.','Something is better than nothing.',\n          'Is it the career, or is it your week?',\n          'Your note is saved.','Then go open day 19.'] },\n    ] },\n\n  'll-feedback': { owner:'Feedback', isLesson:true, mins:10, points:1,\n    title:'Taking a correction without defending yourself',\n    carry:'Every job on this app has a version of this moment. In a kitchen it’s 7:52 with a plate in your hand. In an office it’s a code review.',\n    units:[\n      { n:1, label:'THE SITUATION', kind:'choice',\n        q:'Somebody senior corrects your work, in front of other people, and they’re right.',\n        sub:'You’ve about two seconds. Pick what you would actually do.',\n        choices:[\n          { t:'Say what you’re going to do about it, out loud', cost:'Uncomfortable. Over in four seconds.',\n            says:'This is the one, and it works in every workplace on this app. \"Got it, refiring the steak.\" You haven’t argued, you haven’t grovelled, and everyone watching now knows the problem is handled.' },\n          { t:'Explain why it happened', cost:'Feels necessary. Reads as arguing.',\n            says:'The explanation is usually true, and this is the wrong two seconds for it. Bring it later if it matters. In the moment it sounds like the correction is being negotiated.' },\n          { t:'Apologise a lot', cost:'Makes it about your feelings.',\n            says:'Over-apologising asks the other person to reassure you, which is work you have just handed them. One \"my mistake\" is plenty.' },\n          { t:'Say nothing and fix it', cost:'The work gets done. Nobody knows.',\n            says:'Better than arguing, and it leaves a gap. Teams run on people saying what they’re doing, and silence after a correction reads as sulking whether you meant it that way or not.' },\n        ] },\n      { n:2, label:'REAL OR NOT', kind:'talk',\n        q:'Later, they come find you.',\n        sub:'Two turns. Pick what you would say.',\n        rounds:[\n          { them:'I was short with you back there. It was busy.',\n            replies:[\n              { t:'It’s fine. You were right, and I would rather know in the moment.', says:'Clean. You accepted the apology without collecting on it, and you told them how you want to be corrected in future. That sentence buys you years of useful feedback.' },\n              { t:'Honestly it did embarrass me a bit.', says:'Honest, and sometimes the right thing to say. It also makes the next correction more expensive for them, which can mean fewer of them.' },\n              { t:'No worries, my fault entirely.', says:'You took the whole thing back onto yourself when they were trying to hand you something. The apology was theirs to give.' },\n            ] },\n          { them:'For what it’s worth, most people argue with me the first time.',\n            replies:[\n              { t:'What else should I be doing differently?', says:'The strongest move in the lesson. You’ve just turned one correction into a source of them, and people who ask this get told things nobody else gets told.' },\n              { t:'Thanks, I appreciate that.', says:'Perfectly fine, and it closes the conversation. Nothing wrong with it, and you left something on the table.' },\n              { t:'I have had a lot of practice being wrong.', says:'Funny, and it deflects. Humour is how most people get out of these moments without hearing the next sentence.' },\n            ] },\n        ],\n        real:'The people who get good fastest aren’t the ones who make fewer mistakes. They’re the ones other people are willing to correct. That’s a reputation you build in four-second increments, and it decides how much you learn in your first year anywhere.' },\n      { n:3, label:'SAY IT', kind:'sort',\n        q:'When somebody corrects your work, which of these is it actually about?',\n        sub:'Tap one, then tap where it goes.',\n        buckets:[{ label:'What it’s about', hint:'The work' },\n          { label:'What your head makes it about', hint:'You' }],\n        items:[\n          { t:'The plate needs to go out right', bucket:0 },\n          { t:'They think I am bad at this', bucket:1 },\n          { t:'There are forty covers waiting', bucket:0 },\n          { t:'Everyone just watched that', bucket:1 },\n          { t:'They want me to know for next time', bucket:0 },\n          { t:'I am going to get fired', bucket:1 },\n        ],\n        real:'Both columns feel equally true in the moment, and only one of them is in the room. The skill isn’t becoming someone who doesn’t feel the right column. It’s answering the left one first, and letting the right one be loud for a while afterwards.' },\n      { n:4, label:'MAKE YOUR OWN', kind:'write',\n        q:'Think of the last time somebody corrected you. Write what they were actually right about.',\n        sub:'Not what they should have said differently. What they were right about.',\n        wlabel:'Your note',\n        placeholder:'She was right that I had not read the ticket properly. I was annoyed about how she said it, and that part was separate.',\n        real:'Separating those two things is most of the work, and almost nobody does it on purpose. Notice that you can hold both: they were right, and you didn’t like how it landed. People who can say both sentences at once are the ones who get promoted.' },\n      { n:5, label:'WHAT YOU TOOK', kind:'verdict',\n        q:'10 minutes. What’s different now?',\n        labels:['Nothing new','A little','I get the idea','I would use this','I am using this tomorrow'],\n        notes:['Fair. It goes in your Passport either way.','Something is better than nothing.',\n          'Answer the work first. Feel the rest later.',\n          'Your note is saved.',\n          'Then ask somebody what you should be doing differently.'] },\n    ] },\n};\n\nconst LEVELS = {\n  chef: {\n    2: { title:'Prep and hold a station', mins:30, points:6,\n      carry:'You said the r
