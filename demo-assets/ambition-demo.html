epetition would be the part you could handle, and that being corrected mid-service would be fine. Both of those get tested here.',\n      units:[\n        { n:1, label:'MISE EN PLACE', kind:'sort',\n          q:'Eight things on tonight\\u2019s menu. Which get prepped before service, and which get cooked to order?',\n          sub:'Tap an item, then tap where it goes. Tap it again to take it back. Getting this wrong is how a station falls behind at 7pm.',\n          buckets:[{ label:'Prep before service', hint:'Holds for hours' },\n            { label:'Cook to order', hint:'Dies if it sits' }],\n          items:[\n            { t:'Diced onions', bucket:0 },\n            { t:'Steak, medium rare', bucket:1 },\n            { t:'Braised short rib', bucket:0 },\n            { t:'Fried egg', bucket:1 },\n            { t:'Vinaigrette', bucket:0 },\n            { t:'Seared scallops', bucket:1 },\n            { t:'Blanched green beans', bucket:0 },\n            { t:'Toasted bread', bucket:1 },\n          ],\n          real:'The rule is whether it dies while it waits. Anything with protein and a crust gets cooked to order, because a scallop that sat for six minutes is a different dish. Everything that holds gets done at 3pm, which is why prep is where the night is won.' },\n\n        { n:2, label:'THE PREP LIST', kind:'allocate',\n          q:'You’ve 180 minutes before service. These tasks add up to 260. What comes off?',\n          sub:'Tap to drop a task. You’ve to get under 180, and something is going to suffer.',\n          budget:180, unitLabel:'min',\n          tasks:[\n            { t:'Break down and portion 40 lb of short rib', cost:60, need:true },\n            { t:'Dice onions, carrots, celery for the week', cost:45, need:false },\n            { t:'Make the vinaigrette and the two sauces', cost:35, need:true },\n            { t:'Blanch green beans for service', cost:25, need:true },\n            { t:'Deep clean the walk-in', cost:50, need:false },\n            { t:'Label and date everything', cost:20, need:true },\n            { t:'Butcher tomorrow\\u2019s fish', cost:25, need:false },\n          ],\n          real:'The week\\u2019s dicing, the walk-in, and tomorrow\\u2019s fish all come off, because none of them affect tonight. Labelling never comes off, and cooks who cut it are the reason somebody serves the wrong sauce on a Saturday. This is the call every prep cook makes every day, and nobody makes it for you.' },\n\n        { n:3, label:'THE TICKET', kind:'error',\n          q:'One ticket, one problem. Tap the line that’s going to hurt somebody.',\n          sub:'Read it the way you would at 7:40 with four more on the rail.',\n          docLabel:'TABLE 14 · 4 COVERS · 7:41PM',\n          lines:[\n            { t:'1x short rib, no substitutions' },\n            { t:'1x scallops, allergy: shellfish' },\n            { t:'2x steak, one medium, one rare' },\n            { t:'Side of green beans, no butter' },\n            { t:'Fire together, table is on a timer' },\n          ],\n          answer:1,\n          real:'A shellfish allergy on a scallop order is either a server error or a very serious mistake, and you don’t cook it and hope. You stop, you send the server back to the table, and you get it confirmed. Every kitchen has a story about the night nobody stopped.' },\n\n        { n:4, label:'SEASON IT', kind:'tune',\n          q:'Same short rib, four hundred times a year. Get it right.',\n          sub:'Three dials. Land all three in range, then taste it.',\n          dials:[\n            { label:'Salt', min:0, max:10, step:1, start:0, lo:6, hi:8, low:'None', high:'Heavy',\n              ok:'Seasoned. You can taste the meat and the salt separately.',\n              under:'Flat. Under-seasoning is the most common note a young cook gets.',\n              over:'Too salty to send. There’s no fixing this plate now.' },\n            { label:'Acid', min:0, max:10, step:1, start:0, lo:4, hi:6, low:'None', high:'Sharp',\n              ok:'Balanced. The acid is doing its job without announcing itself.',\n              under:'Heavy and dull. Rich food needs acid or it sits on the palate.',\n              over:'Sour. It reads as a mistake rather than a choice.' },\n            { label:'Rest before slicing', min:0, max:20, step:1, start:0, lo:8, hi:14, low:'0 min', high:'20 min',\n              ok:'Rested. It holds together and it keeps its juice.',\n              under:'Sliced too early. The juice is on the board instead of in the meat.',\n              over:'Cold in the middle. Now it goes back on heat and dries out.' },\n          ],\n          real:'Nobody tastes the dial. They taste whether you were paying attention on the four hundredth one. Consistency is what gets you a station, and it’s the thing that sounds boring until you’re the one being counted on for it.' },\n\n        { n:5, label:'THE FIRE ORDER', kind:'sort',\n          q:'Four dishes, one table, everything hits the pass together. When does each one start?',\n          sub:'Tap a dish, then tap when it fires. The slowest thing starts first.',\n          buckets:[{ label:'Fire now', hint:'Longest cook' },\n            { label:'Fire in 4 minutes', hint:'Middle' },\n            { label:'Fire in 8 minutes', hint:'Fast, finishes last' }],\n          items:[\n            { t:'Short rib, 12 min to temp', bucket:0 },\n            { t:'Steak, 8 min plus rest', bucket:1 },\n            { t:'Scallops, 3 min', bucket:2 },\n            { t:'Green beans, 2 min', bucket:2 },\n          ],\n          real:'You work backwards from when the plate leaves. Timing four things to land in the same ninety seconds is the actual skill of a line cook, and it’s why the job isn’t about cooking so much as about timing.' },\n\n        { n:6, label:'IT CAME BACK', kind:'talk',\n          q:'A plate comes back at 7:52. The server is standing there waiting.',\n          sub:'Two things get said. Pick what you would actually say.',\n          rounds:[\n            { them:'Table 14 says the steak is overcooked. They asked for rare.',\n              replies:[\n                { t:'On it. Two minutes.', says:'The answer kitchens want. No discussion, no defence, the plate gets remade and service keeps moving.' },\n                { t:'That came out rare. Did they cut it before it rested?', says:'You might be right, and it’s the wrong moment. Forty covers are waiting on the answer and the guest isn’t going to be argued into liking it.' },\n                { t:'Did you ring it in as rare?', says:'A fair question that also lands as blame, in front of the pass, during service. Ask it at 11pm instead.' },\n              ] },\n            { them:'Chef heard that. He is looking at you.',\n              replies:[\n                { t:'Refiring the steak, chef. Rare.', says:'Clear, loud, no excuse attached. This is how you keep a station after a mistake.' },\n                { t:'It went out rare, chef.', says:'Even when true, it reads as arguing during service. The plate still has to be remade either way.' },\n                { t:'Nothing, and refire it.', says:'The plate gets fixed and nobody knows the pass is covered. Kitchens run on people calling out what they’re doing.' },\n              ] },\n          ],\n          real:'Service doesn’t stop for whose fault it was. How you handle being wrong at 7:52 decides what you get trusted with, and cooks say this is the part that took them longest to learn.' },\n\n        { n:7, label:'YOUR VERDICT', kind:'verdict',\n          q:'That was one station for half an hour. What do you think now?',\n          labels:['Not for me','Probably not','Curious','Interested','I want this'],\n          notes:['Goes in your Passport as ruled out, with what you did to find out. That’s a real result.',\n            'Ruled out for now. You did the work, so it counts.',\n            'Level 3 is a whole service. That’s where you find out.',\n            'Level 3 puts you on the line on a Friday.',\n            'Level 3 is a full service, and then the thirty days.'] },\n      ] },\n\n    3: { title:'Friday night, one service', mins:60, points:12,\n      carry:'You held a station for half an hour and didn’t argue when the plate came back. Tonight is four hours, you’re short a cook, and what you decide at 3pm decides what happens at 9.',\n      units:[\n        { n:1, label:'3:00PM · A COOK CALLED OUT', kind:'choice',\n          q:'Your grill cook isn’t coming in. Service is in four hours. What do you do?',\n          sub:'This one changes the rest of the night. There’s no option that costs nothing.',\n          choices:[\n            { t:'Call in the part-timer, even though he is slow', cost:'You get a body. You will be checking his plates all night.',\n              says:'The move most chefs make. A slow cook is worth more than an empty station, and you accept that you’re now working two jobs.',\n              consequence:'You’ve a grill cook, and you’re going to be covering his mistakes at 9pm.' },\n            { t:'Cover grill yourself and run the pass at the same time', cost:'You’re the best cook in the building. You’re also now in two places.',\n              says:'Tempting when you know you’re faster than the alternative. Chefs who do it lose the pass, which is the one job nobody else can do.',\n              consequence:'You’re on grill. The pass has nobody watching it, and tickets are going to slip.' },\n            { t:'Cut the two grill dishes off the menu for tonight', cost:'You lose your two best sellers on your biggest night.',\n              says:'A real option, and sometimes the right one. It costs the restaurant money and it protects the service, and owners hate it.',\n              consequence:'The menu is smaller and the kitchen is calm. The dining room is going to ask about the short rib all night.' },\n          ] },\n\n        { n:2, label:'3:15PM · PREP, SHORT-HANDED', kind:'allocate',\n          q:'Same 180 minutes, and now you’re prepping for a station you’re not sure is covered.',\n          sub:'Tap to drop what comes off. Whatever you cut is what bites you at eight.',\n          budget:180, unitLabel:'min',\n          tasks:[\n            { t:'Portion the short rib and the steaks', cost:65, need:true },\n            { t:'Par-cook the grill items so a slow cook can finish them', cost:40, need:true },\n            { t:'Make all three sauces', cost:35, need:true },\n            { t:'Set up and label the grill station for somebody else', cost:25, need:true },\n            { t:'Prep tomorrow\\u2019s braise', cost:45, need:false },\n            { t:'Family meal for the staff', cost:30, need:false },\n          ],\n          real:'Par-cooking and setting up somebody else\\u2019s station are the two that feel optional and are not. Cooks who prep only for themselves are the reason a short-handed Friday turns into a bad one. Tomorrow\\u2019s braise and family meal are what get sacrificed, and the staff eating late is a real cost you chose.' },\n\n        { n:3, label:'5:00PM · THE 86 BOARD', kind:'sort',\n          q:'You can’t make everything tonight. Which dishes stay on, and which come off before service?',\n          sub:'Tap a dish, then tap where it goes. Taking something off at 5 is a decision. Running out at 8 is an accident.',\n          buckets:[{ label:'Stays on', hint:'You can hold it all night' },\n            { label:'86 it now', hint:'Better than running out mid-service' }],\n          items:[\n            { t:'Short rib, 12 portions left', bucket:0 },\n            { t:'Whole fish, 3 portions left', bucket:1 },\n            { t:'Steak, plenty', bucket:0 },\n            { t:'Scallops, 4 portions left', bucket:1 },\n            { t:'Green bean side, plenty', bucket:0 },\n          ],\n          real:'Three or four portions of anything on a Friday isn’t a menu item, it’s a trap. You 86 it at five and the servers know all night. Running out at 8:30 means a table that already ordered gets told no, and that’s the version guests remember.' },\n\n        { n:4, label:'8:40PM · EIGHT PEOPLE WALK IN', kind:'talk',\n          q:'A table of eight, no reservation, and you have four tickets on the rail.',\n          sub:'The server is at the pass waiting for a number.',\n          rounds:[\n            { them:'Table of eight just sat. They want to order now. How long can I tell them?',\n              replies:[\n                { t:'Thirty-five minutes, and hold their order two minutes so I can clear the rail.',\n                  says:'A real number with a real reason. Servers can sell a wait they can explain, and the kitchen gets to finish what is already cooking.' },\n                { t:'Tell them twenty minutes.',\n                  says:'It won’t be twenty, and everybody at that table will know at minute twenty-five. The number you give is a promise the dining room has to keep.' },\n                { t:'I can’t take eight right now.',\n                  says:'Occasionally the honest call, and it costs the restaurant a full table on its best night. Owners will ask you about this one.' },\n              ] },\n            { them:'They ordered four short ribs. You’ve twelve portions and two other tables on it.',\n              replies:[\n                { t:'Fire all four, and 86 it after these go out.',\n                  says:'What most chefs do. You honour the order in front of you and you close the door behind it.' },\n                { t:'Fire four and tell the servers we are down to the last few.',\n                  says:'Better. Servers who know the count stop selling it, and nobody has to walk back to a table.' },\n                { t:'Give them two and offer the steak for the other two.',\n                  says:'Sometimes right when the count is really tight, and it means a server has a conversation you created.' },\n              ] },\n          ],\n          real:'Nothing about that exchange was cooking. Most of what a chef does on a Friday is give the dining room numbers it can rely on, and every number you invent comes back to the pass.' },\n\n        { n:5, label:'9:20PM · IT IS COMING APART', kind:'choice',\n          q:'The rail has nine tickets, the grill station is behind, and the pass is backing up.',\n          sub:'You can’t fix all three. Pick the one you fix.',\n          choices:[\n            { t:'Get on the grill and dig the station out', cost:'Grill catches up. The pass has nobody expediting.',\n              says:'The instinct of every cook who was good on the line. It solves the loudest problem and creates a quieter, worse one.',\n              consequence:'Grill caught up. Two tables got their plates in the wrong order because nobody was reading the rail.' },\n            { t:'Stay on the pass and re-sequence every ticket', cost:'Tickets go out in a smart order. Grill stays behind.',\n              says:'What experienced chefs do. The pass is the only job that sees the whole night, and timing buys more time than cooking does.',\n              consequence:'Every table got a coherent meal, ten minutes later than they wanted. Nobody in the dining room noticed the kitchen was short a cook.' },\n            { t:'Pull the dishwasher onto plating and simplify the plates', cost:'Plates get simpler and faster. They’re not what the menu promises.',\n              says:'A genuine call under pressure, and one that gets argued about. Guests notice a plate that looks rushed, but they notice a cold one more.',\n              consequence:'Food moved. Three plates went out without their garnish, and the chef is going to ask about that tomorrow.' },\n          ] },\n\n        { n:6, label:'11:15PM · THE NOTE', kind:'write',\n          q:'Kitchen is closed. Write the note you leave for tomorrow\\u2019s prep list.',\n          sub:'What ran out, what you would change, what the next person needs to know before 3pm.',\n          wlabel:'Tomorrow\\u2019s prep note',\n          placeholder:'86\\u2019d the fish and the scallops at five. Short rib went down to two portions by 9:40. Par-cook the grill items again, it saved us.',\n          real:'This is the artifact. Every kitchen runs on the note somebody left, and the cooks who write a useful one get promoted before the ones who cook slightly better. You just did the part of the job nobody films.' },\n\n        { n:7, label:'YOUR VERDICT', kind:'verdict',\n          q:'Four hours, one cook short. Now what do you think?',\n          labels:['Not for me','Probably not','Curious','Interested','I want this'],\n          notes:['Ruled out, after a full service. That’s the most useful thing in your Passport, and it cost you an hour instead of two years.',\n            'Ruled out for now, with real evidence behind it.',\n            'Still curious. The thirty-day internship is the next honest test.',\n            'Interested, and you have something to show for it.',\n            'Then the thirty days is the next thing, 15 minutes a day.'] },\n      ] },\n  },\n};\n\nBEATS_BY_CAREER.sono = BEATS;\nBEATS_BY_CAREER.lineworker = LINE_BEATS;\nBEATS_BY_CAREER.swe = SWE_BEATS;\n\nDONE_INTRO.chef = { when:'Feb 4', verdict:'You said you were interested, and then you went deeper',\n  said:'You got the pay guess almost right and you picked speed and consistency over creativity, which is the answer kitchens actually hire for.',\n  wrote:'I thought it was about making up dishes. It’s about doing the same thing right when you’re tired.',\n  moved:'Chef moved from worth a look to strong fit, and it opened level 2.' };\n\n// Six authored specifics per career. Everything else in the thirteen beats is\n// assembled from that career's own wage, education and outlook data.\nconst INTRO_LIB = {\n  teacherelem: { hook:'Thirty kids, one room, and you’re the adult. The pay here is the argument.',\n    reality:'You teach every subject to the same class all day, and you spend more time managing a room of thirty than delivering a lesson. Planning and grading happen after the kids leave.',\n    day:'7:30 in the room before anybody arrives. Reading, then math, then a lunch you eat in twenty minutes. Two behaviour situations you didn’t plan for. 3:00 the kids go, and then you plan and grade until five.',\n    hard:'You will be the most stable adult in some of these kids\\u2019 lives, and you can’t fix what happens at home. Teachers say the hardest part is caring about thirty kids and going home with all of it.',\n    thrives:'People who can hold a room without raising their voice, and who like the same thirty faces every day. Patience matters more than knowing the content.',\n    way:'A bachelor degree plus a California teaching qualification, which is usually a fifth year. San Jose State and Cal State East Bay both run programs, and districts here will help pay for the qualification if you commit to teaching in the district.',\n    catch:'The pay is the honest problem. Starting salary here doesn’t cover rent alone, and most new teachers have roommates or a long commute. That’s the trade this career asks you to make with your eyes open.' },\n\n  plumber: { hook:'Nobody calls a plumber when things are going well. Six figures, no degree, always work.',\n    reality:'You install and repair the pipes that carry water, gas and waste, in walls, under floors and underground. Half of it’s diagnosis, and a lot of it’s in places nobody wants to be.',\n    day:'Four to six calls, and none of them are the same. A leak behind a wall, a water heater, a drain that has been ignored for a year. You’re on your knees, in crawl spaces, and in other people\\u2019s bathrooms.',\n    hard:'It’s dirty in a way people don’t want to think about, and some of it’s really hazardous. Sewage work is real work, and every plumber has a story they won’t tell at dinner.',\n    thrives:'People who like solving a problem in somebody\\u2019s house and being thanked for it. You’re in a stranger\\u2019s home constantly, so being easy to have around is worth as much as the skill.',\n    way:'A four to five year paid apprenticeship, then the state licence exam. UA Local 467 runs the program on the Peninsula. You earn from the first week and you finish with no debt and a licence nobody can take.',\n    catch:'Knees, shoulders and back, and it starts earlier than you think. Most plumbers move into estimating, inspection, or running their own shop by their forties, which pays more and is the reason the trade has a path off the tools.' },\n\n  machinist: { hook:'You make the part that doesn’t exist yet. Tolerances tighter than a human hair.',\n    reality:'You program and run machines that cut metal to a drawing, usually within a couple of thousandths of an inch. Modern shops are CNC, so you’re writing the program, setting the tool, and checking the part.',\n    day:'A setup that takes ninety minutes for a run that takes four hours. You measure the first part, adjust, measure again, then watch and check while the machine works. You’re on your feet in a loud room with coolant everywhere.',\n    hard:'Scrapping an expensive part is your name on it, and it happens to everybody. Machinists describe the pressure of a $4,000 piece of titanium in the chuck as the thing that separates people who stay from people who leave.',\n    thrives:'People who like getting a number exactly right and don’t mind being alone with a machine. If you would rather be measured against a tolerance than against a person, this is that job.',\n    way:'A certificate or two-year program, and shops here hire out of both. Cañada and Mission College run machine tool programs, and aerospace shops on the Peninsula hire apprentices directly and train on their own machines.',\n    catch:'Automation cuts both ways. Simple manual work is disappearing, and the machinists who are secure are the ones who program and set up, not the ones who only load parts. That means you never stop learning software.' },\n\n  elevator: { hook:'One of the best-paid jobs in the country with no degree. Getting in is the hard part.',\n    reality:'You install, test and maintain elevators and escalators, which means mechanical, electrical and control systems in the same job. Most of the work is maintenance and modernisation, not new installs.',\n    day:'Two or three buildings, mostly service calls. A door sensor, a control fault, a scheduled inspection. You work in machine rooms, on top of cars, and in shafts, and you’re the only one there.',\n    hard:'You’re working in a shaft, sometimes alone, on equipment that will kill you if you skip a step. The safety rules are strict for that reason, and it’s not a job where being casual is tolerated.',\n    thrives:'People who like machines and electricity and being trusted alone. Troubleshooting is most of it, so patience with an intermittent fault matters more than strength.',\n    way:'A four-year paid apprenticeship through IUEC, and it’s one of the hardest to get into in the trades. You take an aptitude test, interview, and often apply more than once. Once you’re in, you’re paid the whole way.',\n    catch:'Getting in is really hard. Applications open in windows, hundreds apply for a handful of spots, and most people who make it applied twice. That waiting period is a real cost and nobody tells you about it upfront.' },\n\n  cyber: { hook:'Somebody is trying to get in right now. AI made both sides faster.',\n    reality:'You watch for attacks, investigate what looks wrong, and close the gaps before somebody uses them. Most of it’s monitoring, investigating alerts, and writing up what you found, not dramatic hacking.',\n    day:'A queue of alerts, most of them nothing. You investigate a login from a country nobody travels to, chase it for an hour, and find out it was a VPN. Then one turns out to be real and your afternoon disappears.',\n    hard:'You’re judged on what doesn’t happen, which means good work is invisible and one miss is very visible. Analysts describe alert fatigue as the real real risk of the job, and AI-generated attacks have made the volume worse.',\n    thrives:'People who are suspicious in a useful way and can write clearly. The investigation is half of it, and explaining what happened to somebody non-technical is the other half.',\n    way:'Security+ and a support or networking job first, which is the normal route and takes about two years. Most analysts didn’t study security in school. Employers here care whether you can investigate, not what your degree says.',\n    catch:'The on-call and the volume. Incidents don’t respect your evening, and the alert queue never empties. Burnout in this field gets talked about openly, which is unusual and worth paying attention to.' },\n\n  datacenter: { hook:'Every AI thing you have used runs in a building somebody keeps alive. That’s this job.',\n    reality:'You keep the servers, cooling and power running in the buildings that hold the internet. Replacing failed drives, racking new hardware, tracing a network fault, and responding when something in the room stops.',\n    day:'A hardware queue and a walk of the floor. Swap failed drives, rack and cable new servers, check cooling and power readings. It’s loud, cold in the aisles you work in, and you’re on your feet the whole shift.',\n    hard:'The rooms run around the clock, so somebody works nights and weekends, and for the first few years that’s you. Techs say the shift schedule is the thing that decides whether they stay.',\n    thrives:'People who like a checklist and a clear right answer, and who don’t need an audience. Most of the shift is you, a work order, and a rack.',\n    way:'A certificate and an entry technician job, which is one of the fastest routes into technology that exists right now. CompTIA A+ or Server+ plus a willingness to work nights gets interviews. The AI buildout means operators here are hiring faster than they can train.',\n    catch:'It’s physical and it’s nights, and the work itself is the same thing over and over, on purpose. The upside is that this is the way in: techs move into network, systems or facilities engineering within a few years, and that’s where the pay steps up.' },\n\n  radtech: { hook:'You’re the one who finds the break. Two years of school, six figures here.',\n    reality:'You position patients and run the x-ray, CT or MRI, then check your own images before a radiologist ever sees them. A bad angle means the patient comes back, so precision is the job.',\n    day:'Twelve to twenty patients a shift, most of them anxious. You lift and position people, some of whom can’t move themselves. Between scans you’re checking image quality on a screen.',\n    hard:'Radiation is managed, not absent. You wear a badge that gets read monthly, and you follow rules that exist because people were hurt before them.',\n    thrives:'People who are calm with strangers in pain, and careful about small things. If you liked being the one in the room during the health introship, this is that.',\n    way:'Two years at a community college with clinical rotations, then the ARDMS-equivalent state license. Foothill and Ca\\u00f1ada both run programs.',\n    catch:'Programs are hard to get into and waitlists are real. Night and weekend shifts are how most people start.' },\n  nurse: { hook:'The job everyone thinks they understand. Here is what a shift is actually like.',\n    reality:'You’re the person who notices. Doctors see a patient for minutes, you see them for twelve hours, and you’re the one who catches that something changed.',\n    day:'Three or four twelve-hour shifts a week. Four to six patients at a time on a med-surg floor. Charting eats more of it than anyone tells you.',\n    hard:'People die on your shift. Nurses talk about the first one for years. Hospitals are getting better at support, and it’s still the hardest part of the work.',\n    thrives:'People who stay steady when a room gets loud, and who don’t need to be thanked to keep going.',\n    way:'Two years for an associate and you can sit the licensing exam, or four for a bachelor. Many hospitals here will pay for the bachelor after you’re hired.',\n    catch:'Twelve-hour shifts wreck your sleep for the first year. Three days a week off is the trade.' },\n  electrician: { hook:'Paid to learn, no tuition, and every building needs you.',\n    reality:'You install and repair the wiring, panels and circuits inside buildings. Half the job is code: what is legal, what is safe, what an inspector will pass.',\n    day:'On a site by 7. Pulling wire, mounting boxes, terminating a panel. Some days are new construction, some are a house where nothing is where the plans say.',\n    hard:'Electricity doesn’t forgive shortcuts, and the trade has a real injury rate. Crews are strict about lockout rules for that reason.',\n    thrives:'People who like solving a physical puzzle and can follow a rulebook exactly. Reading is part of it, which surprises people.',\n    way:'Four to five years of paid apprenticeship. You earn from day one and finish licensed with no debt.',\n    catch:'Your knees and back do the work. Most electricians move toward estimating, inspection or running crews by their forties.' },\n  firefighter: { hook:'Most of the calls aren’t fires. Find out what the job actually is.',\n    reality:'Most of what you run is medical. Car crashes, heart attacks, overdoses. Fires are a small share of calls and the reason for all the training.',\n    day:'Twenty-four hours on, forty-eight off. You cook, clean the engine, drill, sleep when you can, and go when the tone drops.',\n    hard:'You will see things you can’t unsee, and you live with the crew that saw them too. Departments now treat that as a health issue rather than a weakness.',\n    thrives:'People who are calm in chaos and can live closely with other people for a day at a time.',\n    way:'A fire academy plus an EMT certificate, both of which you can do right after high school here. Testing is competitive and physical.',\n    catch:'The hiring process can take a year or more, and departments test in cycles. People apply several times.' },\n  hvac: { hook:'When the heat dies in January, you’re who they call.',\n    reality:'You install and fix heating, ventilation and air conditioning. Diagnosis is most of the skill: the system isn’t working and nobody knows why.',\n    day:'Four to six service calls a day, in attics, on roofs, in crawl spaces. Summer and winter are brutal and that’s when you make your money.',\n    hard:'The worst spaces in a building are where the equipment is. Heat in an attic in August is really dangerous.',\n    thrives:'People who like troubleshooting and can explain a repair to a homeowner who doesn’t want to pay for it.',\n    way:'A one-year certificate plus EPA refrigerant certification, then paid on-the-job time. You can start earning inside a year.',\n    catch:'Seasonal swings mean feast and famine hours, and the first two years pay much less than the typical.' },\n  dentalhyg: { hook:'Four-day weeks, six figures here, two years of school.',\n    reality:'You clean teeth, read x-rays, screen for gum disease and oral cancer, and you’re usually the person who explains what is happening to a nervous patient.',\n    day:'Eight to twelve patients, about an hour each, most of it with your hands in someone\\u2019s mouth and your head tilted.',\n    hard:'Repetitive strain is the career-limiter. Wrists, neck and shoulders. Hygienists plan around it from the start.',\n    thrives:'People who are precise, patient, and fine with the same procedure many times a day done exactly right.',\n    way:'Two years at a community college, then the national and state boards. Programs are small and admission is competitive.',\n    catch:'Many jobs are part-time by design, so building a full schedule can mean two offices.' },\n  paramedic: { hook:'Fifteen minutes to decide, with no doctor in the room.',\n    reality:'You’re the medical decision-maker at the scene. You assess, treat and transport, and you make calls with incomplete information under time pressure.',\n    day:'Twelve or twenty-four hour shifts. Long stretches of waiting broken by calls where everything matters at once.',\n    hard:'You lose patients, and the pay doesn’t match the responsibility. That gap is the real reason people leave for nursing or fire.',\n    thrives:'People who think clearly when adrenaline is up and who don’t need a supervisor to decide.',\n    way:'EMT certificate first, about six months, then paramedic school. You can be working as an EMT within a year of graduating.',\n    catch:'Pay here is well below the other health careers on this list, and burnout is common. Many use it as a route into fire or nursing.' },\n  welderfab: { hook:'The inspector says yes or no, and you’re the inspector.',\n    reality:'You examine welds to decide whether they will hold, using visual checks, ultrasound and x-ray. You sign off, and your signature carries weight.',\n    day:'On sites and in shops, examining work other people did. Documentation is a large part of it.',\n    hard:'You tell experienced welders their work failed. That takes a spine and it makes you unpopular some days.',\n    thrives:'People who are certain about details and comfortable being the one who says no.',\n    way:'Weld first, then certify as an inspector once you have written down hours. Most inspectors weld for several years first.',\n    catch:'You need the welding years before the inspection job, so this is a second step, not a starting point.' },\n  itsupport: { hook:'The fastest way into tech that doesn’t need a degree.',\n    reality:'You fix what people are stuck on: accounts, laptops, network drops, printers. You also become the person who knows how the whole place actually works.',\n    day:'A ticket queue and interruptions. Some tickets are two minutes, some are a morning. You talk to frustrated people all day.',\n    hard:'You get blamed for things you didn’t break, and the work can feel invisible when everything runs.',\n    thrives:'People who are patient with humans and stubborn with machines.',\n    way:'A CompTIA A+ certificate, a few months of study, then an entry role. Many people move to networking or security from here.',\n    catch:'Pay starts low for the Bay Area, and it’s a stepping stone more than a destination for most.' },\n  dispatcher: { hook:'You’re the first voice in the worst moment of someone\\u2019s life.',\n    reality:'You take the call, get the address, decide what to send, and keep the caller functional until it arrives. You give CPR instructions to people who are panicking.',\n    day:'Ten or twelve hour shifts at a console with multiple screens and radio traffic. Long quiet stretches, then everything at once.',\n    hard:'You hear the worst of it and you never find out how most calls ended. Dispatchers describe that not-knowing as the heavy part.',\n    thrives:'People who stay calm and organised while someone is screaming, and who can type while listening.',\n    way:'Hired straight out of high school in most agencies, then paid academy training. No degree required.',\n    catch:'Mandatory overtime is normal because agencies are short-staffed, and shift work is hard on sleep.' },\n  truckdriver: { hook:'No degree, no tuition, and you’re alone with the road.',\n    reality:'You move freight on a schedule, inspect your own equipment, log your hours by law, and handle everything that goes wrong between two points.',\n    day:'Up to eleven driving hours, then a mandatory break. Local routes get you home nightly, long-haul does not.',\n    hard:'Long-haul is isolating and hard on your body. The health numbers for drivers aren’t good, and the ones who last plan against that.',\n    thrives:'People who really like their own company and can stay disciplined without anyone watching.',\n    way:'A CDL takes about seven weeks and many carriers pay for it if you sign on. You can be earning within three months of graduating.',\n    catch:'Pay-per-mile means traffic and delays cost you money, and the first year with a carrier is usually the worst one.' },\n  chef: { hook:'A kitchen at 7pm on a Saturday. Ten minutes inside it.',\n    reality:'You run a station or a kitchen: prep, cook, plate, and keep quality identical on the fortieth plate. Speed and consistency, not creativity, is what gets you hired.',\n    day:'In at 10 for prep, service from 5 to 10, clean until midnight. Nights, weekends and holidays are the job.',\n    hard:'The hours cost you a normal social life, and the pay-to-stress ratio is why turnover is high. Kitchen culture has improved and it’s still intense.',\n    thrives:'People who like pressure with a clear finish line and who take pride in doing the same thing perfectly.',\n    way:'Start as a prep cook or dishwasher and move up, or do a culinary program. The kitchen route costs nothing and teaches faster.',\n    catch:'You will work when everyone else is off, and that never really changes.' },\n};\n\n// The spine's career-specific pieces: which authored guess fills which slot, plus\n// the myth, skills, flow, call and writing prompt that only exist per career.\nconst SL = {\n  teacherelem: { hardMyth:'The hardest part of teaching is the kids.', slots:[0,2,1,3],\n    myth:'Most of a teacher\\u2019s day is delivering lessons.',\n    mythReal:'Managing a room of thirty is most of it. Transitions, conflicts, the kid who didn’t eat breakfast, the two who can’t sit near each other. The lesson is the part that happens between all of that.',\n    mythFeel:'How do you feel about managing a room being most of the work?',\n    skills:['Holding a room without raising your voice','Knowing the content better than anyone','Noticing the kid whose week just changed','Grading fast','Explaining one thing four different ways','Being liked by the students','Advanced educational theory'],\n    skillsSet:[0,2,4],\n    skillsReal:'Presence, attention, and multiple explanations. Fourth grade content isn’t the hard part. Being the adult who noticed, and who can teach the same idea a fourth way for the kid who missed the first three, is the job.',\n    flow:['You reteach it a different way to the four who didn’t get it','You plan the week from where the class actually is','You teach the lesson','You find out who got it and who did not'],\n    flowSeq:[1,2,3,0],\n    flowReal:'The reteach is the step that gets cut when you’re tired, and it’s the one that makes the difference. Teachers who plan from where the class actually is, rather than from the pacing guide, are the ones whose kids move.',\n    call:[['Talk to them alone, at the end of the day','What experienced teachers do first. A quiet conversation solves more than an escalation, and the kid keeps their dignity in front of thirty people.'],\n      ['Call home the same day','Often right, and it depends entirely on what home is. Teachers who know their families know which calls help.'],\n      ['Loop in the counsellor','The correct move when it’s beyond you, and knowing where that line is takes a few years to learn.'],\n      ['Send them out of the room','Sometimes necessary for the other twenty-nine. It also ends the lesson for that kid and nothing has been solved.']],\n    callQ:'A kid who is usually fine has been disruptive for four days straight. What would you do?',\n    callReal:'You’re not a counsellor and you’re also the adult who sees them six hours a day. Teachers say learning where your job ends is harder than any of the teaching.',\n    write:'On explaining something to someone',\n    writeQ:'Half of teaching is explaining the same thing a different way for the person who didn’t get it the first time. Think of a time you taught somebody something. What did you have to change to get through?',\n    writeReal:'That reflex, changing the explanation instead of repeating it louder, is the whole skill. The qualification takes five years. This part you either have or you build deliberately.' },\n\n  plumber: { hardMyth:'The hardest part of plumbing is how dirty it is.', slots:[0,1,2,3],\n    myth:'Plumbing is mostly installing new pipe.',\n    mythReal:'It’s mostly diagnosis and repair in buildings that already exist. Finding out where the leak actually is, and getting to it without destroying somebody\\u2019s kitchen, is the paid skill.',\n    mythFeel:'How do you feel about spending most of the day figuring out rather than building?',\n    skills:['Working out where a problem is before you open anything','Being strong enough to do it alone','Reading a system you can’t see','Memorising the code book','Being easy to have in somebody\\u2019s house','Working fast above all','Advanced hydraulics'],\n    skillsSet:[0,2,4],\n    skillsReal:'Diagnosis, imagination about what is behind the wall, and being pleasant in a stranger\\u2019s home. You’re in somebody\\u2019s bathroom while they hover, and plumbers who are easy to have around get the referrals.',\n    flow:['You open the smallest access you can get away with','The customer describes a symptom','You make the repair and test it','You trace the system to find the actual source'],\n    flowSeq:[1,3,0,2],\n    flowReal:'Tracing before cutting is what separates a plumber from somebody with tools. Every unnecessary hole in a wall is a drywall bill the customer remembers longer than the repair.',\n    call:[['Explain what it will really cost and why, then let them decide','The honest route, and it loses you some jobs. It’s also why plumbers live on referrals rather than advertising.'],\n      ['Do the cheap fix and tell them plainly it will come back','Defensible when somebody really can’t pay, as long as the truth comes with it.'],\n      ['Do the cheap fix and say nothing','What gives the trade its reputation. It fails again in six months and they call somebody else.'],\n      ['Recommend replacing the whole line','Sometimes correct on old pipe, and the easiest thing in this trade to oversell. Customers can tell.']],\n    callQ:'The real repair is expensive and the customer is clearly stretched. What would you do?',\n    callReal:'This call, twenty times a month, is what builds or ends a plumber\\u2019s business. The work is teachable. Being the one people call back is the part that pays.',\n    write:'On fixing something',\n    writeQ:'Plumbers say the good part is walking out of a house where something was broken and now it’s not. Think of something you fixed. What was it, and what did it take?',\n    writeReal:'That’s the reward this trade actually gives you, several times a day, and it’s why plumbers rarely describe their work as abstract. If that does nothing for you, the money won’t carry you through the crawl spaces.' },\n\n  machinist: { hardMyth:'The hard part of machining is the physical work.', slots:[0,1,2,3],\n    myth:'A machinist spends most of the shift cutting metal.',\n    mythReal:'The machine cuts. You set up, you measure, you adjust, and you check. A ninety-minute setup for a four-hour run is normal, and the setup is where the money and the mistakes live.',\n    mythFeel:'How do you feel about the machine doing the cutting while you do the measuring?',\n    skills:['Measuring to a couple of thousandths and trusting it','Working faster than the other machines','Reading a drawing and seeing the setup','Memorising every material','Catching your own mistake on the first part','Working with a big team','Advanced calculus'],\n    skillsSet:[0,2,4],\n    skillsReal:'Measurement, spatial reading, and catching yourself. The first-part inspection is the whole safety net. A machinist who trusts a bad measurement scraps a run, and everybody knows whose setup it was.',\n    flow:['You measure the first part and adjust','You read the drawing and plan the setup','You run the rest and spot-check','You set the tools and the offsets'],\n    flowSeq:[1,3,0,2],\n    flowReal:'Nothing runs before the first part is measured. Machinists who skip straight to production are the reason expensive material becomes scrap, and it’s always traceable to the setup.',\n    call:[['Stop the machine and tell the lead immediately','What good shops want. Scrap gets more expensive the longer it runs, and hiding it’s how machinists lose jobs.'],\n      ['Measure again to be certain, then stop it','Sound. Being sure takes two minutes and being wrong either way is costly.'],\n      ['Adjust the offset and keep running','Sometimes exactly right if you caught it on part two. Sometimes it turns one bad part into thirty.'],\n      ['Finish the run and sort the parts after','Tempting when you’re behind, and the version that shows up in a quality meeting with your name on it.']],\n    callQ:'You measure part three and it’s out of tolerance. There are forty more in the run. What would you do?',\n    callReal:'Every machinist has scrapped something expensive. The ones who are trusted are the ones who said so within a minute rather than an hour.',\n    write:'On getting something exactly right',\n    writeQ:'This job is about a number being right rather than a person being impressed. Think of something you made or did where precision mattered. What was it, and how close did you get?',\n    writeReal:'That satisfaction, a measurement landing where it should, is what machinists name as the reason they stayed. It’s a quiet reward and it’s worth knowing now whether it does anything for you.' },\n\n  elevator: { hardMyth:'The hardest part of this trade is the physical risk.', slots:[0,1,2,3],\n    myth:'Elevator mechanics mostly install new elevators.',\n    mythReal:'Most of the work is service and modernisation on equipment that already exists, usually an intermittent fault in a building that needs the elevator working today. You’re troubleshooting more than installing.',\n    mythFeel:'How do you feel about chasing faults instead of building new things?',\n    skills:['Staying with an intermittent fault until you find it','Being physically strongest','Reading mechanical, electrical and control systems together','Memorising every model','Following the safety procedure exactly, alone, unwatched','Working with a big crew','Advanced physics'],\n    skillsSet:[0,2,4],\n    skillsReal:'Patience with a fault, three kinds of systems at once, and discipline when nobody is watching. You’re often alone in a shaft, which means the procedure only happens if you decide it does.',\n    flow:['You lock out the equipment and make it safe','A building calls, the elevator is faulting intermittently','You repair, test, and return it to service','You reproduce the fault and trace it'],\n    flowSeq:[1,0,3,2],\n    flowReal:'Lockout comes before diagnosis, every time, including on the fault you have seen a hundred times. This trade\\u2019s rules are written from incidents, and the shaft doesn’t care how experienced you are.',\n    call:[['Follow the full lockout procedure even though it costs twenty minutes','What the trade requires and what keeps mechanics alive. Nobody is watching, which is exactly why it counts.'],\n      ['Do the quick version, you have done this a hundred times','Honest about how it happens, and it’s the setup for most serious incidents in this trade.'],\n      ['Call your partner to come do it with you','Right for anything really hazardous, and knowing which jobs those are is what the apprenticeship teaches.'],\n      ['Tell the building it waits until tomorrow','Sometimes the correct call. It costs the building and it’s better than a shortcut.']],\n    callQ:'You’re alone in a machine room, the building is pressing you, and the full procedure takes twenty minutes. What would you do?',\n    callReal:'The pay in this trade is partly for the skill and partly for being the person who does it right with nobody checking. Mechanics say that’s the real entry requirement.',\n    write:'On being trusted alone',\n    writeQ:'Most of this job is you, alone, doing it correctly because you decided to. Think of a time nobody was checking your work. What did you do?',\n    writeReal:'That answer matters more here than in almost any job on this list. You will spend your career alone in machine rooms, and the trade is built on the assumption that you do it right anyway.' },\n\n  cyber: { hardMyth:'The hardest part of security is the technical difficulty.', slots:[0,1,2,3],\n    myth:'Security analysts spend their days breaking into systems.',\n    mythReal:'You work an alert queue, and most of what you investigate turns out to be nothing. The dramatic version, penetration testing, is a small specialist corner. The daily job is patient investigation and clear write-ups.',\n    mythFeel:'How do you feel about most of your investigations turning out to be nothing?',\n    skills:['Staying suspicious about something that looks fine','Knowing every attack technique by name','Following a thread for an hour without giving up','Memorising every tool','Writing up what happened for people who aren’t technical','Working alone with no interruptions','Advanced cryptography'],\n    skillsSet:[0,2,4],\n    skillsReal:'Suspicion, persistence, and plain writing. The investigation is half the job and explaining it to legal and leadership is the other half. Analysts who can’t write stay junior.',\n    flow:['You write it up so somebody non-technical understands','An alert fires and looks like nothing','You contain it and close the gap','You pull the thread and find it’s real'],\n    flowSeq:[1,3,2,0],\n    flowReal:'The write-up isn’t paperwork, it’s the deliverable. Decisions about money and disclosure get made off your summary, and an unclear one costs the organisation more than the incident did.',\n    call:[['Escalate now with what you have, and keep digging','What incident response training says. Early and incomplete beats late and certain when something is live.'],\n      ['Spend another hour confirming before you wake anybody','Understandable, and it’s how a contained problem becomes a big one.'],\n      ['Contain it yourself first, then tell people','Sometimes right, and it depends entirely on your authority to act. Doing it without that authority is its own incident.'],\n      ['Write it up properly and raise it in the morning','Correct for most alerts and wrong for this one. Telling those apart is the skill the job is actually testing.']],\n    callQ:'At 11pm an alert looks like it might be a real intrusion, and you’re not certain. What would you do?',\n    callReal:'This call is the job, and you make it tired and unsure. Analysts say the gut reaction to escalate early is what separates the ones who get trusted with incidents from the ones who do not.',\n    write:'On noticing something was off',\n    writeQ:'This work rewards the person who thought something didn’t add up and checked. Think of a time you noticed something was wrong that other people had not. What was it?',\n    writeReal:'That’s the mindset the field hires for, and it’s not teachable in a certificate. Security+ gets you the interview. Being the person who checks is what gets you the job.' },\n\n  datacenter: { hardMyth:'The hard part of this job is the technical complexity.', slots:[0,1,2,3],\n    myth:'The people who build AI also keep it running.',\n    mythReal:'Different job entirely. Technicians keep the hardware, power and cooling alive on shift, and the models people talk about depend on a queue of physical work getting done tonight. It’s one of the few technology jobs you can start with a certificate.',\n    mythFeel:'How do you feel about being the physical layer under all of it?',\n    skills:['Working through a queue without cutting corners','Knowing how the AI models work','Tracing a fault through cables and racks','Memorising every server model','Documenting what you changed so the next shift knows','Needing people around you','Advanced computer science'],\n    skillsSet:[0,2,4],\n    skillsReal:'Discipline, physical tracing, and handover notes. The next shift inherits whatever you did or didn’t write down, and a room this size only works because everyone documents.',\n    flow:['You verify it’s healthy and document the change','A monitoring alert flags a failed component','You swap the hardware and re-cable it','You locate the exact rack and unit on the floor'],\n    flowSeq:[1,3,2,0],\n    flowReal:'Finding the right rack is a real step and people underestimate it. Pulling a drive from the wrong unit in a live room is the mistake every technician hears about in their first week.',\n    call:[['Follow the procedure and log it, even at 4am','What the room runs on. These buildings work because the boring steps happen on the night shift too.'],\n      ['Fix it fast and write it up at the end of the shift','Common, and the notes get thinner as the shift gets longer. That’s where handover failures come from.'],\n      ['Wake the on-call engineer','Right when it’s outside your authority, and knowing that line is most of your first year.'],\n      ['Leave it for the day shift','Occasionally correct for non-urgent work, and it means somebody else inherits your judgement call.']],\n    callQ:'It’s 4am, you’re the only technician on the floor, and the procedure for this swap is longer than the shortcut. What would you do?',\n    callReal:'Nobody is watching at 4am, and that’s the entire test. Every operator will tell you the technicians who get promoted are the ones whose overnight work looks the same as their daytime work.',\n    write:'On working while everyone else is asleep',\n    writeQ:'Somebody is on shift in these buildings right now. Think about a time you had to work or focus at an odd hour, or on your own with nobody around. How did that go for you?',\n    writeReal:'The schedule, not the work, is what decides whether people stay in this job. Answering that honestly now is worth more than finding out three months into a night rotation.' },\n  radtech: { hardMyth:'The hardest part of this job is the radiation risk to you.', slots:[0,1,2,3],\n    myth:'Radiologic techs mostly sit at a computer looking at images.',\n    mythReal:'You’re on your feet, and a lot of the shift is physically moving people who can’t move themselves. Transfers from gurneys and wheelchairs, all day. Techs learn proper lifting on day one because backs are what end this career.',\n    mythFeel:'How do you feel about lifting and moving people all day?',\n    skills:['Positioning a patient who can’t follow instructions','Being strong enough to lift alone','Judging whether your own image is good enough','Memorising every bone in the body','Explaining a scary machine in plain words','Working faster than everyone else','Advanced physics'],\n    skillsSet:[0,2,4],\n    skillsReal:'Positioning, self-judgement, and plain speech. The radiologist writes the diagnosis, but you decide whether the image is worth diagnosing from. A bad angle means the patient gets dosed with radiation again.',\n    flow:['You check your own image before anyone sees it','A doctor orders the scan','The radiologist reads it and writes the diagnosis','You position the patient and take it'],\n    flowSeq:[1,3,0,2],\n    flowReal:'Your quality check sits between the shot and the read. Nobody else catches a bad angle, and the cost of missing it’s a second dose of radiation for that patient.',\n    call:[['Retake it yourself before the radiologist sees it','Standard practice, and the right reflex. Techs retake their own marginal images constantly, and nobody thinks less of you for it.'],\n      ['Send it and flag that the positioning was hard','Honest, and sometimes correct if the patient can’t tolerate more. The radiologist would rather know than guess.'],\n      ['Ask a senior tech to look at it with you','Normal in a busy department, and the fastest way to learn what \"good enough\" means in your first year.'],\n      ['Send it and hope it reads fine','The one the training drills out of you. A repeat scan costs the patient radiation, and the department has your name on the image.']],\n    callQ:'Your image is borderline. The patient is uncomfortable and the department is running late. What would you do?',\n    callReal:'This exact call, retake or send, is the call you make every day. Radiation dose is real and so is the schedule, and nobody is standing there to decide for you.',\n    write:'On getting something exactly right',\n    writeQ:'Techs say the satisfaction is a clean image on the first try. Think of something you did where the details had to be exactly right. What was it, and did you get it right?',\n    writeReal:'That reflex, caring whether it’s right rather than whether it’s done, is what separates a tech people trust from one whose images come back for repeats.' },\n\n  nurse: { hardMyth:'The hardest part of nursing is seeing people die.', slots:[0,2,1,3],\n    myth:'Nurses spend most of their shift doing hands-on care.',\n    mythReal:'Charting takes more of a shift than people expect. Every assessment, medication and conversation gets written down, and nurses routinely stay late to finish it. It’s the most common complaint about the job.',\n    mythFeel:'How do you feel about an hour of documentation for every few hours of care?',\n    skills:['Noticing a small change before it becomes an emergency','Never getting emotional','Documenting clearly under time pressure','Knowing every medication by heart','Telling a doctor they’re wrong','Working a full shift without a break','Advanced chemistry'],\n    skillsSet:[0,2,4],\n    skillsReal:'Noticing, recording, and speaking up. The nurse who gets respected on a floor is the one who catches a pattern early and can prove it, then says so to someone senior.',\n    flow:['You escalate with a pattern, not a single number','You assess your patient at the start of the shift','The doctor changes the plan','You notice one number drifting and recheck it'],\n    flowSeq:[1,3,0,2],\n    flowReal:'The recheck is the step people skip in their heads. One odd reading is noise. Two, written down, is evidence, and evidence is what makes a doctor act.',\n    call:[['Recheck, document, then call the doctor with the pattern','What experienced nurses do, and what gets taken seriously. A pattern moves faster than a worry.'],\n      ['Call the doctor immediately','Sometimes right, especially at night. The risk is being dismissed on a single number and hesitating next time.'],\n      ['Ask the charge nurse to look with you','Normal and fast. A second set of eyes on the floor is the point of having a floor.'],\n      ['Wait for the next set of vitals','Occasionally reasonable, and the one that shows up in incident reviews. Waiting is a decision, and it’s on your name.']],\n    callQ:'Your patient\\u2019s vitals shift slightly and nothing is obviously wrong. What would you do?',\n    callReal:'Nursing is a series of calls like this with nobody to make them for you. There’s no single right answer, but notice what the good ones share: somebody senior finds out while there’s still time.',\n    write:'On staying steady',\n    writeQ:'Nurses say the job is being the calm one on the worst day of someone\\u2019s life. Think of a time things went badly around you and you stayed steady. What happened?',\n    writeReal:'That’s the part of nursing that can’t be taught in a program. The clinical knowledge takes four years. Being the steady person in the room is something you either build or you do not.' },\n\n  electrician: { hardMyth:'The thing that ends an electrician\\u2019s career is getting shocked.', slots:[0,1,3,2],\n    myth:'An electrician\\u2019s work passes as long as it works.',\n    mythReal:'Code decides, judged by an inspector. Plenty of wiring works fine and still fails inspection, and then you tear it out and do it again on your own time. Learning code is as much of the job as the hands-on part.',\n    mythFeel:'How do you feel about work being judged by a rulebook, not by whether it works?',\n    skills:['Tracing what is actually there instead of what the plans say','Memorising the entire code book','Doing math on load and capacity','Working faster than the other crews','Explaining to a customer why it costs that much','Never asking for help','Advanced calculus'],\n    skillsSet:[0,2,4],\n    skillsReal:'Tracing, math, and explaining. Old buildings are full of work nobody written down, and assuming the drawing is right is how people get hurt. The math is where apprentices actually wash out.',\n    flow:['You pull the permit and plan the circuits','The inspector signs it off','You trace what is already in the walls','You rough in the wiring'],\n    flowSeq:[2,0,3,1],\n    flowReal:'Tracing comes first, before the permit and before any planning, because what is in the wall decides what is possible. Crews that plan from the drawing alone lose the day.',\n    call:[['Stop and trace every circuit before touching anything','What experienced electricians do. Slow at the start, faster than the alternative, and it’s how you avoid energising something you didn’t know was live.'],\n      ['Follow the plans and note the discrepancy','Reasonable on new construction. On an old building it’s how people get surprised.'],\n      ['Call the foreman and wait','Fair, and sometimes required. It costs time, and on a hazard call it’s the right cost.'],\n      ['Rewire it to match the plans','Tempting, and it can turn a small job into a very large one that nobody authorised.']],\n    callQ:'You open a panel and the wiring doesn’t match the plans. What would you do?',\n    callReal:'The whole trade is this call, made twenty times a week. The plans are a guess about the building. The panel is the building.',\n    write:'On figuring something out',\n    writeQ:'Electricians say the good days are the ones where you find the fault nobody else found. Think of a time you figured out why something was broken. How did you get to it?',\n    writeReal:'What you just described, working backwards from a symptom, is diagnosis, and it’s the part of this trade that pays. Anyone can replace a part. Knowing which one is the job.' },\n\n  firefighter: { hardMyth:'The hardest part of becoming a firefighter is the physical test.', slots:[0,3,1,2],\n    myth:'Most of a firefighter\\u2019s calls are fires.',\n    mythReal:'Under a fifth in most departments. The majority are medical calls, which is why every hire needs an EMT certificate before any of the fire training matters.',\n    mythFeel:'How do you feel about the job being mostly medical calls?',\n    skills:['Staying calm when someone else is panicking','Being the strongest person on the crew','Doing the same drill for the thousandth time','Never being afraid','Working with people you didn’t choose','Making decisions alone','Advanced anatomy'],\n    skillsSet:[0,2,4],\n    skillsReal:'Calm, repetition, and living with your crew. The strength standard is a floor you pass once. The drilling never stops, and you sleep in the same building as the same people for twenty years.',\n    flow:['The crew drills and checks equipment','The tones drop and you’re moving in ninety seconds','You clean, restock, and write it up','You work the call'],\n    flowSeq:[0,1,3,2],\n    flowReal:'The unglamorous ends of that list are most of the job. The call is the middle. The drilling before and the restocking after are what fill a twenty-four hour shift.',\n    call:[['Follow your training exactly, even though it feels slow','What departments want, and what keeps crews alive. Improvising on scene is how firefighters get hurt.'],\n      ['Do what the captain says without question','Correct on scene. The chain of command exists because nobody can see the whole picture from inside it.'],\n      ['Speak up if you see something the crew missed','Expected of you, including as the newest person. Departments train for exactly this.'],\n      ['Go in faster than the plan because someone is inside','The reflex that makes people want this job, and the one that appears in line-of-duty reports.']],\n    callQ:'You arrive and the plan feels too slow for what you’re seeing. What would you do?',\n    callReal:'Every department drills this because instinct and training pull in opposite directions here. There’s no clean answer, and the crews that come home are the ones that have already decided.',\n    write:'On being part of something',\n    writeQ:'Firefighters describe the crew as the reason they stay, more than the calls. Think of a team you were really part of. What made it work, or not work?',\n    writeReal:'You’re choosing a crew as much as a career. Twenty-four hour shifts mean you eat, sleep and train with the same people, and people who need distance from coworkers find that harder than the fires.' },\n\n  hvac: { hardMyth:'HVAC work is steady, year round.', slots:[0,2,1,3],\n    myth:'The skill in HVAC is replacing the broken part.',\n    mythReal:'The skill is diagnosis, in a disciplined order. Anyone can swap a part. Getting paid well comes from finding the real fault fast instead of replacing things until it works.',\n    mythFeel:'How do you feel about being paid for figuring it out rather than fixing it?',\n    skills:['Diagnosing in a set order instead of guessing','Being able to lift a compressor alone','Reading pressures and temperatures together','Memorising every model number','Telling a customer the honest price','Working in comfortable conditions','Advanced thermodynamics'],\n    skillsSet:[0,2,4],\n    skillsReal:'Doing it in order, reading gauges, and being straight with people. The techs who build a reputation are the ones who diagnose in sequence and quote the real number, because half this trade\\u2019s business is people who were burned by the last guy.',\n    flow:['You take pressures and temperatures','The customer calls, it’s not cooling','You quote the repair honestly','You find the actual fault'],\n    flowSeq:[1,0,3,2],\n    flowReal:'The gauges come before the theory. Techs who diagnose from the symptom instead of the readings are the ones who replace three parts and still haven’t fixed it.',\n    call:[['Tell them it needs the leak found and repaired properly','The honest call, and the one that loses you the job sometimes. Venting refrigerant is federally regulated, and topping off a leaking system is a quick fix.'],\n      ['Top it off and tell them plainly it will fail again','Common, and fair if the customer really can’t pay today. It has to come with the truth attached.'],\n      ['Top it off and say nothing','What gives this trade its reputation. The system fails again in August and the customer calls somebody else.'],\n      ['Recommend replacing the whole unit','Sometimes right on an old system, and the easiest thing to oversell. Customers can tell.']],\n    callQ:'A system is low on refrigerant, which means it’s leaking. The customer wants the cheap fix. What would you do?',\n    callReal:'This is the daily right-or-wrong call of the trade, and it’s why referrals matter more than advertising. You need EPA certification to handle refrigerant at all, which is part of why the certificate is worth having.',\n    write:'On working in bad conditions',\n    writeQ:'An attic in August can pass 140 degrees, and that’s where the equipment is. Think of a time you worked through really unpleasant conditions. What kept you going?',\n    writeReal:'That’s a real question about this trade, not a test. The pay is good because the spaces are bad, and knowing how you handle heat is worth finding out now rather than in July.' },\n\n  dentalhyg: { hardMyth:'The limit on this career is how much it pays.', slots:[0,1,3,2],\n    myth:'The dentist is the one who spots gum disease.',\n    mythReal:'You are. You measure pockets and read tissue every appointment, and you’re the one who flags it. The dentist confirms and treats. Patients see you far more than they see the dentist.',\n    mythFeel:'How do you feel about being the one who catches it first?',\n    skills:['Giving someone one change they will actually make','Being able to lecture a patient effectively','Reading tissue and measuring precisely','Remembering every patient\\u2019s name','Talking easily to someone who is embarrassed','Working quickly above all','Advanced biology'],\n    skillsSet:[0,2,4],\n    skillsReal:'Precision, plain talk, and not shaming anybody. Lecturing loses patients. Hygienists who keep a full schedule are the ones people aren’t embarrassed to come back to.',\n    flow:['You clean and measure','You flag what you found to the dentist','You review the chart and last visit','You give the patient one thing to change'],\n    flowSeq:[2,0,1,3],\n    flowReal:'The chart first, the advice last. Hygienists who skip the history give generic advice, and generic advice is what patients ignore.',\n    call:[['Show them what you see and give them one specific change','What works. One change they will actually make beats a full lecture they will not.'],\n      ['Tell them plainly that you can tell','Honest, and it costs you some patients. Others respect it and come back.'],\n      ['Note it in the chart and let the dentist raise it','Fair, and it passes a conversation you’re better placed to have.'],\n      ['Say nothing and just clean','The path of least resistance, and the reason some patients go years without hearing the truth about their gums.']],\n    callQ:'A patient clearly hasn’t flossed in months and tells you they floss daily. What would you do?',\n    callReal:'This is the whole people part of the job. You can’t make anybody do anything, and the hygienists who change behaviour do it with one small ask, not with the truth delivered hard.',\n    write:'On talking to someone about something awkward',\n    writeQ:'Half this job is telling people things they would rather not hear, without making them feel bad. Think of a time you had to do that. How did you handle it?',\n    writeReal:'That skill is most of what makes a hygienist good, and it’s the part the licence doesn’t test. The scaling technique takes two years to learn. This part you either have or you build on purpose.' },\n\n  paramedic: { hardMyth:'Paramedics are paid comparably to nurses.', slots:[0,1,2,3],\n    myth:'A paramedic waits for the hospital to tell them what to do.',\n    mythReal:'You decide, inside your protocols, on scene, usually without asking anyone. That kind of say with that little supervision is the good part of the job, and it’s also part of why it wears people down.',\n    mythFeel:'How do you feel about making medical calls with nobody senior there?',\n    skills:['Deciding fast with incomplete information','Never being rattled','Working in somebody\\u2019s living room, not a clean room','Memorising every drug dose','Talking to a family while you work','Being physically strongest','Advanced pharmacology'],\n    skillsSet:[0,2,4],\n    skillsReal:'Speed with bad information, adaptability, and talking while you work. You’re doing medicine on a kitchen floor with the family watching, and the room is never set up for you.',\n    flow:['You hand off to the hospital team','The call comes in with half the information','You treat inside your protocols','You arrive and decide what is actually happening'],\n    flowSeq:[1,3,2,0],\n    flowReal:'The gap between what dispatch said and what you find is where the job lives. Almost every call is different from how it was described.',\n    call:[['Treat what you’re seeing, not what the call said','What paramedics do. Dispatch information is a starting point, and correcting it fast is the skill.'],\n      ['Radio the hospital for direction','Available, and the right move for anything outside protocol. It costs minutes you may not have.'],\n      ['Ask the family more questions first','Often the fastest route to the real problem, especially with an unclear patient.'],\n      ['Transport immediately and treat on the way','Sometimes correct, and sometimes the reason a treatable problem got worse in a moving truck.']],\n    callQ:'You arrive and the patient\\u2019s problem is nothing like what dispatch described. What would you do?',\n    callReal:'Calls like this are the job rather than the exception, and you make the call alone. That’s either the best part or the reason people leave for nursing within five years.',\n    write:'On somebody depending on you',\n    writeQ:'Paramedics describe the weight as being the person somebody\\u2019s family is looking at. Think of a time people were counting on you and you knew it. What was that like?',\n    writeReal:'That weight, hundreds of times, with no idea how most of them ended, is what paramedics name as the hard part. Not the blood. The not knowing, and being the one they looked at.' },\n\n  welderfab: { hardMyth:'The hard part of inspection is reading the instruments.', slots:[0,3,1,2],\n    myth:'A weld inspector can start straight out of high school.',\n    mythReal:'You weld first. To get certified you need logged years on the tools, so this is a second career step, usually in your late twenties. You learn to weld, then you learn to judge welding.',\n    mythFeel:'How do you feel about a career that starts with a different job first?',\n    skills:['Telling an experienced welder their work failed','Being the fastest welder on the crew','Reading ultrasound and x-ray results','Memorising every code standard','Documenting a finding so it holds up','Avoiding conflict','Advanced metallurgy'],\n    skillsSet:[0,2,4],\n    skillsReal:'Nerve, instrument reading, and documentation. Your report costs somebody a day of work, so it has to be right and it has to be written down clearly enough to survive an argument.',\n    flow:['You test the weld with ultrasound or x-ray','The welder makes the weld','It gets cut out and redone','You document the failure'],\n    flowSeq:[1,0,3,2],\n    flowReal:'The documentation comes before the rework, not after. A finding without a clear record is a finding that gets argued away, and then the bad weld stays in the structure.',\n    call:[['Fail it and document exactly why','The job. Your name is on the report either way, and the structure outlives the argument.'],\n      ['Fail it and walk him through the reading','Better where you can. An inspector who teaches gets fewer repeat failures on the next job.'],\n      ['Re-test to be certain before failing it','Sound practice. Being sure costs an hour and being wrong costs your credibility.'],\n      ['Pass it with a note, since it’s probably fine','The one that ends careers, and occasionally lives. Probably fine isn’t a standard.']],\n    callQ:'A weld fails your test and the welder has twenty years on you. What would you do?',\n    callReal:'This is why the certification exists and why not everyone can do this job. The metal doesn’t care who is more experienced, and the inspector who can be talked out of a finding is worse than no inspector.',\n    write:'On holding a line',\n    writeQ:'Inspectors say the job is being unpopular correctly. Think of a time you held a position that annoyed people around you. What happened?',\n    writeReal:'That’s the actual requirement here, more than the instruments. Plenty of skilled welders can’t do this job, because it means saying no to people they respect, on the record.' },\n\n  itsupport: { hardMyth:'Support is a career you can stay in and keep growing.', slots:[0,1,2,3],\n    myth:'IT support is mostly fixing computers.',\n    mythReal:'It’s mostly people who are stuck. The technical fixes are usually simple. Doing it without making somebody feel stupid is what gets you promoted, and what gets you remembered.',\n    mythFeel:'How do you feel about a technical job that’s mostly conversation?',\n    skills:['Getting the real story out of a frustrated person','Knowing every error code by memory','Working out what changed and when','Typing extremely fast','Writing down what you did so the next person can read it','Fixing things without asking questions','Advanced computer science'],\n    skillsSet:[0,2,4],\n    skillsReal:'Questions, sequence, and notes. Most tickets are solved by the question, not the tool. The people who move up are the ones whose documentation other people can follow.',\n    flow:['You fix it and write down what it was','A ticket comes in saying \"it’s broken\"','You find what actually changed','You ask what they were doing when it stopped'],\n    flowSeq:[1,3,2,0],\n    flowReal:'The question comes before the diagnosis, and the write-up isn’t optional. Support teams live or die on whether last month\\u2019s fix is findable.',\n    call:[['Ask what they were doing when it stopped working','Where experienced support starts. What changed, and when, solves most of it.'],\n      ['Remote in and look for yourself','Efficient, and it works. You miss the context sometimes, and the context is often the fix.'],\n      ['Restart it and see if that clears it','Really fixes a lot of things, and it teaches you nothing about why. Fine as a first move, bad as a habit.'],\n      ['Escalate it to the next tier','Sometimes correct. Doing it early and often is how you stay in a tier-one seat for years.']],\n    callQ:'A user says \"it’s broken\" and nothing else. What would you do?',\n    callReal:'Every ticket is this. The technical skill sets your floor, and the questions you ask set your ceiling.',\n    write:'On explaining something to someone',\n    writeQ:'This job is explaining a technical thing to someone who is frustrated and in a hurry. Think of a time you explained something to someone who didn’t get it. How did you do it?',\n    writeReal:'That’s the skill that separates support people who move into networking and security from the ones who stay. The certificate gets you the first interview. This gets you the second job.' },\n\n  dispatcher: { hardMyth:'The hardest part of dispatch is the pace of the calls.', slots:[0,1,3,2],\n    myth:'The first thing a dispatcher does is calm the caller down.',\n    mythReal:'The first thing is the address, always. Help can’t move without it. Everything else, including calming anybody, happens while units are already driving.',\n    mythFeel:'How do you feel about getting the address before anything else, even from someone screaming?',\n    skills:['Getting one piece of information out of a panicking person','Never feeling anything','Doing three things at once without dropping any','Knowing every street by memory','Coaching CPR out loud while counting','Working in silence','Advanced geography'],\n    skillsSet:[0,2,4],\n    skillsReal:'Extraction, parallel processing, and your voice. Dispatchers save lives by coaching compressions down a phone line, sometimes for ten minutes, before anybody arrives.',\n    flow:['You get the address','You coach them through what to do until help arrives','You dispatch the nearest units','You find out what is happening'],\n    flowSeq:[0,2,3,1],\n    flowReal:'Units are moving before you know the full story. Dispatchers who gather the whole picture first are the ones whose ambulances leave two minutes late.',\n    call:[['Keep asking for the address, over the screaming','The training, and it’s harder than it sounds. Nothing else you do matters until help can move.'],\n      ['Try to calm them first, then ask','Human, and it costs seconds that turn into minutes. Most dispatchers have to unlearn this.'],\n      ['Ask what happened so you know what to send','Feels responsible, and it’s the wrong order. Send first, refine after.'],\n      ['Use the phone location and confirm it with them','Available now, and good practice. It’s a starting point, not a substitute.']],\n    callQ:'A caller is screaming and hasn’t given you an address. What would you do?',\n    callReal:'This is the first thing every dispatcher is trained on and the last thing to feel natural. The address isn’t paperwork. It’s the whole call.',\n    write:'On your voice being the only thing you have',\n    writeQ:'Dispatchers work with nothing but a voice, and no idea how it ended. Think of a time you helped someone you could
