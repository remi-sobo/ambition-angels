n’t see, or never heard from again. What was that like?',\n    writeReal:'Not knowing is what dispatchers name as the weight. You hand the call off and it disappears, hundreds of times. People who need to see the outcome find this job very hard.' },\n\n  truckdriver: { hardMyth:'The hardest part of driving is the driving.', slots:[0,1,2,3],\n    myth:'Sitting in traffic is just wasted time.',\n    mythReal:'It’s wasted money. Most contracts pay by the mile, so sitting still pays nothing. That’s why drivers care about routes and dispatchers more than almost anything else about the job.',\n    mythFeel:'How do you feel about being paid by the mile instead of by the hour?',\n    skills:['Planning a route around hours and traffic','Being able to drive for sixteen hours straight','Backing a trailer into a tight dock','Memorising every highway','Getting along with a dispatcher','Never needing company','Advanced mechanics'],\n    skillsSet:[0,2,4],\n    skillsReal:'Planning, backing, and your dispatcher relationship. The driving is the easy part. Backing into a dock and staying on good terms with the person who assigns your loads is the job.',\n    flow:['You inspect the truck and log on','Dispatch assigns the load','You deliver and get the next assignment','You drive inside your legal hours'],\n    flowSeq:[1,0,3,2],\n    flowReal:'The inspection and the log come before the wheels move, and the device enforces the hours whether you agree or not. Eleven driving hours inside a fourteen-hour window, logged electronically.',\n    call:[['Stop, log it, and deliver late','What the law requires and what the device records anyway. Late beats a violation, and it beats the alternative.'],\n      ['Call dispatch and tell them before you’re out of hours','The move experienced drivers make. Dispatch can re-plan if they know early.'],\n      ['Push the last hour and hope nobody checks','The device checks. This is the violation drivers actually get caught on.'],\n      ['Ask for a relay or a team driver','Fair on a tight load, and worth knowing exists before you need it.']],\n    callQ:'You’re an hour from the delivery and out of legal driving hours. What would you do?',\n    callReal:'The hours aren’t a guideline and they’re not on your honour. They’re logged by a device, and this call decides whether the job is sustainable or a series of near misses.',\n    write:'On being alone with your own time',\n    writeQ:'Long-haul means days by yourself with your own thoughts and nobody to talk to. Think of a stretch of time you spent mostly alone. How did that go for you?',\n    writeReal:'That’s a real question and worth answering honestly. Some drivers describe the solitude as the whole appeal. Others find out three weeks in that they can’t do it, and local routes exist for exactly that reason.' },\n\n  chef: { hardMyth:'The hardest part of kitchen work is the heat and the pressure.', slots:[0,2,1,3],\n    myth:'Kitchens hire for creativity.',\n    mythReal:'They hire for speed and consistency. Doing the same plate identically, fast, for five hours. Creativity comes years later, if at all, and only after you can hold a station on a Friday night.',\n    mythFeel:'How do you feel about years of repetition before any creative say?',\n    skills:['Doing the same task identically for five hours','Inventing new dishes','Keeping your station clean while it’s chaos','Knowing every classical sauce','Taking a correction at 7:30pm without arguing','Working alone at your own pace','Advanced nutrition'],\n    skillsSet:[0,2,4],\n    skillsReal:'Repetition, order, and taking correction. Kitchens run on stations staying clean and people not arguing during service. How you handle being wrong at the worst moment decides what you get trusted with.',\n    flow:['Service starts and the tickets come','You prep your station before service','You break down and clean','You cook to the ticket, identically, for hours'],\n    flowSeq:[1,0,3,2],\n    flowReal:'Prep is where the night is won or lost, and the breakdown isn’t optional. Cooks who prep badly spend service behind, and cooks who clean badly don’t last.',\n    call:[['Remake it immediately and move on','What kitchens want. Service doesn’t stop, and the remake is faster than the conversation.'],\n      ['Remake it and ask the chef what was wrong after service','Good gut and good timing. Mid-service isn’t when that conversation happens.'],\n      ['Ask the server exactly what the guest said','Sometimes the fastest fix, and sometimes it stalls a line that can’t stall.'],\n      ['Argue that the plate was correct','Occasionally you’re right, and it’s still the wrong moment. This is the one that gets people moved off the line.']],\n    callQ:'A dish comes back from a table in the middle of service. What would you do?',\n    callReal:'How you handle being wrong at 7:30pm decides whether you get a station. Nobody in a kitchen cares whether it was your fault while there are forty covers waiting.',\n    write:'On feeding people',\n    writeQ:'Cooks say the reason they stay is watching people eat something they made. Think of a time you cooked or made something for other people. What was it, and what happened?',\n    writeReal:'That’s the pull that keeps people in kitchens through the hours and the pay. It’s worth knowing whether you actually feel it, because it’s most of what the job gives back.' },\n};\n\n// Four real guesses per career. Wrong answers are the ones teens actually pick.\nconst MCS = {\n  teacherelem: [\n    ['You’ve thirty nine-year-olds. What takes the most skill?', ['Knowing the material','Holding the room without raising your voice','Grading fast','Making lessons fun'], 1,\n     'Classroom management. The content is fourth grade. Keeping thirty kids working while two of them are having the worst day of their week is the job, and it’s the thing new teachers say nobody prepared them for.'],\n    ['How much of the work happens after the kids leave?', ['Almost none','About an hour','Two hours or more, most days','All of it'], 2,\n     'Two hours or more. Planning, grading, parent emails, and the paperwork the district needs. The teaching day ends at three and the work does not, which is the part that surprises people about the salary.'],\n    ['A kid is acting out for the fourth day running. What’s the move?', ['Send them out','Call home the same day','Find out what changed four days ago','Ignore it and teach'], 2,\n     'You look for the change. A kid whose behaviour shifts suddenly is telling you something, and teachers who ask that question first solve more of these than teachers who escalate.'],\n    ['Ten years in. Where does a teacher end up?', ['Same grade, same room, forever','Grade lead, instructional coach, administration, or a specialist qualification','Out of teaching, always','Back for a doctorate, required'], 1,\n     'Grade lead, then coaching, then administration if you want it, and specialist qualifications in special education or reading pay more. The people who stay twenty years mostly changed roles at least twice.'],\n  ],\n  plumber: [\n    ['A pipe is leaking behind a finished wall. What’s the actual skill?', ['Cutting the wall open','Working out where the leak is before you cut','Replacing the whole line','Turning the water off'], 1,\n     'Finding it before you cut. Anybody can open a wall. The plumber who opens the right twelve inches is the one who gets called back, and the one who doesn’t is the one the customer tells their neighbours about.'],\n    ['Where are you working most days?', ['A workshop','Other people’s homes and businesses','New construction sites only','Underground'], 1,\n     'In occupied buildings, constantly. You’re in somebody’s kitchen while they watch, which means being easy to have around is a paid skill, not a bonus.'],\n    ['You’re called out at 11pm for a burst pipe. How often does that happen?', ['Never, plumbing is nine to five','A few times a year, and it pays double','Every week','Only if you work for yourself'], 1,\n     'Emergency call-outs are part of the trade and they pay a premium. Most plumbers work regular days with a rotation for after-hours, and the overtime is a real part of the income.'],\n    ['Ten years in. Where does a plumber end up?', ['Same van, same calls, forever','Journeyman, then estimator, inspector, or your own shop','You need a degree to advance','The trade is shrinking'], 1,\n     'Licence, then your own truck if you want it. Plumbers who start a shop are running a business, which is a different job with different risks, and the ones who like the work more than the paperwork stay on the tools.'],\n  ],\n  machinist: [\n    ['What does a machinist actually spend the most time on?', ['Cutting metal','Setting up and measuring','Reading drawings','Cleaning the shop'], 1,\n     'Setup and measurement. The machine does the cutting. Your ninety-minute setup and your first-part inspection decide whether four hours of run time produces parts or scrap.'],\n    ['How precise is the work?', ['To the millimetre','To about a hair’s width','To a tenth of a hair’s width','Close enough is fine'], 2,\n     'Aerospace tolerances run a couple of thousandths of an inch, which is finer than a human hair. That’s why measurement is a skill of its own and why the good machinists own their own instruments.'],\n    ['You’re alone with a machine most of the shift. Who else is around?', ['Nobody, ever','A small shop floor, but you work your own machine','A big team on every part','Customers'], 1,\n     'A shop floor of people each running their own machines. You talk at breaks and when something goes wrong. If you wanted a team sport this isn’t it, and for a lot of machinists that’s the appeal.'],\n    ['Ten years in. Where does a machinist end up?', ['Replaced by automation','Programmer, setup lead, quality, or your own shop','Same machine, same part','Back to school, required'], 1,\n     'Programming and setup, which is where automation pushed the value. The machinists who only loaded parts are the ones the machines replaced. The ones who write the programs got scarcer and better paid.'],\n  ],\n  elevator: [\n    ['What’s most of an elevator mechanic’s work?', ['Installing new elevators','Maintenance and troubleshooting on existing ones','Inspecting only','Fixing doors'], 1,\n     'Service and modernisation. New installs are a small share. Most of the job is an intermittent fault in a building that can’t afford the elevator to be down, and you’re the only one there.'],\n    ['What kind of work is it, mechanically?', ['Pure mechanical','Mechanical, electrical and control systems together','Mostly electrical','Mostly software'], 1,\n     'All three at once, which is why the apprenticeship is four years and why the trade pays what it does. You’re reading a control fault, then a mechanical one, then wiring, on the same call.'],\n    ['How hard is it to get into the apprenticeship?', ['They hire anyone','You need a degree first','Very competitive, and most people apply more than once','You buy a licence'], 2,\n     'It’s one of the hardest to get into apprenticeships in the trades. Applications open in windows, hundreds apply for a few spots, and applying twice is normal. That waiting is the real barrier, not the work.'],\n    ['Ten years in. Where does this go?', ['Nowhere, it’s one job','Mechanic, then adjuster, inspector, or supervisor','Out of work, buildings are shrinking','Back to school'], 1,\n     'Helper to mechanic, then adjuster, which is the specialist who tunes the ride and is the best-paid seat on the tools. After that inspection or supervision. Every step is inside the union structure and the pay is published.'],\n  ],\n  cyber: [\n    ['What does a security analyst do most of the day?', ['Break into systems','Investigate alerts, most of which are nothing','Write security software','Train employees'], 1,\n     'Work an alert queue. Most alerts are noise, and the skill is deciding fast which one is not. The dramatic version of this job is a small specialist corner of it called penetration testing.'],\n    ['Who do you work with?', ['Nobody, security is solitary','A small team, plus every other department when something breaks','Only executives','Customers'], 1,\n     'A small security team, and then suddenly everybody. When an incident is real you’re coordinating with IT, legal and leadership, and explaining it to people who don’t speak your language.'],\n    ['Something breaks at 2am. Are you awake?', ['No, security is business hours','Yes, if you’re on call, and you will be','Only during a breach','Never'], 1,\n     'On-call rotations are standard, and incidents don’t respect your evening. Analysts talk openly about burnout for this reason, and the good employers here are the ones who staff it properly.'],\n    ['Ten years in. Where does this go?', ['Nowhere without a degree','Senior analyst, incident response, threat hunting, or security architect','Out of the field, AI is replacing it','Back to school for a masters'], 1,\n     'Senior analyst, then incident response or threat hunting, then architecture or leading a team. AI made attacks cheaper and more frequent, which increased demand for the people who investigate them rather than reducing it.'],\n  ],\n  datacenter: [\n    ['What does a data center technician actually do?', ['Write the AI software','Keep the physical hardware, power and cooling running','Answer customer support tickets','Design the buildings'], 1,\n     'You keep the room alive. Failed drives, new servers racked and cabled, network faults traced, cooling and power watched. Every AI product you have used depends on somebody doing exactly this, on a shift, tonight.'],\n    ['What are the conditions like?', ['A quiet office','Loud, cold in the working aisles, on your feet all shift','Outdoors','Comfortable and seated'], 1,\n     'Loud enough for ear protection in places, and cold where you work because the air is chilled for the machines, not for you. You walk the floor and you stand for most of the shift.'],\n    ['When do you work?', ['Weekdays, nine to five','Shifts, including nights and weekends','On call only','Whenever you like'], 1,\n     'The rooms never stop, so somebody is always there, and for your first few years that’s you. Night differentials pay more, and the schedule is what decides whether people stay in this job.'],\n    ['Ten years in. Where does this go?', ['Same racks forever','Network, systems or facilities engineering, or site lead','Nowhere, it’s a dead end','You need a degree to move'], 1,\n     'This is a way in, not a destination. Technicians move into network engineering, systems, or facilities, and the pay steps up hard at that transition. The AI buildout means operators are promoting from inside because they can’t hire fast enough.'],\n  ],\n  radtech: [\n    ['You take a chest x-ray. Who decides what it shows?', ['You do','The radiologist, from your images','A machine reads it','The patient\\u2019s own doctor, in the room'], 1,\n     'The radiologist writes the diagnosis, but you decide whether the image is good enough to diagnose from. A bad angle means the patient gets dosed again, so the quality call is yours.'],\n    ['A patient can’t hold still and can’t follow instructions. What do you do?', ['Scan anyway and hope','Position and support them physically, then time the exposure','Refuse the scan','Sedate them'], 1,\n     'You physically support and pad them, sometimes with help, and time the shot. Positioning people who can’t position themselves is most of the physical work of this job.'],\n    ['How much of the day is lifting and moving people?', ['Almost none','A little','A lot of it','All of it'], 2,\n     'A lot. You transfer patients from gurneys and wheelchairs all shift. Back injuries are the reason techs learn proper transfers on day one.'],\n    ['You can specialise later. Which pays the most here?', ['General x-ray','CT','MRI','Interventional radiology'], 3,\n     'Interventional, where you work alongside surgeons during live procedures. Each specialty is a separate certification you add after you’re already working and getting paid.'],\n  ],\n  nurse: [\n    ['How many patients does a med-surg nurse have at once here?', ['One','Two','Four to six','Ten or more'], 2,\n     'Four to six on a day shift, more at night. California is one of the few states that caps it by law, which is why nurses here fight over that ratio.'],\n    ['Which takes more of a shift than people expect?', ['Talking to doctors','Charting','Giving injections','Teaching students'], 1,\n     'Charting. Every assessment, medication and conversation gets written down, and nurses routinely stay late to finish it. It’s the most common complaint about the job.'],\n    ['A patient\\u2019s vitals shift slightly and nothing is obviously wrong. What’s your move?', ['Wait for the next round','Escalate to the doctor now','Recheck and document, then escalate with a pattern','Ask the family'], 2,\n     'You recheck, document, and bring a pattern rather than a single number. Being the person who notices early, and can prove it, is what makes a nurse respected on a floor.'],\n    ['Where does a new nurse usually start?', ['Intensive care','Emergency','A med-surg floor','The operating room'], 2,\n     'Med-surg, which is the general floor. It’s the widest exposure and the hardest first year, and most specialties want that year before they take you.'],\n  ],\n  electrician: [\n    ['You open a panel and the wiring doesn’t match the plans. What now?', ['Follow the plans','Trace the actual circuits before touching anything','Rewire it to match','Call the office'], 1,\n     'You trace what is really there. Old buildings are full of work nobody written down, and assuming the drawing is right is how people get hurt.'],\n    ['What decides whether your work passes?', ['Whether it works','The code and the inspector','The customer','Your foreman'], 1,\n     'Code, judged by an inspector. Plenty of wiring works fine and still fails inspection, and you tear it out. Learning code is as much of the job as the hands-on part.'],\n    ['Which pays an apprentice most reliably in the first year?', ['Residential','Commercial and industrial','Solar','Self-employed side work'], 1,\n     'Commercial and industrial, usually through the union apprenticeship. Residential pays less and teaches faster; side work as an unlicensed apprentice is illegal here.'],\n    ['What ends most electricians\\u2019 time on the tools?', ['Boredom','The pay','Knees, shoulders and back','Automation'], 2,\n     'The body. Most move into estimating, inspection or running crews by their forties, which pays more and is why the trade has a path off the tools.'],\n  ],\n  firefighter: [\n    ['What share of calls are actual fires?', ['Most of them','About half','Under a fifth','Almost none'], 2,\n     'Under a fifth in most departments. The majority are medical calls, which is why every hire needs an EMT certificate before the fire training matters.'],\n    ['You work twenty-four on, forty-eight off. What’s the hidden cost?', ['Boredom','Sleep, permanently','Too much overtime','Losing touch with the crew'], 1,\n     'Sleep. You’re woken at 2am for calls and you never fully catch up. Departments now track it as a health risk because of what long-term sleep debt does.'],\n    ['What’s the hardest part of the hiring process?', ['The written test','The physical test','The interview and the wait','The academy'], 2,\n     'The interview and the cycle. Testing happens in windows, hundreds apply for a handful of spots, and most firefighters applied more than once before they got in.'],\n    ['What do you do on a normal shift with no calls?', ['Wait','Drill, maintain equipment, inspect buildings, cook','Paperwork','Go home early'], 1,\n     'You train and maintain. Hose testing, ladder drills, building inspections, and cooking for the crew. The downtime is structured, not free.'],\n  ],\n  hvac: [\n    ['A system isn’t cooling. What’s the actual skill?', ['Replacing the unit','Diagnosing why, in order','Adding refrigerant','Cleaning the filters'], 1,\n     'Diagnosis, in a disciplined order. Anyone can swap a part. Getting paid well comes from finding the real fault fast instead of replacing things until it works.'],\n    ['When do you make the most money?', ['Spring and fall','The first heat wave and the first freeze','Steadily all year','During new construction'], 1,\n     'The extremes. When it hits 100 degrees or drops below freezing, everyone calls at once and overtime is unlimited. The shoulder seasons are slow and that’s the trade.'],\n    ['Where is the equipment usually located?', ['At eye level in a clean room','Attics, roofs and crawl spaces','Basements','Outside only'], 1,\n     'The worst spaces in the building. An attic in August can pass 140 degrees, which is a genuine safety limit, not a complaint.'],\n    ['Adding refrigerant to a leaking system is:', ['Standard practice','A temporary fix that’s often illegal to leave','Always the right call','Free'], 1,\n     'A quick fix, and venting refrigerant is federally regulated. You need EPA certification to buy and handle it, which is part of why the certificate matters.'],\n  ],\n  dentalhyg: [\n    ['Who usually spots gum disease first?', ['The dentist','You','The patient','An x-ray machine'], 1,\n     'You. You’re measuring pockets and reading tissue every appointment, and you’re the one who flags it. The dentist confirms and treats.'],\n    ['A patient hasn’t flossed and lies about it. What’s the job?', ['Confront them','Tell the dentist','Show them what you see and give them one thing to change','Say nothing'], 2,\n     'One change they will actually make. Lecturing loses patients. Hygienists who keep a schedule full are the ones people aren’t embarrassed to come back to.'],\n    ['What limits this career?', ['Pay','Boredom','Wrists, neck and shoulders','Licensing'], 2,\n     'Repetitive strain. Hygienists plan around it with loupes, better chairs and part-time schedules, and it’s the most common reason for leaving early.'],\n    ['How many hours a week is a typical hygienist job here?', ['Under 20','24 to 32','40','Over 45'], 1,\n     'Twenty-four to thirty-two, because many offices staff hygiene part-time. Building a full week often means two offices, which is a real scheduling cost.'],\n  ],\n  paramedic: [\n    ['On scene, who decides the treatment?', ['The hospital by radio','You','The fire captain','The family'], 1,\n     'You do, inside your protocols. That kind of say with that little supervision is the good part, and it’s also why the job wears people down.'],\n    ['What do you spend most of a shift doing?', ['Driving fast','Waiting, then working intensely','Paperwork','Training'], 1,\n     'Waiting, then everything at once. The transitions are the hard part, not the calls.'],\n    ['How does paramedic pay compare to nursing here?', ['Higher','About the same','Well below','It depends on the county'], 2,\n     'Well below, for comparable stress and more physical risk. That gap is the real reason many paramedics move to nursing or fire within five years.'],\n    ['What’s the fastest first step from high school?', ['Paramedic school directly','An EMT certificate','A bachelor degree','Fire academy'], 1,\n     'EMT first, about six months, and you can work while you save for paramedic school. Nobody starts as a paramedic.'],\n  ],\n  welderfab: [\n    ['You inspect a weld and it fails. What happens next?', ['You fix it','You document it and it gets cut out and redone','You pass it with a note','The welder decides'], 1,\n     'It gets cut out. Your report costs somebody a day of work, which is why the job needs someone who won’t be talked out of a finding.'],\n    ['What tools tell you what is inside a weld?', ['Your eyes','Ultrasound and x-ray','A magnet','A hammer'], 1,\n     'Ultrasonic and radiographic testing. Reading those results is the certification, and it’s what separates an inspector from a welder.'],\n    ['Can you start as an inspector out of high school?', ['Yes','No, you weld first','Only with a degree','Only in construction'], 1,\n     'You weld first. To get certified you need logged years on the tools, so this is a second career step, usually in your late twenties.'],\n    ['What makes an inspector unpopular?', ['Slowness','Saying no to experienced people','The pay','Paperwork'], 1,\n     'Telling a welder with twenty years that their work failed. Doing that fairly, with evidence, is the whole skill.'],\n  ],\n  itsupport: [\n    ['What’s most of the job?', ['Fixing computers','Talking to people who are stuck','Writing code','Managing servers'], 1,\n     'People. The technical fixes are usually simple; doing it without making someone feel stupid is what gets you promoted.'],\n    ['A user says \"it’s broken\" and nothing else. First move?', ['Restart it','Ask what they were doing when it stopped working','Reimage the machine','Escalate'], 1,\n     'Get the story. What changed, and when. Most tickets are solved by the question, not the tool.'],\n    ['Which certificate opens the first door?', ['A four-year degree','CompTIA A+','A coding bootcamp','None, nobody checks'], 1,\n     'A+ is the standard entry qualification and takes a few months. It’s not impressive later, and it’s what gets a first interview.'],\n    ['Where do most people go from here?', ['Nowhere, it’s a career','Networking or security','Management immediately','Software engineering'], 1,\n     'Networking or security, both of which roughly double the pay. Support is the way in, and staying in it for years is the mistake people regret.'],\n  ],\n  dispatcher: [\n    ['A caller is screaming and gives no address. What comes first?', ['Calm them down','The address','What happened','Who they are'], 1,\n     'The address, always. Help can’t move without it. Everything else can be gathered while units are already driving.'],\n    ['What do you do while someone is dying on the phone?', ['Wait for the ambulance','Give CPR instructions and count out loud','Transfer the call','Stay quiet'], 1,\n     'You coach CPR, counting compressions out loud, sometimes for ten minutes. Dispatchers save lives with their voice before anyone arrives.'],\n    ['What do dispatchers say is the hardest part?', ['The hours','Never learning how the call ended','The pay','The technology'], 1,\n     'Not knowing. You hand the call off and it disappears. That unfinished feeling, hundreds of times, is what people describe as the weight.'],\n    ['What education do you need?', ['A degree','A certificate','High school, then a paid academy','An EMT license'], 2,\n     'High school and a paid academy the agency runs. It’s one of the few jobs on this list you can start the autumn after you graduate.'],\n  ],\n  truckdriver: [\n    ['You’re paid by the mile. What does traffic cost you?', ['Nothing','Time only','Money','Overtime pay'], 2,\n     'Money. Sitting still pays nothing on most contracts, which is why drivers care about routes and dispatchers more than anything else.'],\n    ['How long can you legally drive in a day?', ['Eight hours','Eleven hours','Fourteen hours','As long as you’re awake'], 1,\n     'Eleven driving hours inside a fourteen-hour window, logged electronically. The rules are enforced by the device, not by trust.'],\n    ['Which route type gets you home nightly?', ['Long-haul','Regional','Local','Team driving'], 2,\n     'Local. It pays less than long-haul and it’s the difference between seeing your family and not, which is the trade most drivers eventually make.'],\n    ['Who pays for the CDL?', ['You, always','Many carriers, if you commit to a contract','The state','Nobody, it’s free'], 1,\n     'Carriers often pay if you sign on for a year or two. That contract is real, and leaving early means owing the money back.'],\n  ],\n  chef: [\n    ['What gets you hired in a kitchen?', ['Creativity','Speed and consistency','A culinary degree','Knife tricks'], 1,\n     'Doing the same plate identically, fast, for five hours. Creativity comes years later, if at all, and only after you can hold a station.'],\n    ['When do you work?', ['Nine to five','Nights, weekends and holidays','Mornings only','Flexible hours'], 1,\n     'When everyone else is off. Christmas, Friday nights, Mother\\u2019s Day. That never really changes, and it’s the main reason people leave.'],\n    ['A dish comes back from a table. What’s the response?', ['Argue','Remake it immediately, no discussion','Blame the server','Ask the guest'], 1,\n     'Remake it and move. Service doesn’t stop, and how you handle being wrong at 7:30pm decides whether you get trusted with a station.'],\n    ['Which route into a kitchen costs least and teaches fastest?', ['Culinary school','Starting as a prep cook','A hospitality degree','Online courses'], 1,\n     'Starting in the kitchen. Culinary school costs real money and kitchens still make you prove it on the line, so many chefs skip it.'],\n  ],\n};\n\n// Build the thirteen beats from a career's own data plus its authored specifics.\nconst EDU_COST = { 'High school':'nothing', 'Certificate':'about $4,800', 'Apprenticeship':'nothing, you’re paid to train',\n  'Associate':'about $3,100', 'Bachelor':'about $34,000', 'Doctorate':'well over $100,000' };\nconst EDU_TIME = { 'High school':'no school after high school', 'Certificate':'about a year',\n  'Apprenticeship':'four years, paid', 'Associate':'two years', 'Bachelor':'four years', 'Doctorate':'eight years or more' };\n\nconst EDU_RANK = { 'High school':0, 'Certificate':1, 'Apprenticeship':2, 'Associate':2, 'Bachelor':3, 'Doctorate':4 };\n\n// Every level 1 introship is assembled on the same spine: the same thirteen\n// questions in the same formats, filled with that career's own authored content\n// and its own wage, education and outlook data.\nfunction buildBeats(career, lib, mcs, sl) {\n  if (!sl) return null;\n  const A = (mcs || []).map(([q, options, answer, real]) => ({ q, options, answer, real }));\n  const at = (slot) => A[sl.slots[slot]] || A[0];\n  const pay = career.payHereNum * 1000;\n  const start = Math.round(pay * 0.72 / 1000) * 1000;\n  const monthly = Math.round(start * 0.72 / 12 / 100) * 100;\n  const left = monthly - 2850 - 1650;\n  const growing = parseInt(String(career.outlook).replace(/[^-0-9]/g, ''), 10) || 0;\n  // The head to head compares against a real catalog career with more school.\n  const mine = EDU_RANK[career.eduLevel] ?? 2;\n  const rival = [...CAREERS, ...CAREERS_MORE]\n    .filter(c => c.id !== career.id && (EDU_RANK[c.eduLevel] ?? 2) !== mine)\n    .sort((x, y) => Math.abs((EDU_RANK[y.eduLevel] ?? 2) - mine) - Math.abs((EDU_RANK[x.eduLevel] ?? 2) - mine))[0]\n    || [...CAREERS].find(c => c.id !== career.id);\n  const rivalHigher = (EDU_RANK[rival.eduLevel] ?? 2) > mine;\n  return [\n    { n:1, label:'THE REVEAL', kind:'mc', q:at(0).q, options:at(0).options, answer:at(0).answer,\n      real:at(0).real + ' ' + lib.reality,\n      clip:{ caption:'Sixty seconds inside the job', sub:'CONFIRM: clip to be filmed with someone who does this work' } },\n    { n:2, label:'DAY TO DAY', kind:'mr', q:'Myth or real?', statement:sl.myth,\n      options:['Myth','Real'], answer:0, real:sl.mythReal,\n      followUp:sl.mythFeel,\n      deeper:[{ employee:'CONFIRM: someone who does this job', sponsor:'CONFIRM: partner employer' }] },\n    { n:3, label:'WHO AND WHERE', kind:'mc', q:at(1).q, options:at(1).options, answer:at(1).answer,\n      real:at(1).real,\n      clip:{ caption:'A full shift, start to finish', sub:'CONFIRM: clip to be filmed on site' } },\n    { n:4, label:'SKILLS', kind:'pick',\n      q:'Seven things. Pick the three that actually make someone good at this job.',\n      opts:sl.skills, correctSet:sl.skillsSet, real:sl.skillsReal },\n    { n:5, label:'WHAT IT PAYS', kind:'slider',\n      q:'Drag to guess: what does a first-year ' + career.title.toLowerCase() + ' make here?',\n      payReal:start, payLabel:'$' + start.toLocaleString('en-US'), payWhen:'first year, San Mateo County',\n      lowNote:'Most people guess low. The middle wage here is $' + pay.toLocaleString('en-US') + ' once you’re experienced.',\n      highNote:'You aimed high. That’s closer to the experienced number, $' + pay.toLocaleString('en-US') + ', than the starting one.',\n      real:'Starting pay is always lower than the number you find online, and that gap is where people get surprised.',\n      stats:[{ k:'First year here', v:'$' + start.toLocaleString('en-US') },\n        { k:'Experienced here', v:'$' + pay.toLocaleString('en-US') }],\n      source:'U.S. Bureau of Labor Statistics, May 2024, plus California Employment Development Department county data.',\n      followUp:'How do you feel about starting near $' + start.toLocaleString('en-US') + '?' },\n    { n:6, label:'HOW YOU GET IN', kind:'hh',\n      q:'Head to head: which one needs more school before your first real paycheck in the field?',\n      hh:[{ t:career.title, s:lib.reality.split('.')[0] },\n        { t:rival.title, s:rival.cluster }],\n      answer: rivalHigher ? 1 : 0,\n      real:'It’s ' + EDU_TIME[career.eduLevel] + ' for this one, about ' + EDU_COST[career.eduLevel]\n        + ' at a local public program, against ' + EDU_TIME[rival.eduLevel] + ' for ' + rival.title.toLowerCase() + '. ' + lib.way,\n      stats:[{ k:'Time', v:EDU_TIME[career.eduLevel] },{ k:'Cost here', v:EDU_COST[career.eduLevel] }] },\n    { n:7, label:'TIME AND LIFESTYLE', kind:'mc', q:at(2).q, options:at(2).options, answer:at(2).answer,\n      real:at(2).real, followUp:'How do you feel about those hours?' },\n    { n:8, label:'IN YOUR WORDS', kind:'write', wlabel:sl.write, q:sl.writeQ,\n      writePlaceholder:'A few sentences. Whatever comes to mind.', real:sl.writeReal },\n    { n:9, label:'YOUR CALL', kind:'you', q:sl.callQ,\n      opts:sl.call.map(([t, says]) => ({ t, says })), real:s
