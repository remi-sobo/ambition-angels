document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ont-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:9px;\">HOW DEEP YOU CAN GO ON THIS ONE<\u002Fdiv>\n          <div style=\"font-size:15px; color:#3D3D3D; line-height:1.7; margin-bottom:18px; max-width:640px;\">{{ career.depthNote }}<\u002Fdiv>\n          <div style=\"display:flex; gap:9px; flex-wrap:wrap;\">\n            <sc-if value=\"{{ career.hasIntroship }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ goIntroships }}\" style=\"border:none; background:#205FA6; color:#fff; font-size:14px; font-weight:700; padding:12px 20px; border-radius:10px; cursor:pointer;\">Find it in Introships<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ career.hasInternship }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ goInternships }}\" style=\"border:1px solid #205FA6; background:#fff; color:#205FA6; font-size:14px; font-weight:700; padding:12px 20px; border-radius:10px; cursor:pointer;\">Find it in Internships<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasRoutes }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ goPathways }}\" style=\"border:1px solid #CCCCCC; background:#fff; color:#575757; font-size:14px; font-weight:600; padding:12px 20px; border-radius:10px; cursor:pointer;\">See the routes in<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCompass }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Compass\">\n        <div style=\"font-size:24px; font-weight:700; margin-bottom:3px;\">Compass<\u002Fdiv>\n        <div style=\"font-size:14px; color:#757575; margin-bottom:20px; max-width:660px;\">Forty questions about what you actually like doing. Answer them whenever, change any answer any time, and the whole catalog re-sorts. Most people take it again each semester, because the answers move once you have tried a few things.<\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:16px; padding:16px 20px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;\">\n          <div style=\"min-width:0;\">\n            <div style=\"font-size:14px; font-weight:700;\">{{ compassAnsweredLabel }}<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:#757575; margin-top:2px;\">{{ compassStateNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:11px;\">\n            <div style=\"width:150px; height:8px; background:#EDEFF2; border-radius:4px; overflow:hidden;\"><div style=\"height:8px; background:#205FA6; border-radius:4px; width: {{ compassPct }}%;\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:13px; font-weight:700; color:#205FA6;\">{{ compassPct }}%<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px; align-items:center;\">\n          <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.04em; margin-right:4px;\">SHOW<\u002Fdiv>\n          <sc-for list=\"{{ compassViewChips }}\" as=\"v\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ v.onClick }}\" style=\"border:1px solid {{ v.border }}; background:{{ v.bg }}; color:{{ v.color }}; font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:999px; cursor:pointer;\">{{ v.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ hasAnswers }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ resetCompass }}\" style=\"border:1px solid #CCCCCC; background:#fff; color:#575757; font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:999px; cursor:pointer; margin-left:auto;\">Start over<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showItems }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; flex-direction:column; gap:10px; margin-bottom:16px;\">\n            <sc-for list=\"{{ compassItems }}\" as=\"q\" hint-placeholder-count=\"8\">\n              <div>\n                <sc-if value=\"{{ q.first }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:11px; font-weight:700; color:#205FA6; letter-spacing:0.05em; margin:14px 0 10px;\">{{ q.sectionLabel }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"background:#fff; border:1px solid {{ q.border }}; border-radius:14px; padding:16px 18px;\">\n                  <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:13px;\">\n                    <div style=\"display:flex; align-items:baseline; gap:10px; min-width:0;\">\n                      <div style=\"font-size:11.5px; font-weight:700; color:#9AA0A6; flex-shrink:0;\">{{ q.num }}<\u002Fdiv>\n                      <div style=\"font-size:15px; font-weight:600; line-height:1.45;\">{{ q.text }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ q.changed }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:10.5px; font-weight:700; color:#1A4F87; background:#EAF2FB; padding:4px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0;\">{{ q.changeLabel }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; gap:6px; flex-wrap:wrap;\">\n                    <sc-for list=\"{{ q.options }}\" as=\"o\" hint-placeholder-count=\"5\">\n                      <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"flex:1 1 92px; border:1px solid {{ o.border }}; background:{{ o.bg }}; color:{{ o.color }}; font-size:12.5px; font-weight:600; padding:11px 8px; border-radius:10px; cursor:pointer; line-height:1.3;\">{{ o.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ q.hasPrior }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:12px; color:#9AA0A6; margin-top:11px;\">Last semester you said {{ q.priorLabel }}.<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showChanges }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:22px 26px; margin-bottom:14px;\">\n            <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:9px;\">WHAT MOVED SINCE LAST SEMESTER<\u002Fdiv>\n            <sc-if value=\"{{ noChanges }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size:14.5px; color:#575757; line-height:1.7; max-width:620px;\">Nothing yet. Change an answer above and it shows up here, with what it did to your list. Taking this again after an internship is when things usually move.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex; flex-direction:column; gap:12px;\">\n              <sc-for list=\"{{ changeList }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div style=\"border-left:3px solid #205FA6; padding-left:14px;\">\n                  <div style=\"font-size:14px; font-weight:600; line-height:1.5; margin-bottom:4px;\">{{ c.text }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px; color:#757575;\">{{ c.move }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showCos }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#0F2E52; border-radius:18px; padding:26px 28px; margin-bottom:14px; color:#fff;\">\n            <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;\">\n              <div style=\"min-width:0;\">\n                <div style=\"font-size:11px; font-weight:700; color:#8FB4DC; letter-spacing:0.06em; margin-bottom:10px;\">CAREER ORIENTATION SCORE<\u002Fdiv>\n                <div style=\"display:flex; align-items:baseline; gap:12px;\">\n                  <div style=\"font-size:60px; font-weight:800; line-height:1;\">{{ cos.score }}<\u002Fdiv>\n                  <div style=\"font-size:16px; color:#8FB4DC; font-weight:600;\">out of 100<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:14.5px; color:#C9DDF4; line-height:1.6; margin-top:12px; max-width:520px;\">{{ cos.readout }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex-shrink:0; text-align:right;\">\n                <div style=\"font-size:11px; font-weight:700; color:#8FB4DC; letter-spacing:0.05em; margin-bottom:6px;\">SINCE SEPTEMBER<\u002Fdiv>\n                <div style=\"font-size:30px; font-weight:800; color:#7FD4A8;\">{{ cos.delta }}<\u002Fdiv>\n                <div style=\"font-size:12.5px; color:#8FB4DC; margin-top:4px;\">was {{ cos.prior }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; margin-bottom:14px;\">\n            <sc-for list=\"{{ cos.bands }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:16px; padding:18px 19px;\">\n                <div style=\"font-size:10px; font-weight:700; color:#9AA0A6; letter-spacing:0.06em; margin-bottom:8px;\">{{ b.role }}<\u002Fdiv>\n                <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:9px;\">\n                  <div style=\"font-size:15.5px; font-weight:700;\">{{ b.label }}<\u002Fdiv>\n                  <div style=\"font-size:22px; font-weight:800; color:#205FA6;\">{{ b.value }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"height:7px; background:#EDEFF2; border-radius:4px; overflow:hidden; margin-bottom:4px;\">\n                  <div style=\"height:7px; background:#205FA6; border-radius:4px; width:{{ b.value }}%;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"height:7px; background:#F5F7FA; border-radius:4px; overflow:hidden; margin-bottom:10px;\">\n                  <div style=\"height:7px; background:#C4C4C4; border-radius:4px; width:{{ b.prior }}%;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px; color:{{ b.moveColor }}; font-weight:700; margin-bottom:7px;\">{{ b.move }}<\u002Fdiv>\n                <div style=\"font-size:13px; color:#575757; line-height:1.55;\">{{ b.blurb }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:22px 26px; margin-bottom:14px;\">\n            <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:10px;\">WHAT MOVED IT<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:12px;\">\n              <sc-for list=\"{{ cos.drivers }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <div style=\"border-left:3px solid #205FA6; padding-left:14px;\">\n                  <div style=\"font-size:14.5px; font-weight:600; line-height:1.5; margin-bottom:3px;\">{{ d.what }}<\u002Fdiv>\n                  <div style=\"font-size:13px; color:#757575; line-height:1.55;\">{{ d.why }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:13px; color:#757575; line-height:1.65; margin-top:16px; padding-top:14px; border-top:1px solid #F0F0F0;\">Exposure is the only one of these an app can hand you. Direction, belief and action are what exposure is supposed to produce, and they’re the reason we measure all four.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:12px;\">\n            <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em;\">THE TWENTY ITEMS<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:#757575;\">{{ cos.answeredLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <sc-for list=\"{{ cos.items }}\" as=\"q\" hint-placeholder-count=\"8\">\n              <div>\n                <sc-if value=\"{{ q.first }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:11px; font-weight:700; color:#205FA6; letter-spacing:0.05em; margin:14px 0 10px;\">{{ q.bandLabel }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"background:#fff; border:1px solid {{ q.border }}; border-radius:14px; padding:16px 18px;\">\n                  <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:13px;\">\n                    <div style=\"display:flex; align-items:baseline; gap:10px; min-width:0;\">\n                      <div style=\"font-size:11.5px; font-weight:700; color:#9AA0A6; flex-shrink:0;\">{{ q.n }}<\u002Fdiv>\n                      <div style=\"font-size:15px; font-weight:600; line-height:1.45;\">{{ q.text }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ q.flipped }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:10px; font-weight:700; color:#8A6D3B; background:#FFF4E5; padding:4px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0;\">SCORED IN REVERSE<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; gap:6px; flex-wrap:wrap;\">\n                    <sc-for list=\"{{ q.options }}\" as=\"o\" hint-placeholder-count=\"5\">\n                      <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"flex:1 1 96px; border:1px solid {{ o.border }}; background:{{ o.bg }}; color:{{ o.color }}; font-size:12.5px; font-weight:600; padding:11px 8px; border-radius:10px; cursor:pointer; line-height:1.3;\">{{ o.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px; color:#9AA0A6; margin-top:11px;\">{{ q.priorLine }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; color:#9AA0A6; line-height:1.6; margin-top:16px;\">Change any answer and the score moves. Most people take this in September and again in the spring, because the point is the gap between the two, not the number on its own.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showResults }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:24px 26px;\">\n            <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:12px;\">WHAT YOUR ANSWERS SAY<\u002Fdiv>\n            <div style=\"font-size:20px; font-weight:700; margin-bottom:8px;\">Every career, sorted by what you said<\u002Fdiv>\n            <div style=\"font-size:14px; color:#575757; line-height:1.65; margin-bottom:20px; max-width:660px;\">This isn’t a recommendation. It’s your answers applied to every job in the catalog. Open any card to see the exact answers behind its band, and change any answer to watch it move.<\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:22px;\">\n              <sc-for list=\"{{ compassBands }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <div style=\"background:{{ b.bg }}; border:1px solid {{ b.border }}; border-radius:14px; padding:16px 18px;\">\n                  <div style=\"font-size:26px; font-weight:700; color:{{ b.text }};\">{{ b.count }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px; font-weight:600; color:{{ b.text }}; margin-top:3px;\">{{ b.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:12px;\">WHAT IS DOING THE MOST WORK<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:11px; margin-bottom:22px;\">\n              <sc-for list=\"{{ compassDrivers }}\" as=\"d\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; gap:12px; align-items:center;\">\n                  <div style=\"width:64px; flex-shrink:0; font-size:12.5px; font-weight:700; color:{{ d.color }}; text-align:right;\">{{ d.strength }}<\u002Fdiv>\n                  <div style=\"flex:1; min-width:0; font-size:13.5px; color:#3D3D3D; line-height:1.55;\">{{ d.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid #F0F0F0; padding-top:20px;\">\n              <div style=\"font-size:15.5px; font-weight:700; margin-bottom:5px;\">All of this lives in your Passport<\u002Fdiv>\n              <div style=\"font-size:13.5px; color:#575757; line-height:1.6; max-width:620px; margin-bottom:16px;\">Your score, what your answers say about you, and what you have actually done are on one page there. That is the page you keep.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ goPassport }}\" style=\"border:none; background:#205FA6; color:#fff; font-size:14px; font-weight:700; padding:12px 20px; border-radius:10px; cursor:pointer;\">Open my Passport<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPathways }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Pathways\">\n        <button sc-camel-on-click=\"{{ backToCareer }}\" style=\"border:none; background:none; color:#205FA6; font-size:13.5px; font-weight:700; cursor:pointer; padding:0; margin-bottom:16px;\">← {{ career.title }}<\u002Fbutton>\n        <div style=\"font-size:24px; font-weight:700; margin-bottom:3px;\">Routes to {{ career.title }}<\u002Fdiv>\n        <sc-if value=\"{{ hasRoutes }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:14px; color:#757575; margin-bottom:20px; max-width:640px;\">Real ways in. None of them is the default. Cost is what you would actually pay here after aid, and the wage shown is the first job on that route, not the destination.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noRoutes }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:26px 28px;\">\n            <div style=\"font-size:18px; font-weight:700; margin-bottom:8px;\">No routes written for this one yet<\u002Fdiv>\n            <div style=\"font-size:14.5px; color:#575757; line-height:1.7; max-width:600px;\">Routes only go up here once we have confirmed the cost, the time, and the first wage with a named local provider. Nothing generic, nothing guessed.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px;\">\n          <sc-for list=\"{{ pathwayRoutes }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:22px 24px; display:flex; flex-direction:column; gap:14px;\">\n  }}<\u002Fdiv>\n                    <div style=\"font-size:13px; color:#757575; line-height:1.55; margin-top:4px;\">{{ c.cost }}<\u002Fdiv>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ unit.isWrite }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-bottom:18px;\">\n                <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:9px;\">{{ unit.wlabel }}<\u002Fdiv>\n                <textarea value=\"{{ lvl.writeText }}\" sc-camel-on-input=\"{{ lvl.setWrite }}\" placeholder=\"{{ unit.placeholder }}\" style=\"width:100%; min-height:130px; border:1px solid #CCCCCC; border-radius:12px; padding:14px; font-size:14.5px; line-height:1.65; resize:vertical; font-family:inherit;\"><\u002Ftextarea>\n                <div style=\"font-size:12.5px; color:#9AA0A6; margin-top:8px;\">This one goes in your Passport as something you made, not something you answered.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ unit.isVerdict }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; flex-direction:column; gap:9px; margin-bottom:18px;\">\n                <sc-for list=\"{{ unit.verdicts }}\" as=\"v\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ v.onClick }}\" style=\"text-align:left; border:1px solid {{ v.border }}; background:{{ v.bg }}; padding:16px 18px; border-radius:12px; cursor:pointer;\">\n                    <div style=\"font-size:15px; font-weight:700; color:#1A1A1A;\">{{ v.label }}<\u002Fdiv>\n                    <div style=\"font-size:13px; color:#757575; line-height:1.5; margin-top:3px;\">{{ v.note }}<\u002Fdiv>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ lvl.showReveal }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#EAF2FB; border:1px solid #D6E5F7; border-radius:14px; padding:20px 22px; margin-bottom:18px;\">\n                <div style=\"font-size:11px; font-weight:700; color:#5A87BC; letter-spacing:0.05em; margin-bottom:11px;\">{{ lvl.revealLabel }}<\u002Fdiv>\n                <sc-if value=\"{{ lvl.hasScore }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:16px; font-weight:700; color:#1A4F87; line-height:1.5; margin-bottom:10px;\">{{ lvl.scoreLine }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"font-size:14px; color:#3D3D3D; line-height:1.7;\">{{ unit.real }}<\u002Fdiv>\n                <sc-if value=\"{{ lvl.hasConsequence }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background:#fff; border:1px solid #D6E5F7; border-radius:12px; padding:14px 16px; margin-top:14px;\">\n                    <div style=\"font-size:10.5px; font-weight:700; color:#5A87BC; letter-spacing:0.05em; margin-bottom:6px;\">THIS COMES BACK LATER<\u002Fdiv>\n                    <div style=\"font-size:14px; color:#3D3D3D; line-height:1.65;\">{{ lvl.consequence }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex; gap:9px; flex-wrap:wrap; align-items:center;\">\n              <sc-if value=\"{{ lvl.canCheck }}\" hint-placeholder-val=\"{{ true }}\">\n                <button sc-camel-on-click=\"{{ lvl.check }}\" style=\"border:none; background:#205FA6; color:#fff; font-size:14.5px; font-weight:700; padding:13px 22px; border-radius:11px; cursor:pointer;\">{{ lvl.checkLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ lvl.canNext }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ lvl.next }}\" style=\"border:none; background:#205FA6; color:#fff; font-size:14.5px; font-weight:700; padding:13px 22px; border-radius:11px; cursor:pointer;\">{{ lvl.nextLabel }}<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ lvl.onBack }}\" style=\"border:1px solid #CCCCCC; background:#fff; color:#575757; font-size:14px; font-weight:600; padding:13px 20px; border-radius:11px; cursor:pointer;\">Save and stop<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ lvl.canReset }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ lvl.reset }}\" style=\"border:none; background:none; color:#205FA6; font-size:13px; font-weight:700; cursor:pointer; padding:13px 4px;\">Start this one over<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ lvl.done }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:14px;\">{{ lvl.doneEyebrow }}<\u002Fdiv>\n            <div style=\"font-size:22px; font-weight:700; line-height:1.3; margin-bottom:8px;\">{{ lvl.doneTitle }}<\u002Fdiv>\n            <div style=\"font-size:15px; color:#575757; line-height:1.7; margin-bottom:20px; max-width:640px;\">{{ lvl.doneBody }}<\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:11px; margin-bottom:18px;\">\n              <sc-for list=\"{{ lvl.doneStats }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <div style=\"background:#F5F7FA; border-radius:14px; padding:16px 18px;\">\n                  <div style=\"font-size:22px; font-weight:700; color:#205FA6; line-height:1;\">{{ d.v }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px; color:#575757; margin-top:5px; line-height:1.45;\">{{ d.k }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ lvl.hasArtifact }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff; border:1px solid #D6E5F7; border-radius:14px; padding:19px 21px; margin-bottom:18px;\">\n                <div style=\"font-size:10.5px; font-weight:700; color:#5A87BC; letter-spacing:0.05em; margin-bottom:9px;\">WHAT YOU MADE<\u002Fdiv>\n                <div style=\"font-size:15px; font-weight:600; line-height:1.65; margin-bottom:12px;\">{{ lvl.artifact }}<\u002Fdiv>\n                <div style=\"font-size:13px; color:#757575; line-height:1.6;\">This is in your Passport. It’s the thing you read back before an interview, not a score.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex; gap:9px; flex-wrap:wrap;\">\n              <sc-if value=\"{{ lvl.hasNextLevel }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ lvl.goNextLevel }}\" style=\"border:none; background:#205FA6; color:#fff; font-size:14px; font-weight:700; padding:12px 20px; border-radius:10px; cursor:pointer;\">{{ lvl.nextLevelLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ lvl.reset }}\" style=\"border:1px solid #CCCCCC; background:#fff; color:#575757; font-size:14px; font-weight:600; padding:12px 20px; border-radius:10px; cursor:pointer;\">Run it again<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ goPassport }}\" style=\"border:1px solid #205FA6; background:#fff; color:#205FA6; font-size:14px; font-weight:700; padding:12px 20px; border-radius:10px; cursor:pointer;\">See it in your Passport<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; color:#9AA0A6; line-height:1.6;\">{{ lvl.footer }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isInternDay }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Internship day\">\n        <button sc-camel-on-click=\"{{ goInternships }}\" style=\"border:none; background:none; color:#205FA6; font-size:13.5px; font-weight:700; cursor:pointer; padding:0; margin-bottom:16px;\">← All internships<\u002Fbutton>\n        <sc-if value=\"{{ hasDayContent }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:22px 26px; margin-bottom:14px;\">\n          <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;\">\n            <div style=\"min-width:0;\">\n              <div style=\"font-size:10.5px; font-weight:700; color:#205FA6; letter-spacing:0.06em; margin-bottom:6px;\">DAY 12 OF 30 · SONOGRAPHY<\u002Fdiv>\n              <div style=\"font-size:22px; font-weight:700; line-height:1.25;\">Reading a scan you didn’t take<\u002Fdiv>\n              <div style=\"font-size:13.5px; color:#757575; margin-top:5px;\">Fifteen minutes · three units<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:right; flex-shrink:0;\">\n              <div style=\"font-size:22px; font-weight:700; color:#205FA6;\">12<span style=\"font-size:14px; color:#9AA0A6;\">/30<\u002Fspan><\u002Fdiv>\n              <div style=\"width:96px; height:7px; background:#EDEFF2; border-radius:4px; overflow:hidden; margin-top:6px;\"><div style=\"height:7px; background:#205FA6; border-radius:4px; width:40%;\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:22px 26px; margin-bottom:14px;\">\n          <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:14px;\">UNIT 1 · WATCH<\u002Fdiv>\n          <div style=\"position:relative; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#1A1A1A; margin-bottom:14px;\">\n            <image-slot id=\"intern-day-clip\" shape=\"rect\" placeholder=\"{{ dayClip.placeholder }}\"><\u002Fimage-slot>\n            <div style=\"position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;\">\n              <div style=\"width:60px; height:60px; border-radius:50%; background:rgba(0,0,0,0.45); border:1.5px solid rgba(255,255,255,0.55); display:flex; align-items:center; justify-content:center;\">\n                <div style=\"width:0; height:0; border-left:18px solid #fff; border-top:11px solid transparent; border-bottom:11px solid transparent; margin-left:5px;\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute; bottom:0; left:0; right:0; padding:22px 16px 12px; background:linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0)); pointer-events:none;\">\n              <div style=\"font-size:12.5px; font-weight:600; color:#fff;\">{{ dayClip.caption }}<\u002Fdiv>\n              <div style=\"font-size:11.5px; color:rgba(255,255,255,0.8); margin-top:2px;\">{{ dayClip.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14.5px; color:#3D3D3D; line-height:1.7;\">Dana walks through an abdominal scan somebody else took and says out loud what she is looking for. Watch what she does when she isn’t sure.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:22px 26px; margin-bottom:14px;\">\n          <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:14px;\">UNIT 2 · DO IT<\u002Fdiv>\n          <div style=\"font-size:16.5px; font-weight:700; line-height:1.4; margin-bottom:8px;\">Dana flagged one image for the radiologist. Which one, and why?<\u002Fdiv>\n          <div style=\"font-size:13.5px; color:#757575; margin-bottom:16px;\">No wrong answers that cost you anything. You will see her reasoning after.<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:9px;\">\n            <sc-for list=\"{{ dayOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"text-align:left; border:1px solid {{ o.border }}; background:{{ o.bg }}; padding:15px 17px; border-radius:12px; cursor:pointer; display:flex; gap:12px; align-items:flex-start;\">\n                <div style=\"width:22px; height:22px; border-radius:50%; border:1.5px solid {{ o.dotBorder }}; background:{{ o.dotBg }}; flex-shrink:0; margin-top:1px;\"><\u002Fdiv>\n                <div style=\"font-size:14px; color:#1A1A1A; line-height:1.5; font-weight:{{ o.weight }};\">{{ o.label }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ dayAnswered }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#EAF2FB; border:1px solid #D6E5F7; border-radius:12px; padding:16px 18px; margin-top:14px;\">\n              <div style=\"font-size:13px; font-weight:700; color:#1A4F87; margin-bottom:6px;\">What Dana said<\u002Fdiv>\n              <div style=\"font-size:14px; color:#3D3D3D; line-height:1.65;\">The third one. The edge of the mass was irregular, and she said the thing she can never say to a patient is what she thinks it is. She writes what she sees and lets the radiologist name it.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:22px 26px; margin-bottom:14px;\">\n          <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:14px;\">UNIT 3 · STAND-UP<\u002Fdiv>\n          <div style=\"font-size:16.5px; font-weight:700; line-height:1.4; margin-bottom:6px;\">Thirty seconds. What did you work on, and what surprised you?<\u002Fdiv>\n          <div style=\"font-size:13.5px; color:#757575; margin-bottom:16px;\">Record it or type it. Both end up in your Passport, and this is the part that turns into interview answers.<\u002Fdiv>\n          <div style=\"display:flex; gap:9px; flex-wrap:wrap; margin-bottom:14px;\">\n            <button sc-camel-on-click=\"{{ toggleRecord }}\" style=\"border:none; background:{{ recordBg }}; color:{{ recordColor }}; font-size:14px; font-weight:700; padding:12px 20px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:9px;\">\n              <div style=\"width:10px; height:10px; border-radius:50%; background:{{ recordDot }};\"><\u002Fdiv>\n              {{ recordLabel }}\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ toggleType }}\" style=\"border:1px solid #CCCCCC; background:#fff; color:#575757; font-size:14px; font-weight:600; padding:12px 20px; border-radius:10px; cursor:pointer;\">Type it instead<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ typeOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <textarea placeholder=\"Today I worked on... What surprised me was...\" style=\"width:100%; min-height:100px; border:1px solid #CCCCCC; border-radius:12px; padding:14px; font-size:14px; line-height:1.6; resize:vertical;\"><\u002Ftextarea>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:20px 26px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;\">\n          <div style=\"font-size:13.5px; color:#757575;\">Day 12 done means 18 to go. You can stop for good at any point and it still counts as finding out.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ goPassport }}\" style=\"border:none; background:#205FA6; color:#fff; font-size:14.5px; font-weight:700; padding:13px 22px; border-radius:11px; cursor:pointer;\">Finish day 12<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ internStopped }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:24px 26px;\">\n            <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:14px;\">STOPPED {{ internSummary.when }} · DAY {{ internSummary.day }} OF 30 · 18 POINTS KEPT<\u002Fdiv>\n            <div style=\"font-size:22px; font-weight:700; line-height:1.3; margin-bottom:8px;\">You stopped, and that was the answer<\u002Fdiv>\n            <div style=\"font-size:15px; color:#575757; line-height:1.7; margin-bottom:20px; max-width:620px;\">{{ internSummary.why }}<\u002Fdiv>\n            <div style=\"background:#F5F7FA; border-radius:14px; padding:18px 20px; margin-bottom:18px;\">\n              <div style=\"font-size:10.5px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:9px;\">WHAT YOU WROTE ON DAY 9<\u002Fdiv>\n              <div style=\"font-size:16px; font-weight:600; line-height:1.6;\">{{ internSummary.wrote }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#EAF2FB; border:1px solid #D6E5F7; border-radius:14px; padding:16px 18px; margin-bottom:20px;\">\n              <div style=\"font-size:14px; color:#3D3D3D; line-height:1.65;\">{{ internSummary.kept }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:9px; flex-wrap:wrap;\">\n              <button sc-camel-on-click=\"{{ goPassport }}\" style=\"border:none; background:#205FA6; color:#fff; font-size:14px; font-weight:700; padding:12px 20px; border-radius:10px; cursor:pointer;\">See it in your Passport<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ goInternships }}\" style=\"border:1px solid #CCCCCC; background:#fff; color:#575757; font-size:14px; font-weight:600; padding:12px 20px; border-radius:10px; cursor:pointer;\">Back to internships<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noDayContent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:26px 28px;\">\n            <div style=\"font-size:19px; font-weight:700; margin-bottom:8px;\">This internship isn’t built yet<\u002Fdiv>\n            <div style=\"font-size:14.5px; color:#575757; line-height:1.7; max-width:600px; margin-bottom:20px;\">Thirty days is thirty days of real tasks from someone who does the job. Until that’s filmed and written, there’s nothing here worth your fifteen minutes. Sonography is finished.<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ openSonoDay }}\" style=\"border:none; background:#205FA6; color:#fff; font-size:14px; font-weight:700; padding:12px 20px; border-radius:10px; cursor:pointer;\">See the sonography internship<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isIntroships }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Introships\">\n        <div style=\"font-size:24px; font-weight:700; margin-bottom:3px;\">Introships<\u002Fdiv>\n        <div style=\"font-size:14px; color:#757575; margin-bottom:20px; max-width:640px;\">10 minutes inside one job. Thirteen questions on the real day, the pay, and the way in. Three points each, and worth it even when the answer is no.<\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid #D6E5F7; border-radius:18px; padding:22px 24px; margin-bottom:18px;\">\n          <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:5px;\">\n            <div style=\"font-size:11px; font-weight:700; color:#5A87BC; letter-spacing:0.05em;\">GOING DEEPER · {{ ladder.title }}<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:#757575;\">{{ ladder.note }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14.5px; color:#575757; line-height:1.65; max-width:660px; margin-bottom:18px;\">Three depths, and each one asks a different question. Level 1 is what the job is. Level 2 has you do one real task. Level 3 gives you a whole shift where what you decide early changes what happens later.<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:11px;\">\n            <sc-for list=\"{{ ladder.levels }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <div style=\"border:1px solid {{ l.border }}; background:{{ l.bg }}; border-radius:14px; padding:17px 18px; display:flex; flex-direction:column; gap:9px;\">\n                <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:10px;\">\n                  <div style=\"font-size:11px; font-weight:700; color:{{ l.numColor }}; letter-spacing:0.05em;\">{{ l.num }}<\u002Fdiv>\n                  <div style=\"font-size:11px; font-weight:700; color:{{ l.statusColor }};\">{{ l.status }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:15.5px; font-weight:700; line-height:1.35;\">{{ l.title }}<\u002Fdiv>\n                <div style=\"font-size:13px; color:#575757; line-height:1.55;\">{{ l.desc }}<\u002Fdiv>\n                <div style=\"font-size:12px; color:#9AA0A6;\">{{ l.meta }}<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"margin-top:3px; border:none; background:{{ l.btnBg }}; color:{{ l.btnColor }}; font-size:13.5px; font-weight:700; padding:11px 16px; border-radius:10px; cursor:{{ l.cursor }};\">{{ l.cta }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:16px; padding:16px 18px; margin-bottom:18px;\">\n          <input value=\"{{ libQuery }}\" sc-camel-on-input=\"{{ setLibQuery }}\" placeholder=\"Search by job or field\" style=\"width:100%; border:1px solid #CCCCCC; border-radius:10px; padding:11px 14px; font-size:14px; margin-bottom:14px;\">\n <sc-for list=\"{{ patterns }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"border-left:3px solid #205FA6; padding-left:15px;\">\n                <div style=\"font-size:15px; font-weight:700; line-height:1.4; margin-bottom:4px;\">{{ p.title }}<\u002Fdiv>\n                <div style=\"font-size:13.5px; color:#575757; line-height:1.65;\">{{ p.body }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#F5F7FA; border:1px solid #E6E6E6; border-radius:18px; padding:24px 26px; margin-bottom:14px;\">\n          <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:6px;\">WHAT WE STILL DO NOT KNOW<\u002Fdiv>\n          <div style=\"font-size:13.5px; color:#757575; line-height:1.6; margin-bottom:18px; max-width:640px;\">The honest gaps. Anybody who tells you this is a finished picture of you is selling something.<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <sc-for list=\"{{ unknowns }}\" as=\"u\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; gap:12px; align-items:flex-start;\">\n                <div style=\"flex-shrink:0; width:7px; height:7px; border-radius:50%; background:#C4C4C4; margin-top:7px;\"><\u002Fdiv>\n                <div style=\"min-width:0;\">\n                  <div style=\"font-size:14.5px; font-weight:600; line-height:1.5; margin-bottom:2px;\">{{ u.gap }}<\u002Fdiv>\n                  <div style=\"font-size:13px; color:#757575; line-height:1.55;\">{{ u.how }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n\n        <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:22px 26px; display:flex; flex-direction:column;\">\n          <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:14px;\">NEXT STEP<\u002Fdiv>\n          <div style=\"font-size:19px; font-weight:700; line-height:1.4; margin-bottom:10px;\">Email Cañada College about the spring imaging prerequisite.<\u002Fdiv>\n          <div style=\"font-size:14px; color:#3D3D3D; line-height:1.65; margin-bottom:18px;\">Applications close in March and the science prerequisite fills first. You’ve got the draft written already from day 20.<\u002Fdiv>\n          <button style=\"border:none; background:#205FA6; color:#fff; font-size:14px; font-weight:700; padding:12px 20px; border-radius:10px; cursor:pointer; align-self:flex-start;\">Open the draft<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isLessons }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Life Lessons\">\n        <div style=\"font-size:24px; font-weight:700; margin-bottom:3px;\">Life Lessons<\u002Fdiv>\n        <div style=\"font-size:14px; color:#757575; margin-bottom:20px; max-width:680px;\">The skills every job needs and no job teaches you. Ten minutes each, one point each, and you keep what you write. {{ lessonBuiltNote }}<\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:16px; padding:16px 18px; margin-bottom:18px;\">\n          <input value=\"{{ lessonQuery }}\" sc-camel-on-input=\"{{ setLessonQuery }}\" placeholder=\"Search lessons\" style=\"width:100%; border:1px solid #CCCCCC; border-radius:10px; padding:11px 14px; font-size:14px; margin-bottom:14px;\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px;\">\n            <sc-for list=\"{{ lessonCatChips }}\" as=\"c\" hint-placeholder-count=\"9\">\n              <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"border:1px solid {{ c.border }}; background:{{ c.bg }}; color:{{ c.color }}; font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:999px; cursor:pointer;\">{{ c.label }}<\u002Fbutton  align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;\">\n          <div style=\"min-width:0;\">\n            <div style=\"font-size:24px; font-weight:700; margin-bottom:3px;\">Export your Passport<\u002Fdiv>\n            <div style=\"font-size:14px; color:#757575; max-width:600px;\">Two pages. Take it to a job interview, a college application, or your counselor. It’s yours and it doesn’t need this app to keep working.<\u002Fdiv>\n          <\u002Fdiv>\n          <button style=\"border:none; background:#205FA6; color:#fff; font-size:14px; font-weight:700; padding:12px 20px; border-radius:10px; cursor:pointer; flex-shrink:0;\">Download PDF<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px;\">\n          <sc-for list=\"{{ exportToggles }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"border:1px solid {{ t.border }}; background:{{ t.bg }}; color:{{ t.color }}; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer;\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#E8E8E8; border-radius:18px; padding:26px; display:flex; justify-content:center;\">\n          <div style=\"width:100%; max-width:612px; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,0.12); padding:46px 52px 40px;\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:14px; padding-bottom:16px; border-bottom:2px solid #1A1A1A; margin-bottom:22px;\">\n              <div>\n                <div style=\"font-size:21px; font-weight:700; letter-spacing:-0.3px;\">Maya Chen<\u002Fdiv>\n                <div style=\"font-size:11.5px; color:#575757; margin-top:2px;\">Career Passport · Jefferson High School · June 2027<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:9px; font-weight:700; color:#757575; letter-spacing:0.1em; text-align:right; line-height:1.5;\">MY<br>AMBITION<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:9.5px; font-weight:700; color:#757575; letter-spacing:0.12em; margin-bottom:9px;\">WHAT I FOUND OUT<\u002Fdiv>\n            <div style=\"font-size:12px; color:#1A1A1A; line-height:1.65; margin-bottom:20px;\">I tried six careers and ran two of them for thirty days each. I am pursuing diagnostic medical sonography through Cañada College. I ruled out UX design, accounting, and welding, each for a specific reason I can explain.<\u002Fdiv>\n            <sc-if value=\"{{ exportShowEvidence }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex; gap:0; padding:14px 0; border-top:1px solid #D9D9D9; border-bottom:1px solid #D9D9D9; margin-bottom:20px;\">\n              <sc-for list=\"{{ exportStats }}\" as=\"e\" hint-placeholder-count=\"4\">\n                <div style=\"flex:1; padding-right:10px;\">\n                  <div style=\"font-size:18px; font-weight:700;\">{{ e.value }}<\u002Fdiv>\n                  <div style=\"font-size:8.5px; font-weight:700; color:#757575; letter-spacing:0.06em; margin-top:3px; line-height:1.3;\">{{ e.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ exportShowIn }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:9.5px; font-weight:700; color:#757575; letter-spacing:0.12em; margin-bottom:11px;\">RULED IN<\u002Fdiv>\n            <div style=\"margin-bottom:20px;\">\n              <div style=\"font-size:13.5px; font-weight:700; margin-bottom:4px;\">Diagnostic Medical Sonographer<\u002Fdiv>\n              <div style=\"font-size:11.5px; color:#3D3D3D; line-height:1.6;\">12 internship days completed, introship rated 5 of 5, pathway selected. Evidence: three written reflections and a scan-reading exercise.<\u002Fdiv>\n            <\u002Fdiv>\n sees your work in it. He doesn’t see anything you did before this class or anything you do after it.<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column;\">\n            <sc-for list=\"{{ visibilityRows }}\" as=\"v\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 0; border-bottom:1px solid #F0F0F0; flex-wrap:wrap;\">\n                <div style=\"font-size:13.5px; color:#3D3D3D; min-width:0;\">{{ v.what }}<\u002Fdiv>\n                <div style=\"font-size:12px; font-weight:700; color:{{ v.color }}; background:{{ v.bg }}; padding:5px 11px; border-radius:999px; white-space:nowrap;\">{{ v.who }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid #E6E6E6; border-radius:18px; padding:22px 26px; margin-bottom:14px;\">\n          <div style=\"font-size:11px; font-weight:700; color:#9AA0A6; letter-spacing:0.05em; margin-bottom:16px;\">YOUR STUFF<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px;\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;\">\n              <div style=\"min-width:0; max-width:420px;\">\n                <div style=\"font-size:14.5px; font-weight:600; margin-bottom:3px;\">Take your Passport with you<\u002Fdiv>\n                <div style=\"font-size:13px; color:#757575; line-height:1.6;\">Everything you have done, as a PDF. Works after this class ends and after you graduate.<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ goExport }}\" style=\"border:1px solid #205FA6; background:#fff; color:#205FA6; font-size:13.5px; font-weight:700; padding:11px 18px; border-radius:10px; cursor:pointer; flex-shrink:0;\">Export PDF<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: l += v; n += 1;\n  }\n  const pct = (sum, c) => c ? Math.round(((sum / c) - 1) / 4 * 100) : null;\n  const out = { overall: pct(total, n), answered: n, bands: {} };\n  for (const b of COS_BANDS) out.bands[b.id] = pct(bands[b.id] || 0, counts[b.id] || 0);\n  return out;\n}\n\nconst SCALE = ['No','Mostly no','In between','Mostly yes','Yes'];\n\n// The 13 beats of the sonography introship. Every beat is a guess, then reality.\n// The canonical thirteen. Every level 1 introship is written to this spine:\n// same thirteen questions, same formats, same order, career-specific content.\nconst SPINE = ['THE REVEAL','DAY TO DAY','WHO AND WHERE','SKILLS','WHAT IT PAYS',\n  'HOW YOU GET IN','TIME AND LIFESTYLE','IN YOUR WORDS','YOUR CALL','HOW THE WORK FLOWS',\n  'THE HONEST PART','WHERE IT TAKES YOU','YOUR VERDICT'];\nconst VERDICT_Q = { n:13, label:'YOUR VERDICT', kind:'verdict',\n  labels:['Not for me','Probably not','Curious','Interested','I want this'],\n  wlabel:'On this career' };\n\nconst BEATS = [\n  { n:1, label:'THE REVEAL', kind:'mc',\n    q:'A sonographer is the person who runs the ultrasound. What do they mostly do all day?',\n    options:['Take pictures inside people\\u2019s bodies','Read x-rays a doctor ordered','Draw blood and run lab tests','Assist in surgery'],\n    answer:0,\n    real:'They run a probe over a patient and read what comes back on the screen, live. They’re looking for something specific a doctor asked about, and they have to find it while the patient lies there watching their face.',\n    clip:{ caption:'Sixty seconds inside the job', sub:'CONFIRM: clip to be filmed in an imaging department' } },\n  { n:2, label:'DAY TO DAY', kind:'mr',\n    q:'Myth or real?', statement:'Most of a sonographer\\u2019s day is pregnancy scans.',\n    options:['Myth','Real'], answer:0,\n    real:'Pregnancy scans are what people picture, but most shifts are abdomens, hearts, and blood vessels, and the patients are all ages. Some of them are frightened, and some of them are in pain while you press on them.',\n    followUp:'How do you feel about spending the day with people who are scared or in pain?',\n    followUpOpts:['I would be good at that','I could learn it','That would wear me down','Not sure yet'],\n    deeper:[{ employee:'CONFIRM: a working sonographer', sponsor:'CONFIRM: partner hospital' }] },\n  { n:3, label:'WHO AND WHERE', kind:'mc',\n    q:'Where do most sonographers work, and who is in the room?',\n    options:['A lab, alone with samples','A dark room, one patient at a time','An operating theatre with a full team','A desk, reading images other people took'],\n    answer:1,\n    real:'A dim room, one patient, forty minutes, door closed. Hospitals pay the most and have nights and weekends. Clinics are steadier hours for less money. Travel contracts pay a premium if you will move for thirteen weeks at a time.',\n    clip:{ caption:'A full shift, start to finish', sub:'CONFIRM: clip to be filmed on site' } },\n  { n:4, label:'SKILLS', kind:'pick',\n    q:'Seven things. Pick the three that actually make someone good at this job.',\n    opts:['Holding a position with your arm up for forty minutes','Being fast above all','Reading anatomy off a grainy screen','Memorising every bone in the body','Keeping a frightened stranger calm','Being in charge of a room','Advanced chemistry'],\n    correctSet:[0,2,4],\n    real:'Physical endurance, pattern reading, and calm. You’re doing precise work while managing one person\\u2019s fear, and nobody else is in the room to help. Speed comes later and matters less than being right.' },\n  { n:5, label:'WHAT IT PAYS', kind:'slider',\n    q:'Drag to guess: what does a first-year sonographer make here?',\n    payReal:96000, payLabel:'$96,000', payWhen:'first year, San Mateo County',\n    lowNote:'Most people guess low, usually because two years of school sounds like it should pay like two years of school.',\n    highNote:'High, but not crazy. That’s roughly what a sonographer here makes
