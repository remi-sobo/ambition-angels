<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture a story</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#29241F}a:hover{color:#9D532C}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #F7F4EE; color: #29241F; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.4">

<header style="flex: none; display: flex; align-items: center; gap: 4px; background: #FFFDF9; border-bottom: 1px solid #E3D9CB; padding: 8px 16px 8px 4px">
<a href="Comms.dc.html" aria-label="Cancel and close" style="flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 9px; color: #29241F"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"></path></svg></a>
<div style="min-width: 0">
<h1 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Capture a story</h1>
<div style="font-size: 13px; color: #746C63">Quick now. Add details later at your desk.</div>
</div>
</header>

<form style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px">

<div>
<label for="story-title" style="display: block; font-weight: 600; margin-bottom: 4px">Title</label>
<input id="story-title" type="text" value="A callback after a mock interview" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 12px; background: #FFFDF9; border: 1px solid #CDBEAA; border-radius: 9px; font: inherit; font-size: 16px; color: #29241F">
</div>

<div>
<label for="story-body" style="display: block; font-weight: 600; margin-bottom: 4px">What happened? <span style="font-weight: 400; color: #746C63">Talk or type</span></label>
<div style="display: flex; gap: 8px; margin-bottom: 8px">
<button type="button" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; background: #FFFDF9; border: 1px solid #29241F; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 600; color: #29241F; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11 a6.5 6.5 0 0 0 13 0 M12 17.5 V21"></path></svg>Talk to log</button>
<button type="button" aria-label="Add a photo, optional" style="flex: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 72px; height: 52px; background: #FBF8F2; border: 1px dashed #CDBEAA; border-radius: 12px; font: inherit; font-size: 12px; color: #746C63; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8 h3 l2-2.5 h6 L17 8 h3 v11 H4 Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Photo</button>
</div>
<textarea id="story-body" rows="2" style="width: 100%; box-sizing: border-box; padding: 10px 12px; background: #FFFDF9; border: 1px solid #CDBEAA; border-radius: 9px; font: inherit; font-size: 16px; line-height: 1.4; color: #29241F; resize: none">Jaylen practiced with two Northgate staff. They asked him back for a summer job.</textarea>
</div>

<div>
<div id="who-label" style="font-weight: 600; margin-bottom: 4px">Who is it about? <span style="font-weight: 400; color: #746C63">Optional</span></div>
<div role="group" aria-labelledby="who-label" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="display: inline-flex; align-items: center; height: 44px; padding: 0 0 0 12px; background: #FFFDF9; border: 1px solid #CDBEAA; border-radius: 999px"><span style="font-weight: 600">Jaylen M.</span><span style="color: #746C63; padding-left: 4px">· Group B</span><button type="button" aria-label="Remove Jaylen M." style="width: 44px; height: 42px; padding: 0; background: transparent; border: 0; color: #746C63; font: inherit; cursor: pointer">&#10005;</button></span>
<button type="button" style="height: 44px; padding: 0 12px; background: transparent; border: 1px dashed #CDBEAA; border-radius: 999px; font: inherit; color: #746C63; cursor: pointer">+ Add someone</button>
</div>
<div style="font-size: 12px; color: #746C63; margin-top: 4px">Shown as first name and last initial only.</div>
</div>

<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; font-weight: 600; margin-bottom: 4px">Can someone be identified?</legend>
<div style="display: flex; flex-direction: column; gap: 8px">
<label style="display: block; background: #FFFDF9; border: 2px solid #29241F; border-radius: 12px; padding: 10px 12px 12px">
<span style="display: flex; align-items: center; gap: 12px; min-height: 28px"><input type="radio" name="identify" checked style="width: 20px; height: 20px; margin: 0; accent-color: #29241F"><span style="font-weight: 600">It names or shows a participant</span></span>
<span style="display: block; margin-top: 8px; background: #F5EAD6; border-radius: 9px; padding: 10px 12px">
<span style="display: block; color: #965C1C; font-weight: 600">This story names a participant. It cannot be used until a guardian's consent is on file.</span>
<span style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px">
<span style="font-size: 12px; color: #965C1C">To the guardian on file</span>
<button type="button" style="flex: none; height: 44px; padding: 0 14px; background: #FFFDF9; border: 1px solid #965C1C; border-radius: 9px; font: inherit; font-weight: 600; color: #965C1C; cursor: pointer">Request consent</button>
</span>
</span>
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; background: #FFFDF9; border: 1px solid #CDBEAA; border-radius: 12px; padding: 0 12px">
<input type="radio" name="identify" style="width: 20px; height: 20px; margin: 0; accent-color: #29241F">
<span><span style="display: block; font-weight: 600">No one identifiable</span><span style="display: block; font-size: 12px; color: #746C63">No names, faces or details that point to one teen</span></span>
</label>
</div>
</fieldset>

</form>

<div style="flex: none; background: #F7F4EE; padding: 8px 16px 4px; border-top: 1px solid #E3D9CB">
<button type="button" style="width: 100%; height: 52px; background: #9D532C; color: #FFFFFF; border: 0; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Save story</button>
<div style="font-size: 12px; color: #746C63; text-align: center; margin-top: 2px">Saves to Comms as waiting on consent</div>
</div>

<nav aria-label="Main" style="flex: none; display: flex; align-items: flex-end; justify-content: space-around; height: 76px; box-sizing: border-box; padding: 0 8px 16px; background: #FFFDF9; border-top: 1px solid #E3D9CB">
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 64px; height: 52px; font-size: 12px; color: #746C63; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5 V12 L15 14"></path></svg>Today</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 64px; height: 52px; font-size: 12px; color: #746C63; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 12 L11 15 L16 9"></path></svg>Work</a>
<a href="#" aria-current="page" aria-label="Capture" style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin-bottom: 4px; border-radius: 999px; background: #29241F; color: #FFFDF9; outline: 2px solid #C96B38; outline-offset: 3px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11 a6.5 6.5 0 0 0 13 0 M12 17.5 V21"></path></svg></a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 72px; height: 52px; font-size: 12px; color: #746C63; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20 C5 15 3.5 11.5 3.5 8.8 A4.3 4.3 0 0 1 12 7 A4.3 4.3 0 0 1 20.5 8.8 C20.5 11.5 19 15 12 20 Z"></path></svg>Fundraising</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 64px; height: 52px; font-size: 12px; color: #746C63; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12 H5.01 M12 12 H12.01 M19 12 H19.01" stroke-width="3"></path></svg>More</a>
</nav>

</div>
</x-dc>
